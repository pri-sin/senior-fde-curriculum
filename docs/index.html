<script type="application/json" id="data">[{"id": "m01", "num": "01", "dir": "01_python_linux", "title": "Python Async Internals & Linux Core", "track": "Foundations", "readme": "# Intuition & Mental Model\n\nAn asyncio program is **one thread running a to-do list of tasks that politely hand the CPU back whenever they wait**. Waiting on a socket costs almost nothing; computing or calling a blocking library freezes *everyone*. That single fact explains most \"the service is slow but CPU is at 12%\" tickets.\n\nIn enterprise deployments you are rarely writing the clever algorithm. You are writing the glue that fans out 200 upstream calls, must never exceed a partner's rate limit, and must exit cleanly when Kubernetes sends SIGTERM. The Linux layer matters because the failure modes are OS-level: file-descriptor exhaustion, `TIME_WAIT` pile-ups, cgroup memory kills (OOMKilled, exit 137), and CPU throttling that looks like random latency.\n\nMental model in three rules:\n1. **Never block the loop.** Blocking calls go to an executor (threads for blocking I/O, processes for CPU).\n2. **Everything is bounded.** Bounded queues, bounded concurrency, bounded retries, bounded timeouts. Unbounded is a future outage.\n3. **Shutdown is a feature.** Stop accepting, drain in-flight work, then exit, within the pod's grace period.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  sig[\"SIGTERM\"] --> stop[\"stop_event.set()<br/>stop accepting work\"]\n  prod[\"Producers<br/>HTTP or Kafka\"] -->|\"put() blocks when full: backpressure\"| q[\"Bounded queue<br/>maxsize 1000\"]\n  q -->|\"get()\"| w[\"N worker tasks<br/>per-attempt timeout<br/>retry with jittered backoff\"]\n  w --> sem[\"Semaphore<br/>max 20 upstream calls\"] --> up[\"Upstream API<br/>network boundary\"]\n  w -.->|\"CPU-bound work\"| ex[\"Thread or process pool<br/>run_in_executor\"]\n  stop -.->|\"drain in-flight work, then exit\"| w\n  w --> mon[\"Loop-lag monitor, /proc RSS and fd count<br/>JSON logs to stdout\"]\n```\n\nJob states: QUEUED, RUNNING, RETRYING (loops back to RUNNING), then DONE, FAILED, or DROPPED when shutdown outlasts the drain timeout.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **asyncio single process** (this lab) | Lowest for I/O-bound fan-out; poor tail if loop blocked | Thousands of sockets per core; one core of CPU | Medium: discipline about blocking calls | Lowest: few pods |\n| **Threads (ThreadPoolExecutor / sync framework)** | Good; context switching adds jitter | Hundreds of threads, GIL limits CPU work | Low: familiar model, races possible | Medium: more memory per concurrent call |\n| **Multiprocess / Celery / Ray workers** | Higher (serialization, broker hop) | Horizontal and CPU-parallel | High: brokers, idempotency, ops | Highest: broker + more nodes |\n\n# Enterprise War Stories & Edge Cases\n\n**1. The \"healthy\" pod that served nothing.** A PDF-parsing call (`pypdf`, synchronous) ran inside an `async def` handler. Under load, the loop stalled 8 s at a time; liveness probes timed out and Kubernetes restarted pods in a cascade. *Remediation:* move parsing to a process pool, add a loop-lag gauge with an alert at p99 > 250 ms, and make the liveness probe a loop-served endpoint so stalls are visible.\n\n**2. `OSError: Too many open files` at 02:00.** A nightly batch opened an `aiohttp` session per request. fds leaked until the 1024 soft `ulimit -n` was hit, and even log writes failed. *Remediation:* one shared client per process, `ulimit -n` raised via the container runtime, an fd-count metric read from `/proc/self/fd`, and a connection-pool limit that is lower than the fd limit.\n\n**3. Retry storm after an upstream blip.** A vendor returned 503 for 40 s; 300 workers retried on a fixed 1 s interval, amplifying load so the vendor stayed down for 25 more minutes and our bill spiked. *Remediation:* exponential backoff with full jitter, retry budgets (cap total retries as a fraction of traffic), a circuit breaker, and honoring `Retry-After`.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design the ingestion worker tier for a bank that must enrich 40 million documents per night through a rate-limited third-party KYC API (600 req/s contractual cap) in an 6-hour window, on Kubernetes, with exactly-once-effective semantics and clean rollouts.\n\n**Requirements**\n- Throughput: finish 40M docs in <= 6 h; API cap 600 req/s shared across all pods.\n- Reliability: no lost documents; duplicates tolerated only if the downstream write is idempotent.\n- Operability: SIGTERM during a rolling deploy must lose zero in-flight work; p99 loop lag < 250 ms.\n\n**Sizing**\n- Needed rate: 40,000,000 / 21,600 s = **1,852 docs/s**. One doc = 1 API call, so the cap (600/s) is the bottleneck: 40M / 600 = 66,667 s = **18.5 h**. The design cannot meet the SLA as stated. Present this immediately: options are a negotiated cap of >= 2,000 req/s, batching endpoints (10 docs/call needs only 185 calls/s), or caching on content hash (a 70% duplicate rate cuts calls to 12M = 5.5 h at 600/s).\n- With batching at 10: 185 req/s, mean latency 120 ms, so Little's Law gives concurrency = 185 x 0.12 = **~22 in flight**. One asyncio pod with Semaphore(32) suffices; run 4 pods for availability, each with a leased rate share of 150 req/s (Redis token bucket).\n- Queue: 40M x 2 KB metadata = 80 GB in Kafka at RF3 = 240 GB; 12 partitions per consumer group, 4 pods x 3 partitions.\n- Memory: 22 in flight x 50 KB + queue buffer 1,000 x 2 KB = tiny; budget 512 MiB per pod, mostly interpreter and libraries.\n\n**Component breakdown**\n1. Kafka topic `docs.pending` (partitioned by tenant) with a DLQ `docs.failed`.\n2. Worker pod: consumer -> bounded `asyncio.Queue(1000)` -> N workers -> semaphore -> batcher -> API. Offsets commit only after the idempotent write (key = content hash + version).\n3. Distributed token bucket in Redis (Lua script) so pod count can change without breaching the cap.\n4. Shutdown: preStop hook sleeps 5 s (endpoints deregister), SIGTERM sets the stop event, consumer pauses, drain with timeout = `terminationGracePeriodSeconds - 10`, uncommitted messages are simply re-read.\n5. Observability: loop-lag gauge, queue depth, retry ratio, fd count, per-attempt latency histogram.\n\n**Failure modes**\n- Upstream brownout: circuit breaker opens after 50% errors over 20 s; consumers pause rather than burn retry budget; backoff with full jitter.\n- Poison document: after 3 permanent failures route to the DLQ with the error payload; never block the partition.\n- Pod OOMKilled: bounded queue plus bounded batch size; offsets uncommitted so work is redelivered.\n- Duplicate processing after rebalance: idempotent upsert key prevents double effects.\n- Clock/rate drift between pods: leases expire in 1 s so a crashed pod's share returns quickly.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's VP of Platform says: *\"Your async service passed the pilot, but last week it froze during a rolling deploy and we dropped 3,000 records. Python can't do this. Our Java team says we should rewrite it.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You're right to be frustrated, and I'd rather give you the facts than a defence. On the night of the deploy, Kubernetes sent a termination signal, our worker stopped taking new work, but the drain window we'd configured was 5 seconds while a batch of enrichment calls takes up to 30. The pod was killed with about 3,000 records in memory. That was a configuration gap on our side, not a language limit.\"\n\n*Impact.* \"The business impact is concrete: 3,000 records were not enriched on time, which delayed the morning compliance report for those accounts. The more important point is the risk it exposed, that any deploy could repeat it, and I understand why that makes a rewrite sound attractive.\"\n\n*Remedy.* \"Three changes, all in place by Friday, with evidence you can inspect. First, we commit offsets only after the write succeeds, so a killed pod means redelivery, never loss. Second, the drain window is now 45 seconds, matched to the worst-case call, and we test it in your staging cluster by killing pods mid-batch during a load test. Third, we've added loop-lag and in-flight gauges to your Grafana so you can see health yourself. A rewrite would cost roughly two quarters and would not by itself change any of those three controls; the same gap could appear in Java. If after the load test you still want to evaluate Java, I'll support a time-boxed comparison on the same acceptance criteria.\"\n", "lab": "\"\"\"Module 01 lab: a bounded async worker pool with backpressure, retries, executor offload,\ngraceful shutdown, event-loop lag monitoring and Linux /proc introspection.\n\nRun: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport hashlib\nimport json\nimport logging\nimport os\nimport random\nimport signal\nimport sys\nimport time\nfrom concurrent.futures import ProcessPoolExecutor\nfrom enum import Enum\nfrom pathlib import Path\nfrom typing import Awaitable, Callable, TypeVar\n\nfrom pydantic import BaseModel, ConfigDict, Field, ValidationError\n\nT = TypeVar(\"T\")\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"ts\": round(record.created, 3), \"level\": record.levelname,\n                   \"logger\": record.name, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        if record.exc_info:\n            payload[\"exc\"] = self.formatException(record.exc_info)\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    log = logging.getLogger(name)\n    if not log.handlers:\n        handler = logging.StreamHandler(sys.stdout)\n        handler.setFormatter(JsonFormatter())\n        log.addHandler(handler)\n        log.setLevel(logging.INFO)\n        log.propagate = False\n    return log\n\n\nlog = get_logger(\"lab01\")\n\n\nclass LabError(Exception):\n    \"\"\"Base class for all lab errors.\"\"\"\n\n\nclass TransientUpstreamError(LabError):\n    \"\"\"Retryable failure (timeouts, 5xx).\"\"\"\n\n\nclass PermanentJobError(LabError):\n    \"\"\"Non-retryable failure (validation, 4xx).\"\"\"\n\n\nclass PoolClosedError(LabError):\n    \"\"\"Submission attempted after shutdown began.\"\"\"\n\n\nclass RetryPolicy(BaseModel):\n    model_config = ConfigDict(frozen=True)\n    max_attempts: int = Field(4, ge=1, le=10)\n    base_delay_s: float = Field(0.05, gt=0)\n    max_delay_s: float = Field(2.0, gt=0)\n    attempt_timeout_s: float = Field(1.0, gt=0)\n\n\nasync def retry_async(fn: Callable[[], Awaitable[T]], policy: RetryPolicy, *, op: str) -> T:\n    \"\"\"Exponential backoff with full jitter; only TransientUpstreamError/timeouts are retried.\n\n    `fn` owns its per-attempt timeout, so time spent queueing for a semaphore is never charged to the upstream.\"\"\"\n    for attempt in range(1, policy.max_attempts + 1):\n        try:\n            return await fn()\n        except (TransientUpstreamError, asyncio.TimeoutError) as exc:\n            if attempt == policy.max_attempts:\n                raise TransientUpstreamError(f\"{op}: exhausted {attempt} attempts\") from exc\n            cap = min(policy.max_delay_s, policy.base_delay_s * 2 ** (attempt - 1))\n            delay = random.uniform(0, cap)\n            log.warning(\"retrying\", extra={\"ctx\": {\"op\": op, \"attempt\": attempt, \"delay_s\": round(delay, 3)}})\n            await asyncio.sleep(delay)\n    raise AssertionError(\"unreachable\")\n\n\nclass JobStatus(str, Enum):\n    DONE = \"done\"\n    FAILED = \"failed\"\n    DROPPED = \"dropped\"\n\n\nclass Job(BaseModel):\n    job_id: int = Field(ge=0)\n    payload: str = Field(min_length=1, max_length=4096)\n    cpu_heavy: bool = False\n\n\nclass JobResult(BaseModel):\n    job_id: int\n    status: JobStatus\n    digest: str | None = None\n    attempts_note: str | None = None\n    elapsed_ms: float = 0.0\n\n\ndef cpu_digest(payload: str, rounds: int = 200_000) -> str:\n    \"\"\"CPU-bound work: runs in a process pool so it cannot stall the event loop.\"\"\"\n    h = payload.encode()\n    for _ in range(rounds // 1000):\n        for _ in range(1000):\n            h = hashlib.sha256(h).digest()\n    return h.hex()[:16]\n\n\nclass FlakyUpstream:\n    \"\"\"Deterministic stand-in for a remote API that fails transiently some of the time.\"\"\"\n\n    def __init__(self, failure_rate: float, seed: int = 7) -> None:\n        self._rng = random.Random(seed)\n        self._failure_rate = failure_rate\n        self.calls = 0\n\n    async def call(self, payload: str) -> str:\n        self.calls += 1\n        await asyncio.sleep(self._rng.uniform(0.005, 0.03))\n        roll = self._rng.random()\n        if roll < self._failure_rate:\n            raise TransientUpstreamError(\"503 from upstream\")\n        if roll > 0.995:\n            await asyncio.sleep(5)  # hung connection, killed by attempt timeout\n        return f\"echo:{payload}\"\n\n\nclass LoopLagMonitor:\n    \"\"\"Measures how late a 100 ms sleep wakes up; large drift means something blocked the loop.\"\"\"\n\n    def __init__(self, interval_s: float = 0.1) -> None:\n        self.interval_s = interval_s\n        self.max_lag_ms = 0.0\n        self._task: asyncio.Task[None] | None = None\n\n    async def _run(self) -> None:\n        while True:\n            start = time.perf_counter()\n            await asyncio.sleep(self.interval_s)\n            lag = (time.perf_counter() - start - self.interval_s) * 1000\n            self.max_lag_ms = max(self.max_lag_ms, lag)\n\n    def start(self) -> None:\n        self._task = asyncio.create_task(self._run(), name=\"loop-lag\")\n\n    async def stop(self) -> None:\n        if self._task:\n            self._task.cancel()\n            await asyncio.gather(self._task, return_exceptions=True)\n\n\ndef proc_snapshot() -> dict[str, int | None]:\n    \"\"\"Read RSS and open-fd count from /proc (Linux); returns None values elsewhere (e.g. macOS).\"\"\"\n    rss_kb: int | None = None\n    status = Path(\"/proc/self/status\")\n    if status.exists():\n        for line in status.read_text().splitlines():\n            if line.startswith(\"VmRSS:\"):\n                rss_kb = int(line.split()[1])\n    fd_dir = Path(\"/proc/self/fd\")\n    open_fds = len(list(fd_dir.iterdir())) if fd_dir.exists() else None\n    return {\"rss_kb\": rss_kb, \"open_fds\": open_fds, \"pid\": os.getpid()}\n\n\nclass WorkerPool:\n    def __init__(self, upstream: FlakyUpstream, *, workers: int = 8, queue_size: int = 32,\n                 upstream_concurrency: int = 4, policy: RetryPolicy | None = None,\n                 proc_pool: ProcessPoolExecutor | None = None) -> None:\n        self._upstream = upstream\n        self._queue: asyncio.Queue[Job | None] = asyncio.Queue(maxsize=queue_size)\n        self._sem = asyncio.Semaphore(upstream_concurrency)\n        self._policy = policy or RetryPolicy()\n        self._proc_pool = proc_pool\n        self._n_workers = workers\n        self._tasks: list[asyncio.Task[None]] = []\n        self._closing = False\n        self.results: list[JobResult] = []\n\n    def start(self) -> None:\n        self._tasks = [asyncio.create_task(self._worker(i), name=f\"worker-{i}\") for i in range(self._n_workers)]\n\n    async def submit(self, job: Job) -> None:\n        if self._closing:\n            raise PoolClosedError(\"pool is draining\")\n        await self._queue.put(job)  # blocks when full: this is the backpressure\n\n    async def _process(self, job: Job) -> JobResult:\n        t0 = time.perf_counter()\n        try:\n            async def attempt() -> str:\n                async with self._sem:  # wait for a slot outside the clock\n                    return await asyncio.wait_for(self._upstream.call(job.payload), self._policy.attempt_timeout_s)\n\n            reply = await retry_async(attempt, self._policy, op=f\"job-{job.job_id}\")\n            digest: str | None = None\n            if job.cpu_heavy and self._proc_pool is not None:\n                digest = await asyncio.get_running_loop().run_in_executor(self._proc_pool, cpu_digest, reply)\n            return JobResult(job_id=job.job_id, status=JobStatus.DONE, digest=digest,\n                             elapsed_ms=round((time.perf_counter() - t0) * 1000, 2))\n        except LabError as exc:\n            return JobResult(job_id=job.job_id, status=JobStatus.FAILED, attempts_note=str(exc),\n                             elapsed_ms=round((time.perf_counter() - t0) * 1000, 2))\n\n    async def _worker(self, idx: int) -> None:\n        while True:\n            job = await self._queue.get()\n            try:\n                if job is None:\n                    return\n                try:\n                    self.results.append(await self._process(job))\n                except asyncio.CancelledError:  # drain deadline hit while this job was in flight\n                    self.results.append(JobResult(job_id=job.job_id, status=JobStatus.DROPPED))\n                    raise\n                except Exception as exc:  # one poison job must not kill the worker\n                    log.error(\"job crashed\", extra={\"ctx\": {\"job_id\": job.job_id, \"error\": repr(exc)}})\n                    self.results.append(JobResult(job_id=job.job_id, status=JobStatus.FAILED, attempts_note=type(exc).__name__))\n            finally:\n                self._queue.task_done()\n\n    async def drain(self, timeout_s: float) -> int:\n        \"\"\"Stop intake, finish work within ONE deadline (queued, in-flight, worker exit); the rest is DROPPED. Returns dropped count.\"\"\"\n        self._closing = True\n        dropped = 0\n        deadline = time.monotonic() + timeout_s\n        try:\n            await asyncio.wait_for(self._queue.join(), timeout=timeout_s)\n        except asyncio.TimeoutError:\n            while not self._queue.empty():\n                job = self._queue.get_nowait()\n                self._queue.task_done()\n                if job is not None:\n                    dropped += 1\n                    self.results.append(JobResult(job_id=job.job_id, status=JobStatus.DROPPED))\n        for _ in self._tasks:\n            self._queue.put_nowait(None)\n        _, pending = await asyncio.wait(self._tasks, timeout=max(0.0, deadline - time.monotonic()))\n        for task in pending:  # in-flight past the deadline: cancel, the worker records DROPPED\n            task.cancel()\n        await asyncio.gather(*pending, return_exceptions=True)\n        return dropped + len(pending)\n\n\ndef install_signal_handlers(loop: asyncio.AbstractEventLoop, stop: asyncio.Event) -> None:\n    for sig in (signal.SIGINT, signal.SIGTERM):\n        try:\n            loop.add_signal_handler(sig, stop.set)\n        except NotImplementedError:  # Windows\n            signal.signal(sig, lambda *_: loop.call_soon_threadsafe(stop.set))\n\n\nasync def main() -> None:\n    stop = asyncio.Event()\n    install_signal_handlers(asyncio.get_running_loop(), stop)\n    monitor = LoopLagMonitor()\n    monitor.start()\n    upstream = FlakyUpstream(failure_rate=0.25)\n    with ProcessPoolExecutor(max_workers=2) as procs:\n        pool = WorkerPool(upstream, proc_pool=procs)\n        pool.start()\n        log.info(\"started\", extra={\"ctx\": proc_snapshot()})\n        for i in range(120):\n            if stop.is_set():\n                break\n            try:\n                job = Job(job_id=i, payload=f\"doc-{i}\", cpu_heavy=(i % 15 == 0))\n            except ValidationError as exc:  # pragma: no cover - payloads above are valid\n                raise PermanentJobError(str(exc)) from exc\n            await pool.submit(job)\n        dropped = await pool.drain(timeout_s=10)\n    await monitor.stop()\n    by_status: dict[str, int] = {}\n    for r in pool.results:\n        by_status[r.status.value] = by_status.get(r.status.value, 0) + 1\n    log.info(\"finished\", extra={\"ctx\": {\"by_status\": by_status, \"dropped\": dropped, \"upstream_calls\": upstream.calls,\n                                         \"max_loop_lag_ms\": round(monitor.max_lag_ms, 2), **proc_snapshot()}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m02", "num": "02", "dir": "02_api_backend", "title": "High-Throughput APIs & Streaming", "track": "Foundations", "readme": "# Intuition & Mental Model\n\nAn LLM-backed API is not a normal CRUD API. A request can last 30 seconds, produce output one token at a time, and cost real money per call. Three things follow:\n\n1. **Stream, don't wait.** Users judge speed by time-to-first-token, not total time. Server-Sent Events (SSE) push tokens over plain HTTP; WebSockets add a two-way channel when the client must interrupt or send follow-ups on the same connection.\n2. **Admission control is a product feature.** If one tenant can burn the whole GPU/LLM quota, everyone else sees outages. A **token bucket** gives each tenant a steady refill rate plus a burst allowance, and rejects the rest quickly with `429` and `Retry-After`.\n3. **Slow consumers are your problem.** A client on hotel Wi-Fi that reads slowly will make server buffers grow. Bound every buffer and cut off clients that fall behind.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  client[\"Browser or SDK\"] -->|\"POST /v1/chat/stream over TLS\"| lb[\"L7 load balancer<br/>idle timeout 300 s, response buffering off\"]\n  lb --> auth[\"Auth middleware<br/>JWT gives tenant_id\"]\n  auth --> tb{\"Token bucket<br/>acquire(tenant, cost)\"}\n  tb -->|\"denied\"| r429[\"429 + Retry-After<br/>no upstream cost\"]\n  tb -->|\"allowed\"| sess[\"Stream session<br/>bounded queue of 64 events\"]\n  sess <-->|\"prompt out, tokens back\"| llm[\"LLM provider\"]\n  sess -->|\"text/event-stream, ': ping' every 15 s\"| client\n  sess -.->|\"queue full for 5 s: drop slow client, cancel upstream\"| llm\n  ws[\"WebSocket /v1/chat/ws\"] -.->|\"client sends cancel frame\"| sess\n```\n\nRequest states: ADMITTED, STREAMING, then COMPLETED, CANCELLED, CLIENT_SLOW, or UPSTREAM_ERROR.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **SSE over HTTP/1.1-2** | Fast first token; one-way only | Excellent: stateless, works through CDNs and proxies with buffering off | Low | Low |\n| **WebSockets** | Fastest for bidirectional/interrupts | Good, but sticky state, harder LB and auth refresh | Medium-High | Medium (connection-held memory) |\n| **Long polling / chunked JSON** | Worst: perceived latency is full completion | Poor: many reconnects | Low | Medium-High (wasted requests) |\n\nRate limiting alternatives: **token bucket** (burst + steady rate, chosen), fixed window (cheap, allows 2x burst at boundaries), sliding-window log (exact but O(n) memory per key).\n\n# Enterprise War Stories & Edge Cases\n\n**1. Streaming that wasn't.** Everything worked in dev, but in production users saw the whole answer after 20 s. An nginx ingress and a corporate proxy buffered responses. *Remediation:* `X-Accel-Buffering: no`, `Cache-Control: no-cache`, gzip disabled for `text/event-stream`, heartbeat comments every 15 s, and an end-to-end synthetic check that measures time-to-first-byte through the real ingress.\n\n**2. One noisy tenant took the platform down.** A customer script looped on the API with retries and no backoff; a global limiter starved all other tenants. *Remediation:* per-tenant buckets keyed by `tenant_id` (not IP, because NAT hides many users), plan-based capacity and refill, `429` with `Retry-After`, and a cost-weighted acquire (long prompts consume more tokens).\n\n**3. Zombie streams burning money.** Clients closed their tab but the server kept generating for 60 s; thousands of abandoned generations inflated the LLM bill 18%. *Remediation:* detect disconnects (`request.is_disconnected()`, WebSocket close), propagate `CancelledError` to the upstream call, wrap generation in `try/finally` that releases the semaphore and records tokens actually used.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design the streaming chat API for an insurer's claims-assistant: 8,000 concurrent adjusters, 2,500 requests/minute at peak, time-to-first-token (TTFT) p95 <= 800 ms, per-business-unit fairness, behind a corporate proxy that you do not control.\n\n**Requirements**\n- Streaming answers (avg 350 output tokens, 45 tokens/s); user can cancel; reconnect resumes without duplication.\n- Fairness: 12 business units with plan-based quotas; no unit can starve another.\n- Budget: LLM spend capped per unit per day.\n\n**Sizing**\n- Peak arrival rate: 2,500/min = **41.7 req/s**. Average stream duration = 350 / 45 = **7.8 s**. Little's Law: concurrent streams = 41.7 x 7.8 = **~325 active streams** (the 8,000 are connected users, mostly idle).\n- Connection memory: 325 streams x (64-item queue x ~200 B + ~50 KB task/socket state) = ~17 MB. Memory is not the constraint; the **LLM quota** is. Tokens/s from upstream = 325 x 45 = **14,600 tokens/s**; at 350 tokens per answer that is ~42 answers/s.\n- Pod count: one uvicorn worker comfortably handles ~1,000 SSE streams; plan 4 pods (N+2) for rolling deploys across 2 zones.\n- Rate limits: capacity = 2 minutes of the unit's steady share. Unit with 15% share: refill 6.2 req/s, burst 750 tokens of cost. Daily budget: 41.7 x 86,400 x 0.3 duty cycle x $0.01 = ~$10.8k/day total; enforce in a Redis counter.\n- Storage: store usage records 1 KB x 3.6M/day (0.3 duty) = ~3.6 GB/day in a warehouse, not the hot path.\n\n**Component breakdown**\n1. L7 gateway: TLS, JWT validation, `proxy_buffering off`, idle timeout >= 300 s.\n2. API pods (FastAPI): token-bucket admission using Redis Lua (atomic refill + take), cost-weighted by prompt and max tokens.\n3. Stream session: producer/consumer with bounded queue; 15 s heartbeats; slow-consumer cutoff cancels upstream.\n4. Resume: SSE `id:` equals token index; client sends `Last-Event-ID`; completed text is cached 60 s keyed by request id so reconnect replays missed tokens instead of regenerating.\n5. LLM router: two providers, hedged on connection failure only before first token.\n\n**Failure modes**\n- Corporate proxy buffers: detect via synthetic TTFB probe; fall back to WebSocket on a different port when probe fails twice.\n- Redis outage: limiter fails *closed* to a local conservative per-pod bucket (capacity/4) rather than open, which would risk budget overrun.\n- Thundering reconnect after deploy: jittered `retry:` field in SSE and connection draining (preStop 15 s).\n- Upstream mid-stream failure: cannot transparently retry (partial output already shown), so emit an `error` event with a resumable request id.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's lead architect says: *\"We tested your streaming demo from our office and the answer appeared all at once after fifteen seconds. Your streaming doesn't work behind our network. I want a signed statement it will work before we proceed.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"Thank you for testing it from your real network; that is exactly the test that matters. What you saw is almost certainly your outbound proxy buffering the response until it completes. The service was producing tokens from the first second, but the proxy held them. That behaviour is common in networks with TLS-inspecting proxies, and I should have asked about it earlier.\"\n\n*Impact.* \"For your adjusters, a 15-second blank screen is the difference between a tool they trust and one they abandon, so this is a launch-blocking issue, and I'm treating it that way.\"\n\n*Remedy.* \"I won't sign a blanket statement, because I can't verify your proxy from here, but I can commit to something stronger. Within three days we'll run a probe from inside your network that measures time-to-first-byte through the real proxy and reports pass or fail. If the proxy buffers, we have two tested options: ask your network team to exempt `text/event-stream` on this hostname, which is a one-line change they've made for other vendors, or switch your tenant to our WebSocket transport, which proxies handle differently. Either way the acceptance test is the same: first token under 800 milliseconds at the 95th percentile, measured from an adjuster's desk. I'll put that criterion in writing as the exit gate for the pilot.\"\n", "lab": "\"\"\"Module 02 lab: per-tenant token-bucket admission control and SSE streaming with backpressure.\n\nThe core (TokenBucketLimiter, StreamSession, sse_format) is dependency-free beyond Pydantic so the demo\nruns offline: `python3 lab.py`. `create_app()` wires the same core into FastAPI (SSE + WebSocket) when\nfastapi is installed: `uvicorn lab:app --port 8000` (after `pip install fastapi uvicorn`).\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport sys\nimport time\nfrom collections.abc import AsyncIterator\nfrom enum import Enum\nfrom typing import Any\n\nfrom pydantic import BaseModel, ConfigDict, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"ts\": round(record.created, 3), \"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab02\")\n\n\nclass ApiError(Exception):\n    status_code = 500\n\n\nclass RateLimitedError(ApiError):\n    status_code = 429\n\n    def __init__(self, tenant_id: str, retry_after_s: float) -> None:\n        super().__init__(f\"tenant {tenant_id} rate limited\")\n        self.retry_after_s = retry_after_s\n\n\nclass SlowConsumerError(ApiError):\n    status_code = 408\n\n\nclass UpstreamError(ApiError):\n    status_code = 502\n\n\nclass BucketConfig(BaseModel):\n    model_config = ConfigDict(frozen=True)\n    capacity: float = Field(gt=0, description=\"max burst in tokens\")\n    refill_per_s: float = Field(gt=0)\n\n\nclass ChatRequest(BaseModel):\n    tenant_id: str = Field(min_length=1, max_length=64)\n    prompt: str = Field(min_length=1, max_length=8000)\n    max_tokens: int = Field(default=64, ge=1, le=512)\n\n    @property\n    def cost(self) -> float:\n        \"\"\"Cost-weighted admission: long prompts and big completions consume more budget.\"\"\"\n        return 1.0 + len(self.prompt) / 1000 + self.max_tokens / 128\n\n\nclass TokenBucketLimiter:\n    \"\"\"Lazy-refill token bucket per key. Single-process; swap `_state` for Redis+Lua when sharded.\"\"\"\n\n    def __init__(self, default: BucketConfig, overrides: dict[str, BucketConfig] | None = None,\n                 clock: Any = time.monotonic) -> None:\n        self._default = default\n        self._overrides = overrides or {}\n        self._clock = clock\n        self._state: dict[str, tuple[float, float]] = {}\n        self._lock = asyncio.Lock()\n\n    def _cfg(self, key: str) -> BucketConfig:\n        return self._overrides.get(key, self._default)\n\n    async def acquire(self, key: str, cost: float = 1.0) -> None:\n        cfg = self._cfg(key)\n        if cost > cfg.capacity:\n            raise RateLimitedError(key, retry_after_s=float(\"inf\"))\n        async with self._lock:\n            now = self._clock()\n            tokens, last = self._state.get(key, (cfg.capacity, now))\n            tokens = min(cfg.capacity, tokens + (now - last) * cfg.refill_per_s)\n            if tokens < cost:\n                self._state[key] = (tokens, now)\n                raise RateLimitedError(key, retry_after_s=round((cost - tokens) / cfg.refill_per_s, 3))\n            self._state[key] = (tokens - cost, now)\n\n\ndef sse_format(event: str, data: BaseModel | dict[str, Any], event_id: int | None = None) -> str:\n    body = data.model_dump_json() if isinstance(data, BaseModel) else json.dumps(data)\n    prefix = f\"id: {event_id}\\n\" if event_id is not None else \"\"\n    return f\"{prefix}event: {event}\\ndata: {body}\\n\\n\"\n\n\nclass Outcome(str, Enum):\n    COMPLETED = \"completed\"\n    CANCELLED = \"cancelled\"\n    CLIENT_SLOW = \"client_slow\"\n    UPSTREAM_ERROR = \"upstream_error\"\n\n\nclass TokenEvent(BaseModel):\n    index: int\n    text: str\n\n\nclass FakeLLM:\n    \"\"\"Streams tokens with jitter; fails mid-stream when prompt contains 'boom'.\"\"\"\n\n    async def stream(self, prompt: str, max_tokens: int) -> AsyncIterator[str]:\n        words = (prompt.split() or [\"ok\"]) * max_tokens\n        for i, w in enumerate(words[:max_tokens]):\n            await asyncio.sleep(random.uniform(0.001, 0.01))\n            if \"boom\" in prompt and i == 3:\n                raise UpstreamError(\"provider reset connection\")\n            yield w\n\n\nclass StreamSession:\n    \"\"\"Producer/consumer pair joined by a bounded queue; slow consumers are cut off and spend is cancelled.\"\"\"\n\n    def __init__(self, llm: FakeLLM, *, queue_size: int = 8, slow_after_s: float = 0.5,\n                 heartbeat_s: float = 15.0, attempts: int = 3) -> None:\n        self._llm, self._queue_size = llm, queue_size\n        self._slow_after_s, self._heartbeat_s, self._attempts = slow_after_s, heartbeat_s, attempts\n        self.outcome: Outcome | None = None\n\n    async def _produce(self, req: ChatRequest, q: asyncio.Queue[TokenEvent | Exception | None]) -> None:\n        delay = 0.05\n        for attempt in range(1, self._attempts + 1):\n            emitted = 0\n            try:\n                async for tok in self._llm.stream(req.prompt, req.max_tokens):\n                    await asyncio.wait_for(q.put(TokenEvent(index=emitted, text=tok)), self._slow_after_s)\n                    emitted += 1\n                await q.put(None)\n                return\n            except asyncio.TimeoutError:\n                await _put_nowait_safe(q, SlowConsumerError(\"client not reading\"))\n                return\n            except UpstreamError as exc:\n                if emitted > 0 or attempt == self._attempts:  # cannot replay a partially delivered stream\n                    await _put_nowait_safe(q, exc)\n                    return\n                log.warning(\"upstream retry\", extra={\"ctx\": {\"attempt\": attempt}})\n                await asyncio.sleep(random.uniform(0, delay))\n                delay *= 2\n\n    async def run(self, req: ChatRequest) -> AsyncIterator[str]:\n        q: asyncio.Queue[TokenEvent | Exception | None] = asyncio.Queue(maxsize=self._queue_size)\n        producer = asyncio.create_task(self._produce(req, q))\n        try:\n            while True:\n                try:\n                    item = await asyncio.wait_for(q.get(), self._heartbeat_s)\n                except asyncio.TimeoutError:\n                    yield \": ping\\n\\n\"\n                    continue\n                if item is None:\n                    self.outcome = Outcome.COMPLETED\n                    yield sse_format(\"done\", {\"ok\": True})\n                    return\n                if isinstance(item, SlowConsumerError):\n                    self.outcome = Outcome.CLIENT_SLOW\n                    yield sse_format(\"error\", {\"code\": item.status_code, \"message\": str(item)})\n                    return\n                if isinstance(item, Exception):\n                    self.outcome = Outcome.UPSTREAM_ERROR\n                    yield sse_format(\"error\", {\"code\": 502, \"message\": str(item)})\n                    return\n                yield sse_format(\"token\", item, event_id=item.index)\n        except asyncio.CancelledError:\n            self.outcome = Outcome.CANCELLED  # client disconnected\n            raise\n        finally:\n            producer.cancel()  # stops upstream spend immediately\n            await asyncio.gather(producer, return_exceptions=True)\n            log.info(\"stream closed\", extra={\"ctx\": {\"tenant\": req.tenant_id, \"outcome\": self.outcome}})\n\n\nasync def _put_nowait_safe(q: asyncio.Queue[Any], item: Any) -> None:\n    while q.full():\n        q.get_nowait()\n    q.put_nowait(item)\n\n\ndef create_app() -> Any:\n    \"\"\"FastAPI wiring. Imported lazily so the core above has no web-framework dependency.\"\"\"\n    from fastapi import FastAPI, WebSocket, WebSocketDisconnect\n    from fastapi.responses import JSONResponse, StreamingResponse\n\n    app = FastAPI(title=\"Module 02 streaming API\")\n    limiter = TokenBucketLimiter(BucketConfig(capacity=20, refill_per_s=5),\n                                 {\"enterprise\": BucketConfig(capacity=200, refill_per_s=50)})\n    llm = FakeLLM()\n\n    @app.exception_handler(RateLimitedError)\n    async def _rl(_: Any, exc: RateLimitedError) -> JSONResponse:\n        return JSONResponse({\"error\": str(exc)}, status_code=429, headers={\"Retry-After\": str(max(1, int(exc.retry_after_s)))})\n\n    @app.post(\"/v1/chat/stream\")\n    async def chat_stream(req: ChatRequest) -> StreamingResponse:\n        await limiter.acquire(req.tenant_id, req.cost)\n        session = StreamSession(llm)\n        headers = {\"Cache-Control\": \"no-cache\", \"X-Accel-Buffering\": \"no\", \"Connection\": \"keep-alive\"}\n        return StreamingResponse(session.run(req), media_type=\"text/event-stream\", headers=headers)\n\n    @app.websocket(\"/v1/chat/ws\")\n    async def chat_ws(ws: WebSocket) -> None:\n        await ws.accept()\n        try:\n            req = ChatRequest.model_validate(await ws.receive_json())\n            await limiter.acquire(req.tenant_id, req.cost)\n        except RateLimitedError as exc:\n            await ws.send_json({\"type\": \"error\", \"retry_after_s\": exc.retry_after_s})\n            await ws.close(code=1013)\n            return\n        session = StreamSession(llm)\n\n        async def pump() -> None:\n            async for frame in session.run(req):\n                await ws.send_text(frame)\n\n        pump_task = asyncio.create_task(pump())\n        try:\n            while not pump_task.done():\n                msg = await asyncio.wait_for(ws.receive_json(), timeout=60)\n                if msg.get(\"type\") == \"cancel\":\n                    pump_task.cancel()\n                    break\n        except (WebSocketDisconnect, asyncio.TimeoutError):\n            pump_task.cancel()\n        finally:\n            await asyncio.gather(pump_task, return_exceptions=True)\n\n    return app\n\n\ntry:  # allow `uvicorn lab:app`\n    app = create_app()\nexcept ImportError:  # offline demo mode\n    app = None\n\n\nasync def demo() -> None:\n    limiter = TokenBucketLimiter(BucketConfig(capacity=5, refill_per_s=2))\n    admitted = rejected = 0\n    for i in range(12):\n        try:\n            await limiter.acquire(\"tenant-a\", 1.0)\n            admitted += 1\n        except RateLimitedError as exc:\n            rejected += 1\n            if rejected == 1:\n                log.info(\"first rejection\", extra={\"ctx\": {\"retry_after_s\": exc.retry_after_s}})\n    log.info(\"burst result\", extra={\"ctx\": {\"admitted\": admitted, \"rejected\": rejected}})\n\n    ok = ChatRequest(tenant_id=\"tenant-a\", prompt=\"hello streaming world\", max_tokens=6)\n    s1 = StreamSession(FakeLLM())\n    frames = [f async for f in s1.run(ok)]\n    log.info(\"fast consumer\", extra={\"ctx\": {\"frames\": len(frames), \"outcome\": s1.outcome}})\n\n    s2 = StreamSession(FakeLLM(), queue_size=2, slow_after_s=0.05)\n    async for _ in s2.run(ChatRequest(tenant_id=\"tenant-a\", prompt=\"slow client\", max_tokens=200)):\n        await asyncio.sleep(0.2)  # reader far slower than producer\n    log.info(\"slow consumer\", extra={\"ctx\": {\"outcome\": s2.outcome}})\n\n    s3 = StreamSession(FakeLLM())\n    _ = [f async for f in s3.run(ChatRequest(tenant_id=\"tenant-a\", prompt=\"boom now\", max_tokens=10))]\n    log.info(\"upstream failure\", extra={\"ctx\": {\"outcome\": s3.outcome}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(demo())\n"}, {"id": "m03", "num": "03", "dir": "03_cloud_networking", "title": "Cloud Networking, VPC Peering & IAM", "track": "Foundations", "readme": "# Intuition & Mental Model\n\nA cloud network is a set of private rooms (VPCs) with doors (routes) and bouncers (security groups, IAM). Most enterprise AI deployments fail not on the model but on the **plumbing**: \"the app in the vendor's VPC can't reach the customer's database,\" or \"the model endpoint is reachable from the internet and the auditor found it.\"\n\nThree ideas carry 90% of the work:\n1. **Routing is longest-prefix-match.** Traffic goes to the most specific route. Peering adds a route; it does not magically connect everything.\n2. **Peering is not transitive.** If A peers with B and B peers with C, A cannot reach C through B. Hub-and-spoke needs a transit gateway or explicit peerings.\n3. **IAM is deny-by-default and explicit-deny-wins.** Permissions are evaluated as: any matching Deny \u2192 denied; else any matching Allow \u2192 allowed; else denied. Over-broad wildcards (`s3:*` on `*`) are how data leaks happen.\n\nFor a Forward Deployed Engineer this is client-facing: you will sit with a customer network team and must quickly show CIDR overlaps, route paths, and least-privilege roles.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  corp[\"Customer network<br/>10.20.0.0/16\"] -->|\"VPN or Direct Connect\"| tgw[\"Transit gateway (hub)<br/>route tables per trust domain\"]\n  tgw --> app[\"vpc-app 10.30.0.0/16<br/>API pods, role app-runtime\"]\n  tgw --> data[\"vpc-data 10.40.0.0/16<br/>RDS and vector DB\"]\n  app -->|\"5432/tcp, security group allows app SG only\"| data\n  app <-->|\"peering route 172.16.0.0/16\"| vendor[\"vpc-vendor-ai 172.16.0.0/16<br/>model gateway via PrivateLink\"]\n  app -->|\"egress via NAT, FQDN allowlist\"| inet[\"Internet\"]\n  app -->|\"VPC endpoints\"| s3[\"S3 and KMS\"]\n```\n\n```mermaid\nflowchart LR\n  pod[\"Pod\"] -->|\"OIDC web identity\"| sts[\"STS AssumeRole<br/>app-runtime\"] --> creds[\"Temporary credentials<br/>1 hour\"] --> ev{\"Policy evaluation\"}\n  ev -->|\"any explicit Deny\"| d1[\"Denied\"]\n  ev -->|\"Allow, no Deny\"| ok[\"Allowed\"]\n  ev -->|\"nothing matches\"| d2[\"Denied (implicit)\"]\n```\n\nNetwork decision order: route lookup (longest prefix match), then NACL, then security group, then the service's IAM policy, then the resource policy.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **VPC peering (1:1)** | Lowest, no hop through an appliance | Poor at scale: n(n-1)/2 links, non-transitive, no overlapping CIDRs | Low for 2-3 VPCs, painful beyond | Cheapest: data transfer only |\n| **Transit Gateway hub-and-spoke** | +~1 ms, one managed hop | Excellent: thousands of attachments, central route tables | Medium | Hourly attachment fee + per-GB processing |\n| **PrivateLink / VPC endpoints** | Low; one-directional service exposure | Excellent: allows overlapping CIDRs, consumer sees only one endpoint | Medium | Per-endpoint hourly + per-GB |\n\n# Enterprise War Stories & Edge Cases\n\n**1. Overlapping CIDRs killed a pilot.** A bank's on-prem range `10.0.0.0/8` overlapped the vendor's default `10.0.0.0/16` VPC. Peering was impossible, and renumbering production took 6 weeks. *Remediation:* publish a CIDR plan before kickoff, check overlaps programmatically (as in the lab), default to non-RFC1918-collision ranges (e.g. `100.64/10` or documented slices), and fall back to PrivateLink, which tolerates overlap.\n\n**2. The wildcard role that exported the customer's data lake.** An \"AI-pipeline\" role had `s3:*` on `*` for convenience. A prompt-injection in a summarizer tool call listed and copied buckets across accounts. *Remediation:* least-privilege per-bucket-prefix policies, explicit Deny on `s3:PutObject` outside approved buckets, permissions boundaries, `aws:SourceVpce` conditions so credentials work only from the endpoint, and access analyzer in CI.\n\n**3. \"Peering works, but the DB is unreachable.\"** The route existed in only one direction; the data VPC's route table lacked the return route and the security group allowed only the peer's CIDR, not the app SG. Packets arrived and replies were dropped. *Remediation:* a checklist of five layers (routes both ways, NACL, SG, DNS resolution over peering, IAM) and a reachability analyzer run in the runbook before escalating.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** A healthcare network wants our AI assistant to read from three hospital data VPCs (each owned by a different subsidiary) and call a vendor-hosted model gateway. Design the connectivity, IAM, and isolation model. 14 hospital VPCs in year 2, HIPAA scope, PHI must never traverse the public internet.\n\n**Requirements**\n- Private-only paths; no public IPs on data stores or model endpoint.\n- Subsidiaries must not see each other's data or route to each other.\n- Auditable access (who called what, from which VPC endpoint).\n- Added hospital onboarding in < 2 days.\n\n**Sizing**\n- Peering mesh for N=14 data VPCs + 1 AI VPC if full-mesh: 15 x 14 / 2 = **105 peerings**, each with 2 route entries to maintain: 210 routes. Hub-and-spoke with a transit gateway: **15 attachments**, one route table per trust domain. Clear win from N ~ 5.\n- Traffic: 14 hospitals x 40 queries/s x 200 KB retrieval payload = 112 MB/s = **~0.9 Gbps** peak. TGW handles 50 Gbps per attachment, so capacity is not binding. Data processing fee at $0.02/GB x 112 MB/s x 86,400 x 0.3 duty = ~$58/day.\n- IP plan: reserve a /16 per hospital out of 10.64.0.0/10 (64 /16 blocks available) and a /16 for the AI plane. Check against subsidiary on-prem ranges first: overlap makes peering impossible, so use PrivateLink for any collision.\n- IAM: one role per hospital for the retrieval service with a permissions boundary; session duration 1 h; ~15 roles x 3 policies = 45 documents to review per quarter.\n\n**Component breakdown**\n1. Transit gateway with separate route tables: `ai-plane` can route to each hospital; hospital tables do **not** have routes to one another (isolation by absence of routes).\n2. PrivateLink for the vendor model gateway: no peering, overlap-safe, one-way exposure.\n3. Security groups reference SG ids, not CIDRs, so scaling pods does not require rule edits.\n4. IAM: IRSA/OIDC pod identity -> `AssumeRole` with `aws:SourceVpce` conditions; explicit Deny on cross-hospital resource ARNs.\n5. VPC Flow Logs + CloudTrail data events to an immutable log account; Reachability Analyzer in CI for every route change.\n\n**Failure modes**\n- Route table drift (someone adds `0.0.0.0/0` to a TGW table): detect with AWS Config rule and an automated analyzer test asserting hospital-A to hospital-B is unreachable.\n- Overlapping CIDR on onboarding: pre-flight overlap check blocks the pipeline; fall back to PrivateLink.\n- Role compromise: short sessions, SourceVpce condition, anomaly alert on cross-hospital ARN access attempts.\n- DNS: private hosted zones must be associated with every VPC; failure shows as intermittent timeouts, so include a DNS probe in the readiness test.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's CISO says: *\"Peering the vendor's network to ours is a non-starter. I don't want another company's VPC with a route into my hospitals. Show me why this isn't a breach waiting to happen.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You're right about the shape of the risk. A traditional peering gives two networks a mutual route, and if anything on the vendor side were compromised, an attacker could probe whatever the route table exposes. So I'm not going to ask you to accept that design.\"\n\n*Impact.* \"If we got this wrong the exposure would be patient data, a reportable HIPAA incident, and loss of trust across all of your subsidiaries. That is the standard we are designing to, and it's why isolation has to be true by construction, not by promises.\"\n\n*Remedy.* \"Here is what we'll do instead. The vendor model endpoint is exposed to you through PrivateLink: one-way, a single network interface in your VPC, no route table entries into the vendor's network and none from it into yours. The vendor cannot initiate a connection to you at all. Your hospitals stay on separate route tables with no path between them, and I'll prove that with an automated reachability test that fails the deployment if any hospital can reach another. Credentials are short-lived and only valid from your endpoint ID, so a stolen token is useless elsewhere. I'll walk your network team through the route tables and the test output live this week, and your CISO's team can run the analyzer themselves.\"\n", "lab": "\"\"\"Module 03 lab: reachability analyzer and IAM policy evaluator.\n\nModels VPC route tables (longest-prefix match), non-transitive peering, security groups and IAM\npolicy evaluation (explicit deny > allow > implicit deny) so network and permission questions can be\nanswered, and regression-tested, before touching a customer's cloud account. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport fnmatch\nimport ipaddress\nimport json\nimport logging\nimport random\nimport sys\nfrom enum import Enum\nfrom typing import Literal\n\nfrom pydantic import BaseModel, ConfigDict, Field, field_validator, model_validator\n\nNet = ipaddress.IPv4Network | ipaddress.IPv6Network\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab03\")\n\n\nclass NetworkError(Exception):\n    \"\"\"Base for topology/validation problems.\"\"\"\n\n\nclass CidrOverlapError(NetworkError):\n    pass\n\n\nclass RouteNotFoundError(NetworkError):\n    pass\n\n\nclass CloudApiThrottled(NetworkError):\n    \"\"\"Simulated provider throttling; retryable.\"\"\"\n\n\nasync def with_backoff(fn, *, attempts: int = 5, base: float = 0.02):  # type: ignore[no-untyped-def]\n    for i in range(1, attempts + 1):\n        try:\n            return await fn()\n        except CloudApiThrottled:\n            if i == attempts:\n                raise\n            await asyncio.sleep(random.uniform(0, base * 2 ** i))\n\n\nclass Route(BaseModel):\n    model_config = ConfigDict(frozen=True)\n    destination: str\n    target: str  # e.g. \"local\", \"pcx-1\", \"tgw-1\", \"nat\", \"igw\"\n\n    @field_validator(\"destination\")\n    @classmethod\n    def _valid_cidr(cls, v: str) -> str:\n        ipaddress.ip_network(v, strict=True)\n        return v\n\n\nclass SecurityRule(BaseModel):\n    protocol: Literal[\"tcp\", \"udp\", \"icmp\", \"-1\"] = \"tcp\"\n    port_from: int = Field(ge=0, le=65535)\n    port_to: int = Field(ge=0, le=65535)\n    source_cidr: str | None = None\n    source_sg: str | None = None\n\n    @model_validator(mode=\"after\")\n    def _one_source(self) -> \"SecurityRule\":\n        if (self.source_cidr is None) == (self.source_sg is None):\n            raise ValueError(\"exactly one of source_cidr/source_sg is required\")\n        if self.port_from > self.port_to:\n            raise ValueError(\"port_from > port_to\")\n        return self\n\n\nclass Vpc(BaseModel):\n    name: str\n    cidr: str\n    routes: list[Route] = Field(default_factory=list)\n    ingress: dict[str, list[SecurityRule]] = Field(default_factory=dict, description=\"sg name -> rules\")\n\n    @property\n    def net(self) -> Net:\n        return ipaddress.ip_network(self.cidr)\n\n\nclass Peering(BaseModel):\n    pcx_id: str\n    a: str\n    b: str\n\n\nclass Topology(BaseModel):\n    vpcs: dict[str, Vpc]\n    peerings: list[Peering] = Field(default_factory=list)\n\n    def validate_peerings(self) -> None:\n        for p in self.peerings:\n            va, vb = self.vpcs[p.a], self.vpcs[p.b]\n            if va.net.overlaps(vb.net):\n                raise CidrOverlapError(f\"{p.pcx_id}: {va.name} {va.cidr} overlaps {vb.name} {vb.cidr}\")\n\n    def peer_of(self, pcx_id: str, from_vpc: str) -> str:\n        for p in self.peerings:\n            if p.pcx_id == pcx_id:\n                if from_vpc == p.a:\n                    return p.b\n                if from_vpc == p.b:\n                    return p.a\n        raise RouteNotFoundError(f\"{from_vpc} is not an endpoint of {pcx_id}\")\n\n\ndef longest_prefix_match(vpc: Vpc, dest_ip: str) -> Route:\n    ip = ipaddress.ip_address(dest_ip)\n    local = Route(destination=vpc.cidr, target=\"local\")\n    candidates = [r for r in [local, *vpc.routes] if ip in ipaddress.ip_network(r.destination)]\n    if not candidates:\n        raise RouteNotFoundError(f\"{vpc.name}: no route to {dest_ip}\")\n    return max(candidates, key=lambda r: ipaddress.ip_network(r.destination).prefixlen)\n\n\nclass Verdict(BaseModel):\n    reachable: bool\n    path: list[str]\n    reason: str\n\n\ndef sg_allows(dst: Vpc, sg: str, src_ip: str, src_sg: str | None, proto: str, port: int) -> bool:\n    for rule in dst.ingress.get(sg, []):\n        if rule.protocol not in (proto, \"-1\") or not (rule.port_from <= port <= rule.port_to):\n            continue\n        if rule.source_cidr and ipaddress.ip_address(src_ip) in ipaddress.ip_network(rule.source_cidr):\n            return True\n        if rule.source_sg and rule.source_sg == src_sg:\n            return True\n    return False\n\n\ndef analyze(topo: Topology, src_vpc: str, src_ip: str, src_sg: str | None, dst_vpc: str, dst_ip: str,\n            dst_sg: str, proto: str = \"tcp\", port: int = 443) -> Verdict:\n    \"\"\"Hop-by-hop reachability. Peering is non-transitive: only a direct 1:1 peering reaches the target.\"\"\"\n    path = [src_vpc]\n    try:\n        out = longest_prefix_match(topo.vpcs[src_vpc], dst_ip)\n    except RouteNotFoundError as exc:\n        return Verdict(reachable=False, path=path, reason=str(exc))\n    if out.target == \"local\":\n        next_vpc = src_vpc\n    elif out.target.startswith(\"pcx-\"):\n        next_vpc = topo.peer_of(out.target, src_vpc)\n        path.append(f\"{out.target}->{next_vpc}\")\n    else:\n        return Verdict(reachable=False, path=path, reason=f\"route target {out.target} does not reach {dst_vpc}\")\n    if next_vpc != dst_vpc:\n        return Verdict(reachable=False, path=path, reason=f\"peering is non-transitive: landed in {next_vpc}, not {dst_vpc}\")\n    dst = topo.vpcs[dst_vpc]\n    if ipaddress.ip_address(dst_ip) not in dst.net:\n        return Verdict(reachable=False, path=path, reason=\"destination IP outside destination VPC CIDR\")\n    if next_vpc != src_vpc:  # return path must exist, or replies are dropped\n        try:\n            back = longest_prefix_match(dst, src_ip)\n        except RouteNotFoundError:\n            return Verdict(reachable=False, path=path, reason=\"no return route: replies dropped\")\n        if back.target == \"local\" or not back.target.startswith(\"pcx-\"):\n            return Verdict(reachable=False, path=path, reason=f\"return route target {back.target} invalid\")\n    if not sg_allows(dst, dst_sg, src_ip, src_sg, proto, port):\n        return Verdict(reachable=False, path=path, reason=f\"security group {dst_sg} denies {proto}/{port}\")\n    return Verdict(reachable=True, path=path, reason=\"ok\")\n\n\nclass Effect(str, Enum):\n    ALLOW = \"Allow\"\n    DENY = \"Deny\"\n\n\nclass Statement(BaseModel):\n    effect: Effect\n    actions: list[str] = Field(min_length=1)\n    resources: list[str] = Field(min_length=1)\n    condition_source_vpce: str | None = None\n\n\nclass PolicyDocument(BaseModel):\n    statements: list[Statement]\n\n\nclass AccessRequest(BaseModel):\n    action: str\n    resource: str\n    source_vpce: str | None = None\n\n\ndef _matches(patterns: list[str], value: str) -> bool:\n    return any(fnmatch.fnmatchcase(value, p) for p in patterns)\n\n\ndef evaluate_iam(policy: PolicyDocument, req: AccessRequest) -> tuple[bool, str]:\n    \"\"\"AWS-style: explicit Deny wins, then any Allow, otherwise implicit deny.\"\"\"\n    allowed = False\n    for i, st in enumerate(policy.statements):\n        if not (_matches(st.actions, req.action) and _matches(st.resources, req.resource)):\n            continue\n        if st.condition_source_vpce and st.condition_source_vpce != req.source_vpce:\n            continue\n        if st.effect is Effect.DENY:\n            return False, f\"explicit deny by statement {i}\"\n        allowed = True\n    return (True, \"allowed\") if allowed else (False, \"implicit deny\")\n\n\ndef build_topology() -> Topology:\n    app = Vpc(name=\"app\", cidr=\"10.30.0.0/16\", routes=[Route(destination=\"10.40.0.0/16\", target=\"pcx-1\"),\n                                                      Route(destination=\"172.16.0.0/16\", target=\"pcx-2\")])\n    data = Vpc(name=\"data\", cidr=\"10.40.0.0/16\", routes=[Route(destination=\"10.30.0.0/16\", target=\"pcx-1\")],\n               ingress={\"sg-db\": [SecurityRule(port_from=5432, port_to=5432, source_sg=\"sg-app\")]})\n    vendor = Vpc(name=\"vendor\", cidr=\"172.16.0.0/16\", routes=[Route(destination=\"10.30.0.0/16\", target=\"pcx-2\")],\n                 ingress={\"sg-model\": [SecurityRule(port_from=443, port_to=443, source_cidr=\"10.30.0.0/16\")]})\n    return Topology(vpcs={\"app\": app, \"data\": data, \"vendor\": vendor},\n                    peerings=[Peering(pcx_id=\"pcx-1\", a=\"app\", b=\"data\"), Peering(pcx_id=\"pcx-2\", a=\"app\", b=\"vendor\")])\n\n\nasync def main() -> None:\n    topo = build_topology()\n    topo.validate_peerings()\n    cases = {\n        \"app->db 5432 via sg-app\": analyze(topo, \"app\", \"10.30.1.5\", \"sg-app\", \"data\", \"10.40.2.9\", \"sg-db\", port=5432),\n        \"app->db 22 (blocked port)\": analyze(topo, \"app\", \"10.30.1.5\", \"sg-app\", \"data\", \"10.40.2.9\", \"sg-db\", port=22),\n        \"vendor->db (non-transitive)\": analyze(topo, \"vendor\", \"172.16.0.4\", None, \"data\", \"10.40.2.9\", \"sg-db\", port=5432),\n        \"app->vendor model 443\": analyze(topo, \"app\", \"10.30.1.5\", \"sg-app\", \"vendor\", \"172.16.3.3\", \"sg-model\"),\n    }\n    for name, v in cases.items():\n        log.info(name, extra={\"ctx\": v.model_dump()})\n\n    try:\n        bad = build_topology()\n        bad.vpcs[\"vendor\"].cidr = \"10.30.128.0/17\"\n        bad.validate_peerings()\n    except CidrOverlapError as exc:\n        log.info(\"overlap detected\", extra={\"ctx\": {\"error\": str(exc)}})\n\n    policy = PolicyDocument(statements=[\n        Statement(effect=Effect.ALLOW, actions=[\"s3:GetObject\", \"s3:ListBucket\"], resources=[\"arn:aws:s3:::acme-docs\", \"arn:aws:s3:::acme-docs/*\"],\n                  condition_source_vpce=\"vpce-123\"),\n        Statement(effect=Effect.DENY, actions=[\"s3:*\"], resources=[\"arn:aws:s3:::acme-docs/restricted/*\"]),\n    ])\n    for req in (AccessRequest(action=\"s3:GetObject\", resource=\"arn:aws:s3:::acme-docs/a.pdf\", source_vpce=\"vpce-123\"),\n                AccessRequest(action=\"s3:GetObject\", resource=\"arn:aws:s3:::acme-docs/restricted/x.pdf\", source_vpce=\"vpce-123\"),\n                AccessRequest(action=\"s3:GetObject\", resource=\"arn:aws:s3:::acme-docs/a.pdf\", source_vpce=\"vpce-evil\"),\n                AccessRequest(action=\"s3:PutObject\", resource=\"arn:aws:s3:::acme-docs/a.pdf\", source_vpce=\"vpce-123\")):\n        ok, why = evaluate_iam(policy, req)\n        log.info(\"iam\", extra={\"ctx\": {\"action\": req.action, \"resource\": req.resource, \"allowed\": ok, \"why\": why}})\n\n    calls = {\"n\": 0}\n\n    async def flaky_describe() -> str:\n        calls[\"n\"] += 1\n        if calls[\"n\"] < 3:\n            raise CloudApiThrottled(\"RequestLimitExceeded\")\n        return \"ok\"\n\n    log.info(\"throttle recovered\", extra={\"ctx\": {\"result\": await with_backoff(flaky_describe), \"calls\": calls[\"n\"]}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m04", "num": "04", "dir": "04_containers_cicd", "title": "Production Docker & CI/CD", "track": "Foundations", "readme": "# Intuition & Mental Model\n\nA container image is a **sealed shipping box**: the same bytes run on a laptop, in CI and in the customer's cluster. In enterprise work the box is also an audit artifact. Security teams ask: what is inside, who built it, was it scanned, and can it run as root? A CI/CD pipeline is the **assembly line with inspectors**: every commit passes the same gates (lint, test, build, scan, sign) and nothing reaches production by hand.\n\nKey habits:\n1. **Multi-stage builds.** Compile and install in a fat \"builder\" stage; copy only the results into a slim runtime stage. Smaller image, fewer CVEs, no compilers for an attacker to use.\n2. **Least privilege at runtime.** Non-root user, read-only root filesystem, dropped Linux capabilities, no secrets baked into layers.\n3. **Pin and verify.** Pin base images by digest, lock dependencies with hashes, sign images, and fail the pipeline on critical vulnerabilities.\n4. **Gates are code.** The lab lints a Dockerfile and evaluates pipeline gates programmatically, so policy is testable.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  dev[\"Developer push or PR\"] --> ci[\"CI runner<br/>ephemeral, no long-lived credentials\"]\n  ci --> s1[\"1 Lint and unit tests\"] --> s2[\"2 Docker build (BuildKit)<br/>multi-stage, non-root runtime\"] --> s3[\"3 Dockerfile policy check\"] --> s4[\"4 SBOM and CVE scan<br/>fail on fixable CRITICAL or HIGH\"] --> s5[\"5 Sign with cosign<br/>push by digest\"]\n  s5 --> reg[\"Private registry<br/>immutable tags\"]\n  reg --> gitops[\"GitOps (Argo CD)<br/>manifest pins image@sha256\"]\n  gitops -->|\"admission controller verifies signature\"| cluster[\"Cluster<br/>readOnlyRootFilesystem, runAsNonRoot, drop ALL caps\"]\n  cluster --> roll[\"Rolling update, maxUnavailable 0<br/>canary 5% then 100%<br/>auto-rollback on SLO burn\"]\n```\n\nBoundaries: CI network pushes to the registry, the production cluster pulls from it. Secrets arrive only through workload identity, never in image layers.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency (build/deploy) | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Multi-stage Docker + distroless/slim runtime** | Fast pulls (~60-150 MB), cached builds | Excellent | Medium: need debug strategy (no shell) | Low |\n| **Single-stage \"fat\" image** | Slow pulls (1+ GB), slow cold starts | Poor: large attack surface multiplies per node | Low | Medium: registry egress + node disk |\n| **Buildpacks / managed build (Cloud Native Buildpacks, Cloud Build)** | Medium | Excellent: standardized across teams | Low-Medium; less control of layers | Medium: platform fees |\n\n# Enterprise War Stories & Edge Cases\n\n**1. API key in a layer.** A developer ran `COPY .env .` then `RUN rm .env`; the secret stayed in an earlier layer and was extracted from the public-pull-through cache. *Remediation:* rotate the key, use BuildKit `--mount=type=secret`, add `.dockerignore`, and a pipeline gate that scans layers for secrets and fails the build.\n\n**2. `latest` took production down.** A rollback pulled `python:3.12` which had moved to a new minor with a changed OpenSSL, breaking a client's TLS inspection. Two \"identical\" builds differed. *Remediation:* pin base images by digest, renovate-style PRs to bump them, immutable tags in the registry, and reproducibility checks comparing SBOMs.\n\n**3. Pods OOMKilled only under load.** The image ran fine in CI, but the cgroup memory limit (512Mi) was lower than the Python process plus model cache. Kubernetes restarted pods in a loop, and the rolling update stalled at 0% available. *Remediation:* load-test with production limits in CI, size requests from measured RSS, set `maxUnavailable: 0` with readiness probes so a bad version never replaces healthy pods, and automated rollback on error-rate burn.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design the build and release system for an AI platform deployed into 30 customer-controlled Kubernetes clusters (some air-gapped). 40 engineers, ~120 deploys per week, SOC 2 and FedRAMP-moderate customers, rollback in under 5 minutes.\n\n**Requirements**\n- Every image traceable to a commit, signed, scanned, with an SBOM.\n- Air-gapped customers receive an offline bundle; no direct registry access.\n- Zero-downtime upgrades; automatic rollback on SLO regression.\n\n**Sizing**\n- Deploys: 120/week = ~17/day, ~1 per 85 minutes of business time. Each deploy = 3 images (api, worker, migrator). Builds: 17 x 3 = **51 image builds/day** plus PR builds (~5 per engineer per day = 200). Total ~250 builds/day x 6 min = 1,500 runner-minutes/day; with 8-way concurrency and peak at 3x average, plan **12 ephemeral runners**.\n- Registry storage: 51 images/day x 150 MB (slim) = 7.6 GB/day, with layer dedup (~80% shared) ~1.5 GB/day net = **~550 GB/year**; retention policy keeps 90 days of non-release tags -> ~140 GB hot.\n- Pull storm: a 30-cluster fleet x 20 nodes x 150 MB = 90 GB per release if all nodes pull from origin; use per-cluster pull-through caches, reducing origin egress to 30 x 150 MB = 4.5 GB.\n- Rollback budget: image already cached on nodes (previous ReplicaSet), so rollback = new rollout of N pods at maxSurge 25%: ~90 s for 40 pods. Meets 5 min.\n- Offline bundle: tarball of images + SBOMs + cosign bundle ~1.2 GB per release; signed manifest listing digests.\n\n**Component breakdown**\n1. CI with OIDC federation to the registry (no stored credentials); BuildKit with remote cache; dockerfile policy gate (this lab) and secret scan.\n2. SBOM (CycloneDX) generated per image and attached as an OCI artifact; vulnerability scan with an allowlist that expires.\n3. Cosign keyless signatures; Kyverno/Gatekeeper admission verifies signature and rejects tags (digest only).\n4. GitOps (Argo CD): environment repo holds `image@digest`; promotion = PR; Argo Rollouts canary 5% -> 25% -> 100% with Prometheus analysis (error rate, p95).\n5. Air-gap path: `fde-bundle export` -> customer's transfer process -> import into their registry -> same admission verification with a customer-held trust root.\n\n**Failure modes**\n- Scanner outage blocks all releases: retry with backoff; documented break-glass with two-person approval and a 24 h follow-up ticket.\n- Compromised CI token: tokens are per-job OIDC (minutes of lifetime); registry accepts pushes only from the pipeline identity.\n- Bad migration with no rollback: expand/contract schema discipline, migrator separate from app, canary reads only.\n- Base image CVE disclosure: scheduled rebuilds nightly, automated digest-bump PRs, fleet-wide report from SBOM index in < 1 hour.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's head of compliance says: *\"Your platform's last release contained a critical OpenSSL vulnerability for nine days before anyone noticed. Why should we trust your supply chain?\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You're right, and I'll be specific. The vulnerability was disclosed on a Tuesday. Our scan runs at build time, and no build ran that week for that service, so the old image kept running with a known flaw. Our pipeline was strong at the gate and blind between gates.\"\n\n*Impact.* \"For nine days, your environment ran software we could have patched in an hour. We found no sign of exploitation, and I can share the log review, but the risk was real and the detection delay is what your audit team is right to challenge.\"\n\n*Remedy.* \"Three changes, each with evidence. First, we rebuild and rescan every base image nightly, so the gap is hours, not days. Second, every image carries an SBOM, so when a new CVE is published we can answer 'which of your clusters run the vulnerable package' within an hour from an index rather than by hand; I'll demonstrate that query on your fleet during our next call. Third, admission control in your cluster only accepts signed images by digest, so nothing unscanned or modified can run. I'll send you the pipeline policy as code, and your auditors can run the same checks against any image we ship you.\"\n", "lab": "\"\"\"Module 04 lab: Dockerfile security linter and CI/CD promotion-gate engine.\n\nPolicy-as-code: parses a Dockerfile into instructions, checks hardening rules (digest-pinned base,\nmulti-stage, non-root USER, no secrets in ENV/ARG, no ADD from URLs, HEALTHCHECK), then runs an async\npipeline of gates (with retries on flaky scanners) and decides whether an image may be promoted.\nRun: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport re\nimport sys\nimport time\nfrom enum import Enum\nfrom typing import Awaitable, Callable\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab04\")\n\n\nclass PipelineError(Exception):\n    \"\"\"Base error for pipeline failures.\"\"\"\n\n\nclass DockerfileParseError(PipelineError):\n    pass\n\n\nclass ScannerUnavailableError(PipelineError):\n    \"\"\"Retryable: the vulnerability DB or scanner endpoint timed out.\"\"\"\n\n\nclass GateFailedError(PipelineError):\n    def __init__(self, gate: str, detail: str) -> None:\n        super().__init__(f\"{gate}: {detail}\")\n        self.gate, self.detail = gate, detail\n\n\nclass Severity(str, Enum):\n    LOW = \"LOW\"\n    MEDIUM = \"MEDIUM\"\n    HIGH = \"HIGH\"\n    CRITICAL = \"CRITICAL\"\n\n\nclass Instruction(BaseModel):\n    line: int\n    op: str\n    arg: str\n\n\nclass Finding(BaseModel):\n    rule: str\n    severity: Severity\n    line: int | None = None\n    message: str\n\n\ndef parse_dockerfile(text: str) -> list[Instruction]:\n    \"\"\"Handles comments, line continuations and case-insensitive instructions.\"\"\"\n    out: list[Instruction] = []\n    buf, start = \"\", 0\n    for n, raw in enumerate(text.splitlines(), 1):\n        line = raw.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        if not buf:\n            start = n\n        if line.endswith(\"\\\\\"):\n            buf += line[:-1] + \" \"\n            continue\n        buf += line\n        parts = buf.split(None, 1)\n        if not parts:\n            raise DockerfileParseError(f\"empty instruction at line {start}\")\n        out.append(Instruction(line=start, op=parts[0].upper(), arg=parts[1] if len(parts) > 1 else \"\"))\n        buf = \"\"\n    if buf:\n        raise DockerfileParseError(\"dangling line continuation\")\n    if not any(i.op == \"FROM\" for i in out):\n        raise DockerfileParseError(\"no FROM instruction\")\n    return out\n\n\nSECRET_NAME = re.compile(r\"(PASSWORD|SECRET|TOKEN|API_?KEY|PRIVATE_KEY)\", re.I)\n\n\ndef lint_dockerfile(ins: list[Instruction]) -> list[Finding]:\n    f: list[Finding] = []\n    froms = [i for i in ins if i.op == \"FROM\"]\n    for i in froms:\n        image = i.arg.split()[0]\n        if image == \"scratch\" or image in {s.arg.split()[-1] for s in froms if \" AS \" in s.arg.upper()}:\n            continue\n        if \"@sha256:\" not in image:\n            sev = Severity.HIGH if image.endswith(\":latest\") or \":\" not in image else Severity.MEDIUM\n            f.append(Finding(rule=\"pin-base-digest\", severity=sev, line=i.line, message=f\"{image} is not pinned by digest\"))\n    if len(froms) < 2:\n        f.append(Finding(rule=\"multi-stage\", severity=Severity.MEDIUM, message=\"single-stage build ships build tooling\"))\n    users = [i for i in ins if i.op == \"USER\"]\n    if not users or users[-1].arg.strip().split(\":\")[0] in {\"root\", \"0\"}:\n        f.append(Finding(rule=\"non-root\", severity=Severity.CRITICAL, line=users[-1].line if users else None,\n                         message=\"final stage runs as root\"))\n    for i in ins:\n        if i.op in {\"ENV\", \"ARG\"} and SECRET_NAME.search(i.arg.split(\"=\")[0]) and \"=\" in i.arg and i.arg.split(\"=\", 1)[1].strip():\n            f.append(Finding(rule=\"no-secrets\", severity=Severity.CRITICAL, line=i.line, message=\"secret value baked into image metadata\"))\n        if i.op == \"ADD\" and re.match(r\"https?://\", i.arg.split()[0]):\n            f.append(Finding(rule=\"no-remote-add\", severity=Severity.HIGH, line=i.line, message=\"ADD from URL is unverifiable; use curl with checksum\"))\n        if i.op == \"RUN\" and re.search(r\"curl[^|]*\\|\\s*(sh|bash)\", i.arg):\n            f.append(Finding(rule=\"no-curl-pipe-sh\", severity=Severity.HIGH, line=i.line, message=\"piping remote script to shell\"))\n        if i.op == \"RUN\" and \"apt-get install\" in i.arg and \"--no-install-recommends\" not in i.arg:\n            f.append(Finding(rule=\"apt-minimal\", severity=Severity.LOW, line=i.line, message=\"use --no-install-recommends and clean lists\"))\n    if not any(i.op == \"HEALTHCHECK\" for i in ins):\n        f.append(Finding(rule=\"healthcheck\", severity=Severity.LOW, message=\"no HEALTHCHECK (orchestrator probe may cover it)\"))\n    return f\n\n\nclass ImageScan(BaseModel):\n    image: str\n    vulns: dict[Severity, int]\n    fixable_critical: int = 0\n\n\nclass PipelineContext(BaseModel):\n    commit: str = Field(min_length=7)\n    dockerfile: str\n    image: str\n    coverage_pct: float = Field(ge=0, le=100)\n    findings: list[Finding] = Field(default_factory=list)\n    scan: ImageScan | None = None\n    signed: bool = False\n    timings_ms: dict[str, float] = Field(default_factory=dict)\n\n\nGate = Callable[[PipelineContext], Awaitable[None]]\n\n\nasync def retry(fn: Callable[[], Awaitable[ImageScan]], attempts: int = 4, base: float = 0.02) -> ImageScan:\n    for i in range(1, attempts + 1):\n        try:\n            return await fn()\n        except ScannerUnavailableError:\n            if i == attempts:\n                raise\n            await asyncio.sleep(random.uniform(0, base * 2 ** i))\n    raise AssertionError(\"unreachable\")\n\n\nclass FakeScanner:\n    def __init__(self, vulns: dict[Severity, int], fixable_critical: int, fail_first: int = 2) -> None:\n        self._vulns, self._fixable, self._fail_first, self.calls = vulns, fixable_critical, fail_first, 0\n\n    async def scan(self, image: str) -> ImageScan:\n        self.calls += 1\n        await asyncio.sleep(0.01)\n        if self.calls <= self._fail_first:\n            raise ScannerUnavailableError(\"vuln DB download timed out\")\n        return ImageScan(image=image, vulns=self._vulns, fixable_critical=self._fixable)\n\n\nasync def gate_coverage(ctx: PipelineContext) -> None:\n    if ctx.coverage_pct < 80:\n        raise GateFailedError(\"coverage\", f\"{ctx.coverage_pct}% < 80%\")\n\n\nasync def gate_dockerfile(ctx: PipelineContext) -> None:\n    ctx.findings = lint_dockerfile(parse_dockerfile(ctx.dockerfile))\n    blocking = [x for x in ctx.findings if x.severity in {Severity.CRITICAL, Severity.HIGH}]\n    if blocking:\n        raise GateFailedError(\"dockerfile-policy\", \"; \".join(f\"{b.rule}@{b.line}\" for b in blocking))\n\n\ndef make_scan_gate(scanner: FakeScanner) -> Gate:\n    async def gate_scan(ctx: PipelineContext) -> None:\n        ctx.scan = await retry(lambda: scanner.scan(ctx.image))\n        if ctx.scan.fixable_critical > 0:\n            raise GateFailedError(\"cve-scan\", f\"{ctx.scan.fixable_critical} fixable CRITICAL vulnerabilities\")\n    return gate_scan\n\n\nasync def gate_sign(ctx: PipelineContext) -> None:\n    if \"@sha256:\" not in ctx.image:\n        raise GateFailedError(\"sign\", \"refusing to sign a mutable tag; push by digest\")\n    ctx.signed = True\n\n\nasync def run_pipeline(ctx: PipelineContext, gates: list[tuple[str, Gate]]) -> bool:\n    for name, gate in gates:\n        t0 = time.perf_counter()\n        try:\n            await gate(ctx)\n            ctx.timings_ms[name] = round((time.perf_counter() - t0) * 1000, 1)\n            log.info(\"gate passed\", extra={\"ctx\": {\"gate\": name, \"commit\": ctx.commit}})\n        except GateFailedError as exc:\n            log.error(\"gate failed\", extra={\"ctx\": {\"gate\": exc.gate, \"detail\": exc.detail, \"commit\": ctx.commit}})\n            return False\n        except PipelineError as exc:\n            log.error(\"infrastructure error\", extra={\"ctx\": {\"gate\": name, \"error\": str(exc)}})\n            return False\n    return True\n\n\nBAD = \"\"\"FROM python:latest\nENV API_KEY=sk-live-123\nADD https://example.com/tool.tgz /opt/\nRUN apt-get install -y gcc && curl https://x.sh | sh\nCOPY . /app\nCMD [\"python\", \"/app/main.py\"]\n\"\"\"\n\nGOOD = \"\"\"# builder\nFROM python:3.12-slim@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa AS builder\nRUN pip install --no-cache-dir --prefix=/install -r requirements.txt\n# runtime\nFROM gcr.io/distroless/python3-debian12@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\nCOPY --from=builder /install /usr/local\nCOPY app /app\nUSER 65532:65532\nHEALTHCHECK CMD [\"python\",\"/app/health.py\"]\nENTRYPOINT [\"python\", \"/app/main.py\"]\n\"\"\"\n\n\nasync def main() -> None:\n    digest = \"@sha256:\" + \"c\" * 64\n    for label, df, image, fixable in ((\"bad\", BAD, \"reg/app:latest\", 0), (\"good-with-cve\", GOOD, \"reg/app\" + digest, 2),\n                                      (\"good\", GOOD, \"reg/app\" + digest, 0)):\n        scanner = FakeScanner({Severity.CRITICAL: fixable, Severity.LOW: 14}, fixable)\n        ctx = PipelineContext(commit=\"a1b2c3d4\", dockerfile=df, image=image, coverage_pct=91.5)\n        gates = [(\"coverage\", gate_coverage), (\"dockerfile\", gate_dockerfile), (\"scan\", make_scan_gate(scanner)), (\"sign\", gate_sign)]\n        ok = await run_pipeline(ctx, gates)\n        log.info(\"pipeline result\", extra={\"ctx\": {\"case\": label, \"promoted\": ok, \"signed\": ctx.signed, \"scanner_calls\": scanner.calls,\n                                                    \"findings\": [f\"{x.rule}:{x.severity.value}\" for x in ctx.findings]}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m05", "num": "05", "dir": "05_llm_foundations", "title": "LLM Foundations & Structured Outputs", "tr
