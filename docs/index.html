ack": "LLM and retrieval", "readme": "# Intuition & Mental Model\n\nAn LLM is a very capable intern with **no memory between conversations and a desk of fixed size**. The desk is the *context window*: everything the model can consider (system prompt, retrieved documents, chat history, and the answer it is writing) must fit on it. You pay per token for what goes on the desk, and quality drops when the desk is cluttered or the key paper is buried in the middle.\n\nTwo practical consequences:\n1. **Context is a budget.** Count tokens before you call. Reserve room for the output. Decide in advance what gets cut first (old chat turns before the system prompt; low-score chunks before high-score ones).\n2. **Free text is a bug in a pipeline.** Downstream code needs typed data, not prose. Ask for JSON that matches a Pydantic schema, validate it, and when validation fails send the *exact validation error* back to the model for a bounded number of repairs. This is the pattern libraries like Instructor implement; the lab builds it from scratch so you know what is under the hood.\n\nTemperature near 0 gives repeatable extraction; higher values add variety. Neither removes the need for validation, because models can still emit a wrong date or an invented enum.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  req[\"Caller request\"] --> asm[\"Prompt assembler<br/>system prompt, few-shot examples,<br/>retrieved context, history\"]\n  asm --> bud{\"Token budgeter<br/>limit = model context - output - margin\"}\n  bud -->|\"fits\"| llm[\"LLM client<br/>timeout, backoff on 429 and 5xx, temperature 0\"]\n  bud -->|\"over budget: trim lowest priority, log drops\"| llm\n  llm --> parse[\"Parse and Pydantic validate\"]\n  parse -->|\"valid\"| typed[\"Typed object<br/>DB write or API response\"]\n  parse -->|\"ValidationError\"| repair[\"Re-ask with bad output and exact errors<br/>max 2 repairs\"] --> llm\n  parse -->|\"still invalid\"| dlq[\"ExtractionFailed<br/>DLQ or human review\"]\n```\n\nMetrics at every hop: input tokens, output tokens, cost, latency, repair count. Only the LLM client talks to the provider, and PII redaction (Module 13) happens before it.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Prompt + JSON mode + Pydantic validate/repair loop (Instructor-style)** | One call typically, +1 on repair | High; stateless | Low-Medium | Low: occasional repair call |\n| **Native function/tool calling or constrained decoding (schema-enforced)** | One call, slightly higher first-token latency for grammar compilation | High | Low if provider supports; vendor lock-in | Low; fewer failed parses |\n| **Free-text + regex/post-processing** | One call | Medium: brittle as outputs vary | High over time (regex whack-a-mole) | Hidden: engineer time and silent bad data |\n\n# Enterprise War Stories & Edge Cases\n\n**1. Silent truncation of a contract.** A 180-page contract was stuffed into the prompt; the provider truncated the middle, and the model answered \"no termination clause\" confidently. *Remediation:* count tokens locally before calling, fail loudly when over budget, chunk with map-reduce or retrieval, and test with needle-in-the-middle probes at 25/50/75% depth.\n\n**2. The invoice date that was a hallucination.** An extraction pipeline accepted `{\"due_date\": \"2024-02-30\"}` because the schema typed it as `str`. Payments were scheduled for a nonexistent date. *Remediation:* use `date` types, cross-field validators (due date >= issue date), enums for currency, and route validation failures to review instead of \"fixing\" them silently.\n\n**3. Retry loop cost explosion.** A repair loop with no cap re-asked 40 times on an impossible schema, with growing history each time, producing a four-figure bill in an hour. *Remediation:* hard cap of 2 repairs, send only the last bad output plus errors (not the full history), per-request token and cost ceilings, and an alert on repair-rate > 5%.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design a contract-intelligence extraction service for a law firm's client: 120,000 contracts (average 45 pages) backfill plus 1,500 new contracts/day, extract 30 typed fields with >= 97% field-level accuracy, every output auditable and reproducible.\n\n**Requirements**\n- Typed output validated against a schema; invalid output never reaches the matter-management system.\n- Reproducible: same document + same prompt version -> same result; versioned prompts and models.\n- Backfill within 14 days; daily SLA of 15 minutes per new contract.\n\n**Sizing**\n- Tokens per contract: 45 pages x ~500 words x 1.33 tokens/word = **~30,000 tokens**. Fits a 128k window, but quality improves with section routing; plan two passes (locate clauses, then extract) averaging 14k input tokens each + 2k output = **~30k input, 2k output** per contract.\n- Backfill: 120,000 x 30k = **3.6 B input tokens**, 240 M output tokens. At $3/M input and $15/M output = $10.8k + $3.6k = **~$14.4k**; with prompt caching of the shared instructions (2k of each call) and batch API at 50% discount: **~$7k**.\n- Throughput: 14 days = 1.21 M seconds; 120,000 contracts / 1.21 M s = ~0.1 contracts/s average. Plan for 10x headroom (retries, uneven batches): 1 contract/s x 30k tokens = **30k input tokens/s**, so request a ~2M tokens-per-minute tier (33k/s). Run async with concurrency ~20 (each call takes ~15-20 s).\n- Daily: 1,500 x 32k = 48 M tokens/day, trivial ($150-$200/day).\n- Storage: raw PDFs 120k x 2 MB = 240 GB; extracted JSON 120k x 6 KB = 720 MB; audit log of prompts/responses 120k x 70 KB = **8.4 GB**.\n- Repair budget: expect 4% of docs need one repair (+4% cost); cap at 2.\n\n**Component breakdown**\n1. Ingestion + OCR/layout parse (Module 08), section splitter.\n2. Context budgeter: system prompt + clause-specific few-shots + retrieved sections; refuses to send when over budget.\n3. Extractor: JSON schema from Pydantic, temperature 0, Instructor-style validate/repair (max 2), model + prompt version pinned in a registry.\n4. Validators: type, cross-field (end date after start date), source-grounding (every value must quote a span found in the text, verified by substring match).\n5. Review queue for low-confidence or failed validation; reviewer corrections become the eval set.\n6. Audit store: input hash, prompt version, model id, raw output, validated output.\n\n**Failure modes**\n- Silent truncation or lost-in-the-middle: token counting plus needle tests; section-scoped prompts.\n- Model upgrade drift: pinned model ids, golden set of 500 contracts, block rollout if field accuracy drops > 1 point.\n- Hallucinated values: grounding check rejects values lacking a source quote.\n- Provider outage/rate limits: queue-based backfill, backoff with jitter, secondary provider with identical schema tests.\n- Prompt injection inside a contract (\"ignore previous instructions\"): treat document text as data, delimit it, and validate outputs against schema only (see Module 13).\n\n# Client Simulation Challenge\n\n**Scenario.** The client's lead architect says: *\"Last quarter's model update changed how you extract 'governing law' for about 8% of our contracts. Nobody told us. How do I trust a system whose behaviour changes under me?\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You're describing a real failure, and the cause is on our side. The provider updated the model behind the alias we were calling, and our regression tests didn't cover the governing-law field with enough variety. So behaviour changed without a release on our end and without notice to you.\"\n\n*Impact.* \"Eight percent of your contracts carried a different governing-law value for several weeks. Anyone who relied on that field for risk routing could have made a decision on incorrect data, and that is exactly the kind of silent change an architect should not have to tolerate.\"\n\n*Remedy.* \"We're making three commitments. We now pin an exact model version, so nothing changes unless we change it. Every model or prompt change must pass a golden set of 500 of your own contracts, field by field, and we block the release if any field drops by more than one point. And you will see a change log before any change reaches your tenant, with the evaluation results attached. For the 8% already affected, we'll re-run them under the pinned model this week and send you a diff report so your team can decide which downstream records to correct.\"\n", "lab": "\"\"\"Module 05 lab: context-window budgeting and a from-scratch Instructor-style structured-output loop.\n\n- ContextBudgeter packs prompt sections by priority within a token budget and reports what was dropped.\n- StructuredExtractor asks an LLM for JSON, validates with Pydantic v2, and feeds validation errors back\n  (bounded repairs). A scripted fake LLM makes the demo deterministic. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport math\nimport random\nimport re\nimport sys\nfrom datetime import date\nfrom decimal import Decimal\nfrom enum import Enum\nfrom typing import Generic, Protocol, TypeVar\n\nfrom pydantic import BaseModel, Field, ValidationError, model_validator\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab05\")\n\n\nclass LLMError(Exception):\n    pass\n\n\nclass RateLimitError(LLMError):\n    \"\"\"429/503: retryable.\"\"\"\n\n\nclass ContextOverflowError(LLMError):\n    \"\"\"Mandatory sections alone exceed the budget.\"\"\"\n\n\nclass ExtractionFailed(LLMError):\n    def __init__(self, attempts: int, last_errors: str) -> None:\n        super().__init__(f\"extraction failed after {attempts} attempts: {last_errors}\")\n        self.attempts, self.last_errors = attempts, last_errors\n\n\ndef estimate_tokens(text: str) -> int:\n    \"\"\"Cheap approximation (~4 chars/token for English). Replace with tiktoken / provider counter in prod.\"\"\"\n    return max(1, math.ceil(len(text) / 4))\n\n\nclass Section(BaseModel):\n    name: str\n    text: str\n    priority: int = Field(ge=0, description=\"higher is kept first\")\n    mandatory: bool = False\n    truncatable: bool = False\n\n\nclass PackedContext(BaseModel):\n    text: str\n    tokens: int\n    dropped: list[str]\n    truncated: list[str]\n\n\nclass ContextBudgeter:\n    def __init__(self, model_context: int, reserved_output: int, safety_margin: int = 64) -> None:\n        if reserved_output + safety_margin >= model_context:\n            raise ValueError(\"reserved_output + safety_margin must be < model_context\")\n        self.limit = model_context - reserved_output - safety_margin\n\n    def pack(self, sections: list[Section]) -> PackedContext:\n        mandatory = [s for s in sections if s.mandatory]\n        used = sum(estimate_tokens(s.text) for s in mandatory)\n        if used > self.limit:\n            raise ContextOverflowError(f\"mandatory sections need {used} tokens, budget is {self.limit}\")\n        keep = {s.name: s.text for s in mandatory}\n        dropped, truncated = [], []\n        for s in sorted((s for s in sections if not s.mandatory), key=lambda s: -s.priority):\n            need = estimate_tokens(s.text)\n            if used + need <= self.limit:\n                keep[s.name], used = s.text, used + need\n            elif s.truncatable and self.limit - used > 20:\n                marker = \" \u2026[truncated]\"\n                room_chars = max(0, (self.limit - used) * 4 - len(marker) - 4)  # stay strictly inside the budget\n                keep[s.name] = s.text[:room_chars].rsplit(\" \", 1)[0] + marker\n                used, _ = used + estimate_tokens(keep[s.name]), truncated.append(s.name)\n            else:\n                dropped.append(s.name)\n        ordered = [f\"## {s.name}\\n{keep[s.name]}\" for s in sections if s.name in keep]  # original order, not priority\n        return PackedContext(text=\"\\n\\n\".join(ordered), tokens=used, dropped=dropped, truncated=truncated)\n\n\nclass Currency(str, Enum):\n    USD = \"USD\"\n    EUR = \"EUR\"\n    GBP = \"GBP\"\n\n\nclass Invoice(BaseModel):\n    vendor: str = Field(min_length=2)\n    issue_date: date\n    due_date: date\n    currency: Currency\n    total: Decimal = Field(gt=0, max_digits=12, decimal_places=2)\n    line_items: list[Decimal] = Field(min_length=1)\n\n    @model_validator(mode=\"after\")\n    def _consistency(self) -> \"Invoice\":\n        if self.due_date < self.issue_date:\n            raise ValueError(\"due_date must be on or after issue_date\")\n        if sum(self.line_items) != self.total:\n            raise ValueError(f\"line_items sum to {sum(self.line_items)} but total is {self.total}\")\n        return self\n\n\nM = TypeVar(\"M\", bound=BaseModel)\n\n\nclass LLM(Protocol):\n    async def complete(self, messages: list[dict[str, str]]) -> str: ...\n\n\nclass ScriptedLLM:\n    \"\"\"Returns pre-scripted outputs, simulating malformed JSON, a bad date and a rate limit.\"\"\"\n\n    def __init__(self, outputs: list[str | Exception]) -> None:\n        self._outputs = list(outputs)\n        self.calls = 0\n\n    async def complete(self, messages: list[dict[str, str]]) -> str:\n        self.calls += 1\n        await asyncio.sleep(0.005)\n        item = self._outputs.pop(0)\n        if isinstance(item, Exception):\n            raise item\n        return item\n\n\n_FENCE = re.compile(r\"```(?:json)?\\s*(.*?)```\", re.S)\n\n\ndef extract_json(raw: str) -> str:\n    m = _FENCE.search(raw)\n    text = m.group(1) if m else raw\n    start, end = text.find(\"{\"), text.rfind(\"}\")\n    if start == -1 or end == -1:\n        raise ValueError(\"no JSON object found in model output\")\n    return text[start:end + 1]\n\n\nclass StructuredExtractor(Generic[M]):\n    def __init__(self, llm: LLM, schema: type[M], *, max_repairs: int = 2, max_transport_retries: int = 4) -> None:\n        self._llm, self._schema = llm, schema\n        self._max_repairs, self._max_retries = max_repairs, max_transport_retries\n\n    def _system(self) -> str:\n        return (\"Extract data as a single JSON object matching this JSON Schema. Output JSON only.\\n\"\n                + json.dumps(self._schema.model_json_schema()))\n\n    async def _call(self, messages: list[dict[str, str]]) -> str:\n        for attempt in range(1, self._max_retries + 1):\n            try:\n                return await self._llm.complete(messages)\n            except RateLimitError:\n                if attempt == self._max_retries:\n                    raise\n                delay = random.uniform(0, 0.01 * 2 ** attempt)\n                log.warning(\"rate limited\", extra={\"ctx\": {\"attempt\": attempt, \"sleep_s\": round(delay, 4)}})\n                await asyncio.sleep(delay)\n        raise AssertionError(\"unreachable\")\n\n    async def extract(self, document: str) -> tuple[M, int]:\n        messages = [{\"role\": \"system\", \"content\": self._system()}, {\"role\": \"user\", \"content\": document}]\n        last_errors = \"\"\n        for repair in range(self._max_repairs + 1):\n            raw = await self._call(messages)\n            try:\n                return self._schema.model_validate_json(extract_json(raw)), repair\n            except (ValidationError, ValueError) as exc:\n                last_errors = self._format_errors(exc)\n                log.info(\"validation failed\", extra={\"ctx\": {\"repair\": repair, \"errors\": last_errors}})\n                # send only the latest bad output + errors, not the growing history (cost control)\n                messages = messages[:2] + [{\"role\": \"assistant\", \"content\": raw},\n                                           {\"role\": \"user\", \"content\": f\"Invalid. Fix these errors and return JSON only:\\n{last_errors}\"}]\n        raise ExtractionFailed(self._max_repairs + 1, last_errors)\n\n    @staticmethod\n    def _format_errors(exc: Exception) -> str:\n        if isinstance(exc, ValidationError):\n            return \"; \".join(f\"{'.'.join(map(str, e['loc'])) or 'root'}: {e['msg']}\" for e in exc.errors())\n        return str(exc)\n\n\nGOOD = ('{\"vendor\":\"Acme Corp\",\"issue_date\":\"2025-03-01\",\"due_date\":\"2025-03-31\",\"currency\":\"USD\",'\n        '\"total\":\"150.00\",\"line_items\":[\"100.00\",\"50.00\"]}')\nBAD_DATE = GOOD.replace(\"2025-03-31\", \"2025-02-30\")\nBAD_SUM = GOOD.replace('\"total\":\"150.00\"', '\"total\":\"160.00\"')\n\n\nasync def main() -> None:\n    packer = ContextBudgeter(model_context=512, reserved_output=128)\n    packed = packer.pack([\n        Section(name=\"system\", text=\"You are a contracts analyst. Cite clause numbers.\", priority=100, mandatory=True),\n        Section(name=\"question\", text=\"What is the termination notice period?\", priority=100, mandatory=True),\n        Section(name=\"retrieved-1\", text=\"Clause 14.2 Either party may terminate on 60 days notice. \" * 12, priority=90),\n        Section(name=\"retrieved-2\", text=\"Clause 9 governs liability caps and indemnities in detail. \" * 25, priority=50, truncatable=True),\n        Section(name=\"history\", text=\"User asked about renewal terms earlier in the chat. \" * 30, priority=10),\n    ])\n    log.info(\"context packed\", extra={\"ctx\": {\"tokens\": packed.tokens, \"limit\": packer.limit, \"dropped\": packed.dropped, \"truncated\": packed.truncated}})\n    try:\n        packer.pack([Section(name=\"system\", text=\"x\" * 4000, priority=1, mandatory=True)])\n    except ContextOverflowError as exc:\n        log.info(\"overflow caught\", extra={\"ctx\": {\"error\": str(exc)}})\n\n    llm = ScriptedLLM([RateLimitError(\"429\"), \"Sure! ```json\\n\" + BAD_DATE + \"\\n```\", BAD_SUM, GOOD])\n    invoice, repairs = await StructuredExtractor(llm, Invoice).extract(\"Invoice from Acme Corp ... total $150\")\n    log.info(\"extracted\", extra={\"ctx\": {\"invoice\": json.loads(invoice.model_dump_json()), \"repairs\": repairs, \"llm_calls\": llm.calls}})\n\n    always_bad = ScriptedLLM([\"not json at all\"] * 3)\n    try:\n        await StructuredExtractor(always_bad, Invoice).extract(\"garbage\")\n    except ExtractionFailed as exc:\n        log.info(\"routed to review\", extra={\"ctx\": {\"attempts\": exc.attempts, \"last_errors\": exc.last_errors}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m06", "num": "06", "dir": "06_advanced_rag", "title": "Advanced RAG: Hybrid Search & Reranking", "track": "LLM and retrieval", "readme": "# Intuition & Mental Model\n\nRAG (retrieval-augmented generation) is **open-book exam prep for the model**: find the right pages, put them on the desk, answer from them. Most RAG failures are retrieval failures, not generation failures: the right page never made it to the desk.\n\nWhy one search method is not enough:\n- **Keyword search (BM25)** is great at exact things: part numbers, error codes, names, \"Section 4.2(b)\". It misses paraphrases.\n- **Vector search** understands meaning (\"car\" \u2248 \"automobile\") but can blur exact identifiers.\n- **Hybrid** runs both and merges rankings. **Reciprocal Rank Fusion (RRF)** merges by *rank*, not raw score, so you never have to calibrate BM25 scores against cosine similarities: `score(d) = \u03a3 1 / (k + rank_i(d))`, k\u224860.\n- **Cross-encoder reranking** takes the top ~50 candidates and reads query and passage *together*, which is slower but much more accurate than comparing precomputed vectors. Use it only on the shortlist.\n- **Chunking** decides what a \"page\" is. Too small loses context; too big dilutes the match and wastes tokens. Overlap protects ideas that straddle a boundary.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  subgraph Ingest[\"Ingest (offline)\"]\n    docs[\"Documents\"] --> parse[\"Parse\"] --> chunk[\"Chunker: recursive, 400 tokens, 15% overlap<br/>metadata: doc, section, tenant, ACL, version\"]\n    chunk --> emb[\"Batch embed\"] --> vec[(\"Vector index<br/>HNSW\")]\n    chunk --> tok[\"Tokenize\"] --> inv[(\"Inverted index<br/>BM25\")]\n  end\n  subgraph Query[\"Query (online, p95 under 400 ms before the LLM)\"]\n    uq[\"User query\"] --> rw[\"Query rewrite (optional)\"]\n    rw --> dense[\"Dense top 50\"]\n    rw --> sparse[\"Sparse top 50\"]\n    dense --> rrf[\"RRF fusion, k = 60\"]\n    sparse --> rrf\n    rrf --> rr[\"Cross-encoder rerank\"] --> top[\"Top 5 chunks with citations\"] --> llm[\"LLM prompt (Module 05 budgeter)\"]\n  end\n  vec -.-> dense\n  inv -.-> sparse\n```\n\nTenant and ACL filters are applied inside both retrievers (Module 12). Re-indexing builds a new index and swaps an alias (blue/green), so updates are never partial.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Dense-only vector search** | Lowest (~10-30 ms ANN) | High with HNSW/IVF sharding | Low | Low; embedding + vector DB RAM |\n| **Hybrid (BM25 + dense + RRF)** | +10-20 ms (parallel) | High; two indices to maintain | Medium | Low-Medium |\n| **Hybrid + cross-encoder rerank** | +50-150 ms | Medium: rerank is the throughput bottleneck (GPU) | Medium-High | Medium-High (GPU inference) |\n\n# Enterprise War Stories & Edge Cases\n\n**1. The error code nobody could find.** A support copilot used dense-only retrieval; queries like `ERR_4471_TLS` returned generic TLS articles, never the KB page with that exact code. *Remediation:* add BM25 and fuse with RRF, tokenizer that preserves underscores and digits, and an eval set of exact-identifier queries that gates releases.\n\n**2. Chunk boundaries split the refund policy.** Fixed 1,000-character chunks cut \"Refunds are available within 30 days\" from \"except for enterprise contracts.\" The model quoted half a rule. *Remediation:* structure-aware chunking (headings, tables intact), 10-20% overlap, parent-document retrieval (match small, return the enclosing section), and chunk-level citations so reviewers can spot the gap.\n\n**3. Stale index, confident wrong answers.** Documents were updated, but the nightly re-embed job had been failing silently for three weeks. The assistant cited the superseded pricing sheet. *Remediation:* index freshness SLO (max document age lag) with an alert, versioned chunks with `valid_to`, blue/green re-indexing with a canary query set, and showing source dates in answers.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design an air-gapped RAG system for a bank's 50,000 concurrent tellers searching 2 million policy and procedure documents, with a 200 ms retrieval SLA (excluding LLM generation) and strict document-level entitlements.\n\n**Requirements**\n- Retrieval p95 <= 200 ms at peak; answers cite sources; entitlement filtering per teller role.\n- Air-gapped: no external API calls, models self-hosted.\n- Freshness: policy changes searchable within 15 minutes.\n\n**Sizing**\n- Concurrency: 50,000 tellers, but only ~4% active at once; each issues a query every ~90 s when active: 50,000 x 0.04 / 90 s = **~22 QPS** on average. Opening-of-business rushes run ~10x, so **~220 QPS peak**; use a 300 QPS design target for headroom.\n- Corpus: 2 M docs x 12 chunks = **24 M chunks**. Vectors at 768 dim, float32: 24 M x 768 x 4 B = **73.7 GB**; with int8 scalar quantization = **18.4 GB**; HNSW graph overhead (~M=32 neighbors x 4 B x 24M) = 3 GB. Plan 2 replicas x 32 GB RAM nodes, sharded 3 ways if a single node is not enough.\n- BM25 inverted index: ~24 M chunks x ~120 tokens; postings ~ 1.2x raw text = ~7 GB. Text store: 2 M docs x 40 KB = 80 GB on SSD.\n- Latency budget (200 ms): query embedding 15 ms (CPU ONNX, batch 1) + parallel dense ANN 25 ms / BM25 15 ms + RRF 1 ms + entitlement filter in-index (0 ms extra) + rerank top-30 with a distilled cross-encoder on GPU 70 ms + network 20 ms = **~131 ms**, leaving 70 ms slack.\n- Rerank GPU: 300 QPS x 30 pairs = 9,000 pairs/s. A small cross-encoder on one L4-class GPU does ~3,000 pairs/s, so need **~4 GPUs** (N+1 = 5).\n- Embedding at ingest: 24 M chunks, one-time at 1,500 chunks/s/GPU = 4.4 hours on one GPU; incremental ~2,000 chunks/day trivial.\n\n**Component breakdown**\n1. Ingest: parse -> structure-aware chunker -> embed + tokenize -> write to both indices with `acl_groups` and `doc_version` metadata.\n2. Query service: parallel dense/sparse with per-leg timeouts (degraded mode: if one leg fails, return the other and flag it), RRF, rerank.\n3. Entitlement filter pushed down into the index query (pre-filter), never post-filter (post-filter leaks counts and wastes top-k).\n4. Blue/green index aliasing for re-embedding; freshness via a 5-minute micro-batch from the change feed.\n5. Eval harness: 1,000 labeled queries, recall@50 and nDCG@5 gate every index or model change.\n\n**Failure modes**\n- GPU reranker saturated: shed to RRF-only ranking when queue wait > 30 ms (graceful degradation), alert.\n- Pre-filter too selective makes ANN recall collapse: use filtered-HNSW with fallback to brute force on tiny allowed sets.\n- Stale ACLs: ACL changes propagate through the same change feed with a 2-minute SLO; deny on lookup failure.\n- Index corruption on node restart: snapshots plus replica promote; alias swap is atomic.\n- Embedding model upgrade: dual-write new index, compare recall on the golden set, then flip the alias.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's CISO says: *\"I will not allow our policy documents to be sent to a cloud embedding API. Your demo used one. I need to know whether this project is dead.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You are right to stop us there. The demo used a hosted embedding service for speed of setup, and I should have flagged that it was a demo-only choice. Your policy documents have not been sent anywhere. The demo used public sample text, and I can show you the network logs from the session.\"\n\n*Impact.* \"If real policies had left your environment, that would have been a data-handling violation and a breach of the trust this project depends on. So I understand why you're asking whether the project is dead. It isn't, but it has to be built the way you require.\"\n\n*Remedy.* \"The production design is fully air-gapped. We deploy an open-weight embedding model and a reranker inside your VPC, on your GPU nodes, with no outbound internet route. The model weights are delivered once, through your approved transfer process, with checksums your team verifies. Retrieval quality in our tests with open models is within two points of the hosted service on recall at fifty, and I'll prove it on a sample of your own documents, inside your environment, before you commit to anything further. I'd also suggest your security team review the egress rules directly: a deny-all outbound policy is the control that makes the guarantee real, rather than my promise.\"\n", "lab": "\"\"\"Module 06 lab: hybrid retrieval pipeline in pure Python.\n\nComponents: recursive chunker with overlap, BM25 index, deterministic hashed-n-gram \"embedding\" with cosine\nsearch (stand-in for a real embedding model + HNSW), RRF fusion, and a pluggable reranker protocol with a\nlexical cross-encoder stand-in. Dense and sparse retrievers run concurrently with timeouts and backoff retries.\nRun: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport hashlib\nimport json\nimport logging\nimport math\nimport random\nimport re\nimport sys\nfrom collections import Counter, defaultdict\nfrom typing import Protocol\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab06\")\n\n\nclass RetrievalError(Exception):\n    pass\n\n\nclass RetrieverTimeout(RetrievalError):\n    \"\"\"Retryable.\"\"\"\n\n\nclass IndexEmptyError(RetrievalError):\n    pass\n\n\nclass Chunk(BaseModel):\n    chunk_id: str\n    doc_id: str\n    text: str\n    position: int = Field(ge=0)\n\n\nclass Hit(BaseModel):\n    chunk_id: str\n    score: float\n    source: str\n\n\nclass Result(BaseModel):\n    chunk: Chunk\n    fused_score: float\n    rerank_score: float | None = None\n    sources: list[str]\n\n\ndef recursive_chunk(doc_id: str, text: str, max_chars: int = 220, overlap: float = 0.15) -> list[Chunk]:\n    \"\"\"Split on paragraph, then sentence, then word boundaries; add trailing overlap between chunks.\"\"\"\n    def split(t: str, seps: list[str]) -> list[str]:\n        if len(t) <= max_chars or not seps:\n            return [t]\n        parts = [p for p in re.split(seps[0], t) if p.strip()]\n        if len(parts) == 1:\n            return split(t, seps[1:])\n        out: list[str] = []\n        for p in parts:\n            out.extend(split(p, seps[1:]) if len(p) > max_chars else [p])\n        return out\n\n    pieces = split(text, [r\"\\n\\s*\\n\", r\"(?<=[.!?])\\s+\", r\"\\s+\"])\n    chunks: list[str] = []\n    cur = \"\"\n    for p in pieces:\n        if cur and len(cur) + len(p) + 1 > max_chars:\n            chunks.append(cur)\n            tail = cur[-int(max_chars * overlap):]\n            cur = (tail.split(\" \", 1)[-1] + \" \" + p).strip() if overlap else p\n        else:\n            cur = f\"{cur} {p}\".strip()\n    if cur:\n        chunks.append(cur)\n    return [Chunk(chunk_id=f\"{doc_id}#{i}\", doc_id=doc_id, text=c, position=i) for i, c in enumerate(chunks)]\n\n\nTOKEN = re.compile(r\"[A-Za-z0-9_]+\")\n\n\ndef tokenize(text: str) -> list[str]:\n    return [t.lower() for t in TOKEN.findall(text)]  # underscores/digits kept so ERR_4471 stays one token\n\n\nclass BM25Index:\n    def __init__(self, chunks: list[Chunk], k1: float = 1.5, b: float = 0.75) -> None:\n        if not chunks:\n            raise IndexEmptyError(\"cannot build BM25 over zero chunks\")\n        self.k1, self.b = k1, b\n        self.docs = {c.chunk_id: Counter(tokenize(c.text)) for c in chunks}\n        self.len = {cid: sum(tf.values()) for cid, tf in self.docs.items()}\n        self.avg = sum(self.len.values()) / len(self.len)\n        df: Counter[str] = Counter()\n        for tf in self.docs.values():\n            df.update(tf.keys())\n        n = len(self.docs)\n        self.idf = {t: math.log(1 + (n - d + 0.5) / (d + 0.5)) for t, d in df.items()}\n\n    def search(self, query: str, k: int) -> list[Hit]:\n        q = tokenize(query)\n        scored = []\n        for cid, tf in self.docs.items():\n            s = 0.0\n            for t in q:\n                f = tf.get(t, 0)\n                if f:\n                    s += self.idf.get(t, 0) * f * (self.k1 + 1) / (f + self.k1 * (1 - self.b + self.b * self.len[cid] / self.avg))\n            if s > 0:\n                scored.append(Hit(chunk_id=cid, score=s, source=\"bm25\"))\n        return sorted(scored, key=lambda h: -h.score)[:k]\n\n\nDIM = 256\n\n\ndef embed(text: str) -> list[float]:\n    \"\"\"Deterministic hashed char-trigram + word embedding. Placeholder for a real model; same interface.\"\"\"\n    v = [0.0] * DIM\n    toks = tokenize(text)\n    feats = toks + [w[i:i + 3] for w in toks for i in range(max(1, len(w) - 2))]\n    for f in feats:\n        h = int(hashlib.md5(f.encode()).hexdigest(), 16)\n        v[h % DIM] += 1.0 if (h >> 8) & 1 else -1.0\n    norm = math.sqrt(sum(x * x for x in v)) or 1.0\n    return [x / norm for x in v]\n\n\nclass VectorIndex:\n    def __init__(self, chunks: list[Chunk]) -> None:\n        if not chunks:\n            raise IndexEmptyError(\"cannot build vector index over zero chunks\")\n        self.vecs = {c.chunk_id: embed(c.text) for c in chunks}\n\n    def search(self, query: str, k: int) -> list[Hit]:\n        q = embed(query)\n        hits = [Hit(chunk_id=cid, score=sum(a * b for a, b in zip(q, v)), source=\"dense\") for cid, v in self.vecs.items()]\n        return sorted(hits, key=lambda h: -h.score)[:k]\n\n\ndef rrf(rankings: list[list[Hit]], k: int = 60, top: int = 50) -> list[tuple[str, float, list[str]]]:\n    \"\"\"score(d) = sum over rankers of 1/(k + rank). Rank-based, so no score calibration is needed.\"\"\"\n    score: dict[str, float] = defaultdict(float)\n    srcs: dict[str, list[str]] = defaultdict(list)\n    for ranking in rankings:\n        for rank, h in enumerate(ranking, 1):\n            score[h.chunk_id] += 1.0 / (k + rank)\n            srcs[h.chunk_id].append(h.source)\n    return [(cid, s, srcs[cid]) for cid, s in sorted(score.items(), key=lambda x: -x[1])[:top]]\n\n\nclass Reranker(Protocol):\n    async def score(self, query: str, passages: list[str]) -> list[float]: ...\n\n\nclass LexicalCrossEncoder:\n    \"\"\"Stand-in for a cross-encoder: scores query-passage *pairs* jointly (coverage + proximity bonus).\"\"\"\n\n    async def score(self, query: str, passages: list[str]) -> list[float]:\n        await asyncio.sleep(0.002)\n        q = set(tokenize(query))\n        out = []\n        for p in passages:\n            toks = tokenize(p)\n            cover = len(q & set(toks)) / (len(q) or 1)\n            pos = [i for i, t in enumerate(toks) if t in q]\n            span = (max(pos) - min(pos) + 1) if pos else len(toks) + 1\n            out.append(cover + len(pos) / span * 0.5)\n        return out\n\n\nasync def with_timeout_retry(fn, *, timeout: float, attempts: int = 3):  # type: ignore[no-untyped-def]\n    for i in range(1, attempts + 1):\n        try:\n            return await asyncio.wait_for(fn(), timeout)\n        except (asyncio.TimeoutError, RetrieverTimeout):\n            if i == attempts:\n                raise RetrieverTimeout(f\"retriever failed after {attempts} attempts\") from None\n            await asyncio.sleep(random.uniform(0, 0.01 * 2 ** i))\n\n\nclass HybridRetriever:\n    def __init__(self, chunks: list[Chunk], reranker: Reranker, flaky_dense: bool = False) -> None:\n        self.chunks = {c.chunk_id: c for c in chunks}\n        self.bm25, self.vec, self.reranker = BM25Index(chunks), VectorIndex(chunks), reranker\n        self._flaky, self._dense_calls = flaky_dense, 0\n\n    async def _dense(self, q: str, k: int) -> list[Hit]:\n        self._dense_calls += 1\n        if self._flaky and self._dense_calls == 1:\n            raise RetrieverTimeout(\"ANN node timeout\")\n        await asyncio.sleep(0.001)\n        return self.vec.search(q, k)\n\n    async def _sparse(self, q: str, k: int) -> list[Hit]:\n        await asyncio.sleep(0.001)\n        return self.bm25.search(q, k)\n\n    async def retrieve(self, query: str, k: int = 3, candidates: int = 20) -> list[Result]:\n        dense, sparse = await asyncio.gather(\n            with_timeout_retry(lambda: self._dense(query, candidates), timeout=0.2),\n            with_timeout_retry(lambda: self._sparse(query, candidates), timeout=0.2))\n        fused = rrf([dense, sparse])\n        scores = await self.reranker.score(query, [self.chunks[cid].text for cid, _, _ in fused])\n        results = [Result(chunk=self.chunks[cid], fused_score=fs, rerank_score=rs, sources=src)\n                   for (cid, fs, src), rs in zip(fused, scores)]\n        return sorted(results, key=lambda r: -(r.rerank_score or 0))[:k]\n\n\nCORPUS = {\n    \"kb-tls\": \"Troubleshooting TLS handshakes. If the client reports ERR_4471_TLS, the server certificate chain is \"\n              \"missing an intermediate. Reinstall the full chain and restart the gateway.\\n\\nGeneral TLS tips: keep \"\n              \"certificates rotated every ninety days and monitor expiry dates.\",\n    \"policy-refund\": \"Refund policy. Customers may request a refund within 30 days of purchase. Enterprise contracts \"\n                     \"are excluded and follow the terms of the master services agreement instead.\",\n    \"policy-leave\": \"Employee leave policy. Staff receive twenty five days of paid vacation per year. Unused days \"\n                    \"carry over for one quarter. Parental leave is covered in a separate document.\",\n    \"kb-sso\": \"Single sign on setup. Configure the identity provider with the SAML metadata URL and map the email \"\n              \"claim. Users who cannot log in should check clock skew between the provider and the service.\",\n}\n\n\nasync def main() -> None:\n    chunks = [c for doc_id, t in CORPUS.items() for c in recursive_chunk(doc_id, t)]\n    log.info(\"indexed\", extra={\"ctx\": {\"docs\": len(CORPUS), \"chunks\": len(chunks)}})\n    retriever = HybridRetriever(chunks, LexicalCrossEncoder(), flaky_dense=True)\n    for q in (\"ERR_4471_TLS\", \"can I get my money back\", \"why can't users log in with SAML\"):\n        res = await retriever.retrieve(q, k=2)\n        log.info(\"query\", extra={\"ctx\": {\"q\": q, \"top\": [{\"id\": r.chunk.chunk_id, \"fused\": round(r.fused_score, 4),\n                                                           \"rerank\": round(r.rerank_score or 0, 3), \"via\": r.sources} for r in res]}})\n    try:\n        BM25Index([])\n    except IndexEmptyError as exc:\n        log.info(\"empty index guarded\", extra={\"ctx\": {\"error\": str(exc)}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m07", "num": "07", "dir": "07_graph_rag", "title": "Knowledge Graphs & GraphRAG", "track": "LLM and retrieval", "readme": "# Intuition & Mental Model\n\nVector RAG answers \"which paragraph sounds like the question?\" A knowledge graph answers \"**how are these things connected?**\" Questions like *\"Which suppliers of our delayed product are owned by a sanctioned entity?\"* need hops across relationships, and no single paragraph contains the answer. A graph stores **entities** (nodes) and **relations** (edges) explicitly, so a query can walk from product \u2192 supplier \u2192 parent company \u2192 sanctions list.\n\nGraphRAG pipeline in plain English:\n1. **Extract** entities and relations from text with an LLM, validated against a fixed ontology (allowed node and edge types).\n2. **Resolve** duplicates (\"IBM\", \"International Business Machines\") into one node, or the graph fragments and multi-hop paths break.\n3. **Store** in a graph database (Neo4j) with provenance (which document, which sentence).\n4. **Retrieve** by finding seed entities in the question, expanding N hops with Cypher, and giving the model the subgraph plus source text.\n5. **Guard** generated Cypher: read-only, allowlisted labels, bounded depth and row limits, parameterized values.\n\nUse it when relationships matter (ownership, dependencies, org charts, fraud rings, supply chains). Skip it when questions are single-document lookups; plain hybrid RAG is cheaper.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  subgraph Ingest[\"Ingest\"]\n    docs[\"Documents\"] --> chunk[\"Chunk\"] --> ext[\"LLM extractor<br/>ontology-constrained triples\"]\n    ext --> val{\"Allowed types and<br/>confidence at least 0.6?\"}\n    val -->|\"no\"| rq[\"Review queue\"]\n    val -->|\"yes\"| er[\"Entity resolution<br/>normalize, alias, fuzzy match\"] --> neo[(\"Neo4j<br/>idempotent MERGE, batched UNWIND\")]\n  end\n  subgraph Query[\"Query\"]\n    q[\"Question\"] --> link[\"Entity linker<br/>alias table and embeddings\"] --> plan[\"Cypher planner<br/>templates or LLM\"]\n    plan --> guard{\"Cypher guard<br/>read-only, depth at most 3, LIMIT, allowed labels\"}\n    guard -->|\"rejected\"| rej[\"Refuse and log\"]\n    guard -->|\"ok\"| rep[(\"Neo4j read replica<br/>2 s timeout\")] --> ctx[\"Context builder<br/>triples, evidence, citations\"] --> llm[\"LLM answer\"]\n  end\n  neo -.->|\"replication\"| rep\n```\n\nThe app role has READ on the query path and WRITE only on the ingest worker. A tenant_id property sits on every node and edge and is injected by the guard, never by the model.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Native graph DB (Neo4j) + Cypher** | Low for 1-4 hop traversals (index-free adjacency), ms-level | Vertical + read replicas; sharding is harder (Fabric/Infinigraph) | Medium-High: ontology, ER, Cypher ops | Medium-High (licensing, memory-heavy) |\n| **Property graph in Postgres (recursive CTE / Apache AGE)** | Fine for shallow hops, degrades past 3 | Good: reuse Postgres ops | Medium | Low: no new database |\n| **Vector-only RAG (no graph)** | Lowest | Highest | Lowest | Lowest, but cannot answer multi-hop questions reliably |\n\n# Enterprise War Stories & Edge Cases\n\n**1. One bank, forty nodes.** \"JPMorgan\", \"J.P. Morgan Chase & Co.\", and \"JPM\" became separate nodes, so an ownership path to a sanctioned entity was invisible. *Remediation:* canonical IDs from a reference source (LEI, ticker), alias table, blocking + fuzzy matching with human review for ambiguous merges, and a metric tracking duplicate-cluster rate.\n\n**2. The supernode that melted the database.** A query expanding from the node `United States` with no depth or limit touched 30 million edges and stalled the cluster. *Remediation:* bounded depth, `LIMIT`, query timeouts, a guard that rejects unbounded variable-length patterns, degree caps (skip nodes above a threshold unless explicitly allowed), and a read replica for LLM-generated queries.\n\n**3. LLM-generated Cypher that deleted data.** A text-to-Cypher agent given a write-capable connection produced `MATCH (n) DETACH DELETE n` after a user pasted an injection. *Remediation:* read-only database role (the real control), a static guard that rejects write clauses and `CALL` procedures outside an allowlist, parameterized queries, and query templates for the 80% of questions that are repeatable.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design a supply-chain risk graph for a manufacturer: 400,000 suppliers across 6 tiers, 3 M parts, updates from ERP, news and sanctions feeds; analysts ask \"which of our products are exposed to supplier X's failure?\" with answers in under 3 seconds and an audit trail for each edge.\n\n**Requirements**\n- Multi-hop (up to 6) exposure queries; each answer cites source documents.\n- Entity resolution across ERP IDs, DUNS numbers and free-text news mentions.\n- Daily bulk load plus streaming updates within 10 minutes; analysts read only their business unit's data.\n\n**Sizing**\n- Nodes: 400k suppliers + 3 M parts + 60k products + 500k \"legal entities/people\" = **~4 M nodes**. Edges: parts-to-supplier 6 M, bill-of-materials (part-to-part, product-to-part) 15 M, ownership 1.2 M, news-derived 4 M = **~26 M edges**.\n- Memory: Neo4j rule of thumb ~ 75 B/node + 135 B/relationship + properties. 4 M x 75 B = 300 MB; 26 M x 135 B = 3.5 GB; properties (avg 300 B per node) 1.2 GB; indexes 1 GB. Page cache target **~8 GB**; run 32 GB nodes for headroom (3-node cluster: 1 primary + 2 read replicas).\n- Query load: 200 analysts x 1 query/20 s peak = 10 QPS graph reads, each 3-6 hops. Typical 6-hop expansion from a mid-degree node touches ~50k edges, ~20 ms warm. Fits comfortably; supernode guard needed.\n- Extraction from news: 50,000 articles/day x 1,200 tokens x 2 calls = 120 M tokens/day = ~$360/day at $3/M; use a small model for first pass and a larger one only for ontology-ambiguous items, cutting to ~$120/day.\n- Provenance store: 26 M edges x 300 B evidence pointers = 7.8 GB in object/columnar storage, referenced by edge `evidence_id`.\n\n**Component breakdown**\n1. Source connectors: ERP (batch CDC), sanctions lists (daily), news (stream).\n2. Extraction service with ontology-constrained JSON (Module 05), confidence thresholds, human review queue below 0.6.\n3. Entity resolution: deterministic keys first (DUNS, LEI), then blocking + fuzzy name scoring, merges below 0.9 go to review; merge log is reversible.\n4. Graph writer: batched `UNWIND ... MERGE` through an async driver, idempotent via stable edge keys, single writer role.\n5. Query layer: template Cypher for common questions, LLM text-to-Cypher for long tail through the guard, read replica, 2 s timeout.\n6. Answer builder: path + evidence snippets + source links to the LLM, which must cite edge IDs.\n\n**Failure modes**\n- Entity-resolution false merge links two unrelated suppliers: reversible merge log, merge-quality audit sample weekly, ambiguous merges never auto-applied.\n- Supernode (e.g. a distributor with 80k edges): degree cap with explicit opt-in, precomputed aggregates.\n- Stale edges (supplier relationship ended): edges carry `valid_from/valid_to`, queries filter on `as_of`.\n- Extraction hallucinated relation: require evidence span verified by substring match; low confidence is shown as \"unverified\".\n- Write-path outage: reads continue from replicas; queue buffers updates; analysts see \"data as of\" timestamp.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's lead architect says: *\"We already have a vector search for our knowledge base. Why do we need to stand up Neo4j and hire people to maintain an ontology? It sounds like a science project.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"That's a fair challenge, and for many of your use cases you're right: if someone asks what a policy says, vector search is faster and cheaper, and I'd keep it. The gap shows up in a specific kind of question. Last month your risk team asked which of your products depend, directly or through a subsidiary, on a supplier that was just sanctioned. Vector search returned paragraphs mentioning the supplier, but nothing connecting the supplier to the products.\"\n\n*Impact.* \"Answering that took your analysts about two days by hand, across three systems. If the answer is late or incomplete, you either halt shipments unnecessarily or miss real exposure, and both have a measurable cost.\"\n\n*Remedy.* \"So I'd propose a narrow scope rather than a big platform. We model only four entity types and four relationships, the ones needed for that question. We load them from data you already have, supplier master, bill of materials and the sanctions feed, and keep vector search for everything else. Success has a hard test: the exposure question answered in under three seconds, with a source for every link, on a hundred historical cases your analysts already solved by hand. If we don't match them, we stop after six weeks and you've spent a fraction of what a platform build would cost. If we do, you'll have seen the value before committing to the ontology work.\"\n", "lab": "\"\"\"Module 07 lab: ontology-constrained triple extraction, entity resolution, a guarded Cypher planner and\nan in-memory graph store behind a Neo4j-shaped async interface.\n\nThe GraphStore protocol mirrors what an async Neo4j driver session offers (execute a parameterized read\nquery); InMemoryGraph interprets the planner's multi-hop pattern so the lab runs offline. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport re\nimport sys\nfrom collections import defaultdict, deque\nfrom typing import Literal, Protocol\n\nfrom pydantic import BaseModel, Field, field_validator\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab07\")\n\n\nclass GraphError(Exception):\n    pass\n\n\nclass OntologyViolation(GraphError):\n    pass\n\n\nclass UnsafeCypherError(GraphError):\n    pass\n\n\nclass GraphTimeout(GraphError):\n    \"\"\"Retryable read timeout.\"\"\"\n\n\nNodeType = Literal[\"Company\", \"Person\", \"Product\", \"Sanction\"]\nRelType = Literal[\"OWNS\", \"SUPPLIES\", \"DIRECTS\", \"SANCTIONED_BY\"]\nALLOWED_PATTERNS: dict[str, tuple[str, str]] = {\n    \"OWNS\": (\"Company\", \"Company\"), \"SUPPLIES\": (\"Company\", \"Product\"),\n    \"DIRECTS\": (\"Person\", \"Company\"), \"SANCTIONED_BY\": (\"Company\", \"Sanction\"),\n}\n\n\nclass Entity(BaseModel):\n    name: str = Field(min_length=1)\n    type: NodeType\n\n\nclass Triple(BaseModel):\n    head: Entity\n    rel: RelType\n    tail: Entity\n    evidence: str = Field(min_length=5)\n    confidence: float = Field(ge=0, le=1)\n\n    @field_validator(\"evidence\")\n    @classmethod\n    def _strip(cls, v: str) -> str:\n        return v.strip()\n\n\ndef validate_ontology(t: Triple) -> Triple:\n    want = ALLOWED_PATTERNS[t.rel]\n    if (t.head.type, t.tail.type) != want:\n        raise OntologyViolation(f\"{t.rel} requires {want[0]}->{want[1]}, got {t.head.type}->{t.tail.type}\")\n    return t\n\n\nLEGAL_SUFFIX = re.compile(r\"\\b(inc|incorporated|corp|corporation|co|company|ltd|limited|llc|llp|lp|plc|gmbh|ag|sa|bv|nv|pty)\\b\\.?\", re.I)\n\n\ndef normalize(name: str) -> str:\n    n = re.sub(r\"[^\\w\\s]\", \" \", name.lower())\n    return re.sub(r\"\\s+\", \" \", LEGAL_SUFFIX.sub(\" \", n)).strip()\n\n\nclass EntityResolver:\n    \"\"\"Alias table + normalization. Real systems add blocking and fuzzy scoring with human review.\"\"\"\n\n    def __init__(self, tenant: str, aliases: dict[str, str] | None = None) -> None:\n        if not tenant:\n            raise GraphError(\"tenant is required: node ids are tenant-scoped\")\n        self.tenant = tenant\n        self._alias = {normalize(k): v for k, v in (aliases or {}).items()}\n        self._seen: dict[str, str] = {}\n\n    def resolve(self, e: Entity) -> str:\n        key = normalize(e.name)\n        canon = self._alias.get(key, key)\n        node_id = f\"{self.tenant}|{e.type}:{canon}\"  # tenant prefix: the same name under two tenants is two nodes\n        self._seen.setdefault(node_id, e.name)\n        return node_id\n\n\nclass Edge(BaseModel):\n    src: str\n    rel: str\n    dst: str\n    evidence: str\n\n\nclass GraphStore(Protocol):\n    async def upsert(self, nodes: dict[str, str], edges: list[Edge]) -> None: ...\n    async def read(self, cypher: str, params: dict[str, object]) -> list[dict[str, object]]: ...\n\n\nclass InMemoryGraph:\n    \"\"\"Interprets exactly the planner's pattern; a real Neo4j adapter would send `cypher` unchanged.\"\"\"\n\n    def __init__(self, fail_first_reads: int = 0) -> None:\n        self.nodes: dict[str, str] = {}\n        self.adj: dict[str, list[Edge]] = defaultdict(list)\n        self._fails = fail_first_reads\n\n    async def upsert(self, nodes: dict[str, str], edges: list[Edge]) -> None:\n        self.nodes.update(nodes)  # MERGE semantics: idempotent\n        for e in edges:\n            if not any(x.dst == e.dst and x.rel == e.rel for x in self.adj[e.src]):\n                self.adj[e.src].append(e)\n\n    async def read(self, cypher: str, params: dict[str, object]) -> list[dict[str, object]]:\n        await asyncio.sleep(0.001)\n        if self._fails > 0:\n            self._fails -= 1\n            raise GraphTimeout(\"transaction timed out\")\n        seed, depth, limit = str(params[\"seed\"]), int(params[\"depth\"]), int(params[\"limit\"])  # type: ignore[call-overload]\n        if not seed.startswith(f\"{params['tenant']}|\"):  # fail closed: a seed outside the caller's tenant is never traversed\n            raise GraphError(\"seed is outside the caller's tenant\")\n        out: list[dict[str, object]] = []\n        queue: deque[tuple[str, list[Edge]]] = deque([(seed, [])])\n        seen = {seed}\n        while queue and len(out) < limit:\n            node, path = queue.popleft()\n            if len(path) >= depth:\n                continue\n            for e in self.adj.get(node, []):\n                if e.dst in seen:\n                    continue\n                seen.add(e.dst)\n                newp = path + [e]\n                out.append({\"end\": e.dst, \"end_name\": self.nodes.get(e.dst), \"path\": [f\"{p.src}-[{p.rel}]->{p.dst}\" for p in newp],\n                            \"evidence\": [p.evidence for p in newp]})\n                queue.append((e.dst, newp))\n        return out\n\n\nWRITE_KEYWORDS = re.compile(r\"\\b(CREATE|MERGE|DELETE|DETACH|SET|REMOVE|DROP|LOAD\\s+CSV|FOREACH|CALL)\\b\", re.I)\n\n\nclass CypherPlanner:\n    \"\"\"Template planner (the safe default). Values always travel as parameters, never string-interpolated.\"\"\"\n\n    MAX_DEPTH = 3\n    MAX_LIMIT = 50\n\n    def plan(self, seed_id: str, rel_types: list[str], depth: int, limit: int, tenant: str) -> tuple[str, dict[str, object]]:\n        for r in rel_types:\n            if r not in ALLOWED_PATTERNS:\n                raise UnsafeCypherError(f\"relationship {r!r} not in ontology\")\n        depth, limit = min(depth, self.MAX_DEPTH), min(limit, self.MAX_LIMIT)\n        rels = \"|\".join(rel_types)\n        cypher = (f\"MATCH p = (s {{id: $seed, tenant: $tenant}})-[:{rels}*1..{depth}]->(e) \"\n                  \"RETURN e.id AS end, e.name AS end_name, [r IN relationships(p) | type(r)] AS rels, \"\n                  \"[r IN relationships(p) | r.evidence] AS evidence LIMIT $limit\")\n        return cypher, {\"seed\": seed_id, \"tenant\": tenant, \"depth\": depth, \"limit\": limit}\n\n\ndef guard_cypher(cypher: str) -> str:\n    \"\"\"Static defense-in-depth for any (LLM-generated) query. The real control is a read-only DB role.\"\"\"\n    if WRITE_KEYWORDS.search(cypher):\n        raise UnsafeCypherError(\"write or procedure clause rejected\")\n    if not re.search(r\"\\bLIMIT\\b\", cypher, re.I):\n        raise UnsafeCypherError(\"query must be bounded with LIMIT\")\n    for m in re.finditer(r\"\\*(\\d*)\\.\\.(\\d*)\", cypher):\n        if not m.group(2) or int(m.group(2)) > CypherPlanner.MAX_DEPTH:\n            raise UnsafeCypherError(\"variable-length path must have an upper bound <= 3\")\n    if re.search(r\"\\*\\s*(\\]|\\))\", cypher):\n        raise UnsafeCypherError(\"unbounded variable-length pattern\")\n    return cypher\n\n\nasync def read_with_retry(store: GraphStore, cypher: str, params: dict[str, object], attempts: int = 4) -> list[dict[str, object]]:\n    for i in range(1, attempts + 1):\n        try:\n            return await store.read(guard_cypher(cypher), params)\n        except GraphTimeout:\n            if i == attempts:\n                raise\n            await asyncio.sleep(random.uniform(0, 0.005 * 2 ** i))\n    raise AssertionError(\"unreachable\")\n\n\nclass ScriptedExtractor:\n    \"\"\"Stand-in for the LLM extractor (Module 05 pattern). Includes one ontology violation and one low-confidence triple.\"\"\"\n\n    def extract(self, doc: str) -> list[dict[str, object]]:\n        return [\n            {\"head\": {\"name\": \"Acme Corp.\", \"type\": \"Company\"}, \"rel\": \"OWNS\", \"tail\": {\"name\": \"Borealis Ltd\", \"type\": \"Company\"},\n             \"evidence\": \"Acme Corp. completed its acquisition of Borealis Ltd in 2021.\", \"confidence\": 0.95},\n            {\"head\": {\"name\": \"Borealis\", \"type\": \"Company\"}, \"rel\": \"SUPPLIES\", \"tail\": {\"name\": \"Widget X\", \"type\": \"Product\"},\n             \"evidence\": \"Borealis supplies the casing for Widget X.\", \"confidence\": 0.9},\n            {\"head\": {\"name\": \"Acme Corporation\", \"type\": \"Company\"}, \"rel\": \"SANCTIONED_BY\", \"tail\": {\"name\": \"OFAC-2024-17\", \"type\": \"Sanction\"},\n             \"evidence\": \"Acme Corporation was listed under OFAC-2024-17 last spring.\", \"confidence\": 0.4},\n            {\"head\": {\"name\": \"Widget X\", \"type\": \"Product\"}, \"rel\": \"OWNS\", \"tail\": {\"name\": \"Borealis\", \"type\": \"Company\"},\n             \"evidence\": \"The product owns the supplier (extraction error).\", \"confidence\": 0.9},\n            {\"head\": {\"name\": \"Borealis Limited\", \"type\": \"Company\"}, \"rel\": \"SANCTIONED_BY\", \"tail\": {\"name\": \"OFAC-2024-17\", \"type\": \"Sanction\"},\n             \"evidence\": \"Borealis Limited appears on sanctions list OFAC-2024-17.\", \"confidence\": 0.92},\n        ]\n\n\nasync def ingest(doc: str, store: GraphStore, tenant: str, min_conf: float = 0.6) -> dict[str, int]:\n    resolver = EntityResolver(tenant)\n    nodes: dict[str, str] = {}\n    edges: list[Edge] = []\n    stats = {\"accepted\": 0, \"low_confidence\": 0, \"ontology_violations\": 0}\n    for raw in ScriptedExtractor().extract(doc):\n        t = Triple.model_validate(raw)\n        if t.confidence < min_conf:\n            stats[\"low_confidence\"] += 1\n            continue\n        try:\n            validate_ontology(t)\n        except OntologyViolation as exc:\n            stats[\"ontology_violations\"] += 1\n            log.warning(\"rejected triple\", extra={\"ctx\": {\"reason\": str(exc)}})\n            continue\n        h, tl = resolver.resolve(t.head), resolver.resolve(t.tail)\n        nodes[h], nodes[tl] = t.head.name, t.tail.name\n        edges.append(Edge(src=h, rel=t.rel, dst=tl, evidence=t.evidence))\n        stats[\"accepted\"] += 1\n    await store.upsert(nodes, edges)\n    return stats\n\n\nasync def main() -> None:\n    store = InMemoryGraph(fail_first_reads=2)\n    stats = await ingest(\"(document text)\", store, tenant=\"t1\")\n    log.info(\"ingested\", extra={\"ctx\": {**stats, \"nodes\": len(store.nodes)}})\n\n    planner = CypherPlanner()\n    cypher, params = planner.plan(\"t1|Company:acme\", [\"OWNS\", \"SUPPLIES\", \"SANCTIONED_BY\"], depth=5, limit=500, tenant=\"t1\")\n    log.info(\"planned\", extra={\"ctx\": {\"cypher\": cypher, \"params\": params}})\n    rows = await read_with_retry(store, cypher, params)\n    for r in rows:\n        log.info(\"path\", extra={\"ctx\": {\"end\": r[\"end\"], \"hops\": len(r[\"path\"]), \"path\": r[\"path\"]}})  # type: ignore[arg-type]\n\n    for bad in (\"MATCH (n) DETACH DELETE n\", \"MATCH (a)-[*]->(b) RETURN b LIMIT 5\", \"MATCH (a)-[:OWNS*1..9]->(b) RETURN b LIMIT 5\",\n                \"CALL apoc.cypher.runMany('x') YIELD row RETURN row LIMIT 1\"):\n        try:\n            guard_cypher(bad)\n        except UnsafeCypherError as exc:\n            log.info(\"guard blocked\", extra={\"ctx\": {\"query\": bad, \"reason\": str(exc)}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m08", "num": "08", "dir": "08_multimodal_rag", "title": "Multimodal Document Intelligence", "track": "LLM and retrieval", "readme": "# Intuition & Mental Model\n\nEnterprise knowledge lives in PDFs, scans, slide decks and spreadsheets pasted into Word. A plain \"extract text, chunk, embed\" pipeline destroys exactly what matters: **layout**. A table row becomes a run-on sentence, a footnote lands mid-paragraph, a chart disappears.\n\nTwo families of fixes:\n1. **Parse structurally, then retrieve text.** Layout models (LayoutLM-style) and parsers (Unstructured, Docling) detect blocks: title, paragraph, table, figure, footer. Tables are kept as tables (rows and columns, or Markdown/HTML) and each cell keeps its header context. Headers/footers are dropped; reading order is restored for multi-column pages.\n2. **Retrieve pages as images.** ColPali-style retrievers embed a page screenshot as many patch vectors and score a query with **late interaction (MaxSim)**: for each query token, find its best-matching patch, then sum. No OCR needed, so charts and layout are searchable. A vision-language model then reads the retrieved page images.\n\nPractical rule: use structured parsing for text-heavy, table-heavy compliance documents (cheap, auditable); add page-image retrieval where visuals carry the meaning (diagrams, slides, scanned forms). Always keep a **confidence score and page coordinates** so humans can verify an extracted number against the source.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  doc[\"PDF, scan, or PPTX\"] --> router{\"Router\"}\n  router -->|\"born-digital\"| tl[\"Text layer and layout parse\"]\n  router -->|\"scanned\"| ocr[\"OCR and layout model\"]\n  tl --> el[\"Element stream<br/>title, text, table, figure, footer<br/>with bbox, page, confidence\"]\n  ocr --> el\n  el --> tab[\"Table pipeline<br/>cell grid, header-aware row records\"]\n  el --> txt[\"Text pipeline<br/>reading order, section breadcrumbs\"]\n  el --> img[\"Page-image pipeline (optional)<br/>render at 150 dpi, ColPali patch vectors\"]\n  tab --> idx[(\"Hybrid index (Module 06)<br/>metadata: doc, page, bbox, type\")]\n  txt --> idx\n  img --> mv[(\"Multi-vector index<br/>late interaction\")]\n  idx --> ans[\"Retrieve, then LLM or VLM<br/>answer with page and bbox citation\"]\n  mv --> ans\n  el -.->|\"confidence under 0.8\"| rev[\"Review queue\"]\n  tab -.->|\"sum checks fail\"| rev\n```\n\nDocuments and page images stay inside the VPC. VLM inference is self-hosted or reached through a private endpoint.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Layout-aware parsing (Unstructured/Docling + LayoutLM) \u2192 text/table chunks** | Ingest 1-5 s/page, query as fast as text RAG | High; CPU/GPU batchable | Medium | Low-Medium |\n| **ColPali-style page-image retrieval (multi-vector) + VLM answer** | Query heavier (MaxSim over patches, VLM tokens for images) | Medium: ~1,000 vectors/page inflates index (50-100x) | Medium-High | High: storage + VLM inference |\n| **Plain OCR \u2192 text chunking** | Fast | High | Low | Low, but loses tables/figures: silent accuracy loss |\n\n# Enterprise War Stories & Edge Cases\n\n**1. The balance sheet that added up wrong.** OCR flattened a financial table; \"(1,204)\" (a negative) was read as \"1,204\" and a footnote marker \"3\" glued onto \"2021\" became \"20213.\" Extracted totals were off by millions. *Remediation:* keep table structure, parse parentheses as negatives, validate with row/column sums, confidence thresholds with human review, and always store page and bbox for evidence.\n\n**2. Multi-column PDF read across the gutter.** A two-column regulatory filing was read left-to-right across both columns, interleaving unrelated sentences; a retrieved \"paragraph\" said the opposite of the rule. *Remediation:* layout model for reading order, column detection, regression tests with golden page images, and a sampling audit comparing parse output to the rendered page.\n\n**3. Scanned forms at 40% skew.** Field engineers photographed forms at angles; OCR confidence dropped, and fields shifted into neighbouring cells. *Remediation:* preprocessing (deskew, denoise, contrast), per-field confidence, forms-specific key-value extraction instead of free OCR, and a human-in-the-loop queue for anything below threshold, with corrections feeding the evaluation set.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design a document-intelligence pipeline for an insurer processing 2 million pages/day of claims (60% born-digital PDF, 30% scans, 10% photos of forms), extracting 25 fields plus damage-estimate tables, with 99% accuracy on monetary fields and p95 end-to-end under 90 seconds per claim packet (average 12 pages).\n\n**Requirements**\n- Monetary fields: >= 99% accuracy; everything else >= 95%. Every value traceable to page and bounding box.\n- Handle skewed photos, handwriting on forms, multi-column letters, and tables spanning pages.\n- Human review for low-confidence values only; reviewer throughput targets 5% of fields.\n\n**Sizing**\n- Throughput: 2,000,000 pages/day / 86,400 = **23 pages/s** average; peak (business hours, 3x) = **70 pages/s**.\n- Compute per page: layout model + OCR ~600 ms on GPU (batched), table structure 300 ms. 70 pages/s x 0.9 s = **63 GPU-seconds/s**, so ~63 concurrent slots; with batching at ~8 pages/GPU: **~8 GPUs** (12 with N+4 headroom).\n- Storage: originals 2 M x 400 KB = **800 GB/day** (~290 TB/yr; lifecycle to cold storage after 90 days); parsed JSON 2 M x 25 KB = 50 GB/day; page images at 150 dpi WebP 2 M x 150 KB = 300 GB/day only for the retrieval tier (keep 30 days).\n- Page-image index (ColPali): ~1,000 patch vectors x 128 dim x 1 byte (binary/int8 quantized) = 128 KB/page; 30 days x 2 M = 60 M pages = **7.7 TB** of vectors; costly, so restrict to document classes that need it (slides, diagrams ~8% = 0.6 TB).\n- VLM answering for visual pages only: 8% of 2 M = 160k pages/day x 1,500 image tokens = 240 M tokens/day (~$720/day at $3/M).\n- Review load: 2 M pages x ~6 fields = 12 M fields/day; 5% to review = 600k fields; at 8 s each = 1,333 reviewer-hours/day, which is too many, so lower the review band to monetary fields below 0.9 confidence plus random 1% audit = ~90k fields = **200 reviewer-hours/day (~25 reviewers)**.\n\n**Component breakdown**\n1. Router: born-digital (text layer) vs scan vs photo; photos get deskew/denoise/perspective correction.\n2. Parsing: layout detection -> reading order -> element stream with bbox/confidence; table structure recognition; cross-page table stitching by header match.\n3. Field extraction: key-value models for forms; LLM extraction from table-records with Pydantic validation (Module 05).\n4. Validators: arithmetic (line items sum to total), format (dates, currency), cross-document (claim number consistency).\n5. Review UI showing the crop of the source region next to the value; corrections stored as labeled data.\n6. Retrieval tier: hybrid text index for all; page-image multi-vector index for visual classes.\n\n**Failure modes**\n- Accounting-format misreads ((1,204) vs 1,204): parser rules plus total-consistency validation.\n- OCR service brownout: queue with retries and backoff; degrade to born-digital text layer where available.\n- Table split across pages loses header: stitch by repeated header or column-count/alignment heuristic; flag if ambiguous.\n- Model/parser upgrade regresses a field: golden set of 2,000 annotated pages gating releases, field-level accuracy dashboards.\n- Prompt injection in uploaded document (\"approve this claim\"): extraction output is validated data only; no agentic actions from document text.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's head of claims operations says: *\"Your extraction misread a repair estimate: $1,204 credit became a $1,204 charge. We paid a claim wrong. My team now says OCR can't be trusted and wants to go back to manual keying.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"Thank you for flagging it precisely, because it lets me be precise about what went wrong. The estimate showed the credit in parentheses, the accounting convention for a negative number. Our pipeline treated the parentheses as punctuation and read the value as positive. That was a defect in our parsing rules and in our validation, not an inevitable limit of automation.\"\n\n*Impact.* \"One claim was overpaid by twice the credit amount, $2,408, and the incident undermined your team's confidence, which is the harder thing to repair. I'd rather you keep a healthy skepticism than trust us blindly.\"\n\n*Remedy.* \"Three controls, effective this week. First, the parser now treats parenthesized values as negatives, with a regression test built from this exact document and thirty other format variants your adjusters have seen. Second, every estimate table has to reconcile: line items must sum to the stated total, and any mismatch blocks the field and routes it to a person, with the source image crop beside the value. That check would have caught this claim. Third, we'll measure monetary-field accuracy weekly against a sample your team keys by hand and report it to you; if it falls below ninety-nine percent we pause automatic payment recommendations for that document type. Manual keying isn't free of error either, so I'd like us to compare error rates on the same hundred claims before deciding.\"\n", "lab": "\"\"\"Module 08 lab: layout-aware document parsing, header-aware table extraction with numeric validation,\nand ColPali-style late-interaction (MaxSim) retrieval over page patch embeddings.\n\nNo ML weights are needed: OCR output is simulated as positioned words (the structure a layout model emits),\nand \"patch embeddings\" are deterministic hashed vectors with the same shape and scoring math as ColPali.\nRun: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport hashlib\nimport json\nimport logging\nimport math\nimport random\nimport re\nimport sys\nfrom decimal import Decimal, InvalidOperation\nfrom enum import Enum\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab08\")\n\n\nclass DocumentError(Exception):\n    pass\n\n\nclass OcrTransientError(DocumentError):\n    \"\"\"Retryable OCR service failure.\"\"\"\n\n\nclass TableValidationError(DocumentError):\n    pass\n\n\nclass LowConfidenceError(DocumentError):\n    pass\n\n\nclass ElementType(str, Enum):\n    TITLE = \"title\"\n    TEXT = \"text\"\n    TABLE = \"table\"\n    FOOTER = \"footer\"\n\n\nclass Word(BaseModel):\n    text: str\n    x: float\n    y: float\n    w: float\n    conf: float = Field(ge=0, le=1)\n\n\nclass Page(BaseModel):\n    number: int\n    width: float = 600\n    height: float = 800\n    words: list[Word]\n\n\nclass Element(BaseModel):\n    type: ElementType\n    page: int\n    text: str\n    bbox: tuple[float, float, float, float]\n    confidence: float\n    rows: list[list[str]] | None = None\n\n\ndef group_lines(words: list[Word], y_tol: float = 6.0) -> list[list[Word]]:\n    lines: list[list[Word]] = []\n    for w in sorted(words, key=lambda w: (w.y, w.x)):\n        if lines and abs(lines[-1][0].y - w.y) <= y_tol:\n            lines[-1].append(w)\n        else:\n            lines.append([w])\n    return [sorted(l, key=lambda w: w.x) for l in lines]\n\n\ndef split_columns(line: list[Word], gap: float = 40.0) -> list[str]:\n    \"\"\"Words separated by a large horizontal gap belong to different cells.\"\"\"\n    cells: list[list[str]] = [[line[0].text]]\n    for prev, cur in zip(line, line[1:]):\n        if cur.x - (prev.x + prev.w) > gap:\n            cells.append([cur.text])\n        else:\n            cells[-1].append(cur.text)\n    return [\" \".join(c) for c in cells]\n\n\ndef parse_page(page: Page, min_conf: float = 0.8) -> list[Element]:\n    \"\"\"Heuristic layout analysis: footer by position, title by size/position, table by multi-cell aligned lines.\"\"\"\n    elements: list[Element] = []\n    lines = group_lines(page.words)\n    table_rows: list[tuple[list[str], list[Word]]] = []\n\n    def flush_table() -> None:\n        if len(table_rows) >= 2:\n            ws = [w for _, ln in table_rows for w in ln]\n            elements.append(Element(type=ElementType.TABLE, page=page.number, text=\"\\n\".join(\" | \".join(r) for r, _ in table_rows),\n                                    bbox=(min(w.x for w in ws), min(w.y for w in ws), max(w.x + w.w for w in ws), max(w.y for w in ws)),\n                                    confidence=min(w.conf for w in ws), rows=[r for r, _ in table_rows]))\n        else:\n            for r, ln in table_rows:\n                elements.append(_text_element(page.number, ln, ElementType.TEXT))\n        table_rows.clear()\n\n    for ln in lines:\n        y = ln[0].y\n        if y > page.height * 0.93:\n            flush_table()\n            elements.append(_text_element(page.number, ln, ElementType.FOOTER))\n            continue\n        cells = split_columns(ln)\n        if len(cells) >= 3:\n            table_rows.append((cells, ln))\n            continue\n        flush_table()\n        etype = ElementType.TITLE if y < page.height * 0.08 else ElementType.TEXT\n        elements.append(_text_element(page.number, ln, etype))\n    flush_table()\n    low = [e for e in elements if e.confidence < min_conf]\n    if low:\n        log.warning(\"low confidence elements\", extra={\"ctx\": {\"page\": page.number, \"count\": len(low), \"types\": [e.type for e in low]}})\n    return [e for e in elements if e.type is not ElementType.FOOTER]  # footers/headers are noise for retrieval\n\n\ndef _text_element(page: int, ln: list[Word], etype: ElementType) -> Element:\n    return Element(type=etype, page=page, text=\" \".join(w.text for w in ln),\n                   bbox=(min(w.x for w in ln), ln[0].y, max(w.x + w.w for w in ln), ln[0].y),\n                   confidence=min(w.conf for w in ln))\n\n\nNUM = re.compile(r\"^\\(?-?\\$?[\\d,]+(\\.\\d+)?\\)?$\")\n\n\ndef parse_number(cell: str) -> Decimal:\n    \"\"\"'(1,204)' -> -1204 (accounting negative); strips currency and thousands separators.\"\"\"\n    s = cell.strip()\n    if not NUM.match(s):\n        raise TableValidationError(f\"not numeric: {cell!r}\")\n    neg = s.startswith(\"(\") and s.endswith(\")\")\n    try:\n        v = Decimal(re.sub(r\"[()$,]\", \"\", s))\n    except InvalidOperation as exc:\n        raise TableValidationError(f\"bad number {cell!r}\") from exc\n    return -v if neg else v\n\n\nclass TableRecord(BaseModel):\n    page: int\n    row_label: str\n    values: dict[str, Decimal]\n\n\ndef table_to_records(el: Element) -> list[TableRecord]:\n    \"\"\"Header-aware: every data cell is tied to its row label and column header ('row-as-record' chunks).\"\"\"\n    assert el.rows\n    header, *body = el.rows\n    out: list[TableRecord] = []\n    for row in body:\n        if len(row) != len(header):\n            raise TableValidationError(f\"row has {len(row)} cells, header has {len(header)}: {row}\")\n        label = row[0]\n        if label.lower().startswith(\"total\"):\n            continue\n        out.append(TableRecord(page=el.page, row_label=label, values={h: parse_number(c) for h, c in zip(header[1:], row[1:])}))\n    return out\n\n\ndef validate_totals(el: Element) -> None:\n    header, *body = el.rows or [[]]\n    totals = [r for r in body if r and r[0].lower().startswith(\"total\")]\n    data = [r for r in body if r and not r[0].lower().startswith(\"total\")]\n    for t in totals:\n        for col in range(1, len(header)):\n            expected = sum((parse_number(r[col]) for r in data), Decimal(0))\n            if parse_number(t[col]) != expected:\n                raise TableValidationError(f\"column {header[col]!r}: total {t[col]} != sum {expected}\")\n\n\n# ---- ColPali-style late interaction -----------------------------------------------------------------\nDIM = 64\n\n\ndef vec(token: str) -> list[float]:\n    h = hashlib.sha256(token.lower().encode()).digest()\n    v = [(b - 127.5) / 127.5 for b in h[:DIM // 2]] + [(b - 127.5) / 127.5 for b in hashlib.sha256(h).digest()[:DIM // 2]]\n    n = math.sqrt(sum(x * x for x in v))\n    return [x / n for x in v]\n\n\ndef dot(a: list[float], b: list[float]) -> float:\n    return sum(x * y for x, y in zip(a, b))\n\n\nclass PageIndex:\n    \"\"\"One multi-vector per page: a vector per word-patch. Score = sum over query tokens of the max patch similarity.\"\"\"\n\n    def __init__(self) -> None:\n        self.patches: dict[str, list[list[float]]] = {}\n\n    def add_page(self, page_id: str, page: Page) -> None:\n        self.patches[page_id] = [vec(w.text) for w in page.words] or [vec(\"\")]\n\n    def maxsim(self, query: str, page_id: str) -> float:\n        q = [vec(t) for t in re.findall(r\"\\w+\", query)]\n        return sum(max(dot(qv, pv) for pv in self.patches[page_id]) for qv in q)\n\n    def search(self, query: str, k: int = 2) -> list[tuple[str, float]]:\n        return sorted(((pid, self.maxsim(query, pid)) for pid in self.patches), key=lambda x: -x[1])[:k]\n\n\nclass FlakyOcr:\n    \"\"\"Simulated OCR service: fails twice, then returns positioned words for a financial page.\"\"\"\n\n    def __init__(self) -> None:\n        self.calls = 0\n\n    async def ocr(self, doc_id: str, page_no: int) -> Page:\n        self.calls += 1\n        await asyncio.sleep(0.002)\n        if self.calls <= 2:\n            raise OcrTransientError(\"503 from OCR endpoint\")\n        return make_page(page_no)\n\n\ndef make_page(n: int, bad_total: bool = False) -> Page:\n    def row(y: float, cells: list[str], conf: float = 0.98) -> list[Word]:\n        xs = [40, 300, 420]\n        return [Word(text=c, x=x, y=y, w=len(c) * 7, conf=conf) for x, c in zip(xs, cells)]\n\n    words = [Word(text=\"Quarterly\", x=40, y=30, w=70, conf=0.99), Word(text=\"Report\", x=115, y=30, w=50, conf=0.99),\n             Word(text=\"Revenue\", x=40, y=120, w=50, conf=0.97), Word(text=\"rose\", x=95, y=120, w=30, conf=0.97)]\n    words += row(200, [\"Segment\", \"2023\", \"2024\"]) + row(220, [\"Cloud\", \"1,200\", \"(1,204)\"]) + row(240, [\"Services\", \"800\", \"300\"])\n    words += row(260, [\"Total\", \"2,000\", \"1,100\" if bad_total else \"(904)\"], conf=0.85)\n    words += [Word(text=\"Page\", x=280, y=770, w=30, conf=0.99), Word(text=str(n), x=315, y=770, w=10, conf=0.99)]\n    return Page(number=n, words=words)\n\n\nasync def ocr_with_retry(ocr: FlakyOcr, doc: str, page_no: int, attempts: int = 5) -> Page:\n    for i in range(1, attempts + 1):\n        try:\n            return await ocr.ocr(doc, page_no)\n        except OcrTransientError:\n            if i == attempts:\n                raise\n            await asyncio.sleep(random.uniform(0, 0.004 * 2 ** i))\n    raise AssertionError(\"unreachable\")\n\n\nasync def main() -> None:\n    ocr = FlakyOcr()\n    page = await ocr_with_retry(ocr, \"q4.pdf\", 1)\n    log.info(\"ocr ok\", extra={\"ctx\": {\"attempts\": ocr.calls, \"words\": len(page.words)}})\n    elements = parse_page(page)\n    for e in elements:\n        log.info(\"element\", extra={\"ctx\": {\"type\": e.type, \"text\": e.text[:60], \"conf\": e.confidence}})\n    table = next(e for e in elements if e.type is ElementType.TABLE)\n    validate_totals(table)\n    log.info(\"table valid\", extra={\"ctx\": {\"records\": [r.model_dump(mode=\"json\") for r in table_to_records(table)]}})\n\n    bad_table = next(e for e in parse_page(make_page(2, bad_total=True)) if e.type is ElementType.TABLE)\n
