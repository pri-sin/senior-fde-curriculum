 try:\n        validate_totals(bad_table)\n    except TableValidationError as exc:\n        log.info(\"validation caught bad extraction\", extra={\"ctx\": {\"error\": str(exc)}})\n\n    index = PageIndex()\n    index.add_page(\"q4.pdf#1\", page)\n    other = Page(number=2, words=[Word(text=t, x=10 * i, y=50, w=30, conf=0.9) for i, t in enumerate(\"employee leave policy vacation days parental\".split())])\n    index.add_page(\"handbook.pdf#2\", other)\n    for q in (\"cloud revenue 2024\", \"parental leave vacation\"):\n        log.info(\"maxsim search\", extra={\"ctx\": {\"q\": q, \"ranked\": [(p, round(s, 3)) for p, s in index.search(q)]}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m09", "num": "09", "dir": "09_langgraph_agents", "title": "Agent State Machines & Checkpointing", "track": "Agents and integration", "readme": "# Intuition & Mental Model\n\nA simple LLM chain is a **straight road**: step 1, step 2, step 3. A real agent is a **flowchart with loops**: draft an answer, critique it, go back and fix it, call a tool, wait for a human, continue tomorrow. Frameworks like LangGraph model this as a **state machine**: a typed *state* object, *nodes* (functions that read state and return updates), and *edges* (fixed or conditional) that decide the next node. Cycles are allowed, which is what lets an agent iterate.\n\nWhy enterprises care:\n- **Determinism you can reason about.** Every transition is explicit, so you can draw it, test it and audit it. \"The agent decided\" becomes \"node `critic` returned `revise`, edge routed to `drafter`.\"\n- **Persistence and checkpointing.** After every node the state is saved. If the pod dies mid-run, you resume from the last checkpoint instead of paying for the whole run again. The same mechanism enables *interrupts* (pause for human approval, resume days later) and *time travel* (replay from an earlier checkpoint to debug).\n- **Bounded loops.** A cycle without a limit is an invoice. Every graph needs a recursion limit and a budget.\n\nThe lab implements these semantics from scratch (state reducers, conditional edges, checkpoint/resume, interrupt, recursion limit) so you understand what LangGraph's `StateGraph`, `add_conditional_edges`, `checkpointer` and `interrupt` actually do.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  api[\"POST /runs with thread_id and input\"] --> load[\"Load latest checkpoint<br/>or start at entry\"]\n  load --> plan[\"plan\"] --> draft[\"draft\"]\n  draft -->|\"needs tool\"| tools[\"tools<br/>retry, backoff, timeouts\"] --> draft\n  draft --> critic[\"critic\"]\n  critic -->|\"revise (max 3 cycles)\"| draft\n  critic -->|\"approve\"| gate{\"High-risk action?\"}\n  gate -->|\"yes\"| hum[\"Human gate<br/>INTERRUPT: persist state, return 202\"]\n  hum -->|\"POST /runs/id/resume\"| fin[\"finish\"]\n  gate -->|\"no\"| fin\n  fin --> done[\"END\"]\n  plan -.->|\"checkpoint after every node\"| cp[(\"Checkpoint store<br/>Postgres, SQLite, or Redis\")]\n  critic -.-> cp\n  fin -.-> cp\n```\n\nFailure model: a crash between nodes resumes at next_node. A crash inside a node re-runs that node, so side-effecting tools need idempotency keys. A recursion limit (for example 25 steps) raises GraphRecursionError.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **LangGraph (explicit graph + checkpointer)** | Small overhead per node (checkpoint write ~2-10 ms) | High: stateless workers, state in Postgres/Redis | Medium: must model the flow | Low framework cost; cost is LLM calls |\n| **Free-form agent loop (ReAct \"while True\")** | Lowest to prototype | Poor control: unbounded loops, hard to resume | Low initially, High to harden | Unpredictable token spend |\n| **Workflow engine (Temporal/Step Functions) + LLM activities** | Higher orchestration latency | Very high, durable for days/months | High: separate platform and SDKs | Medium-High (platform ops) |\n\n# Enterprise War Stories & Edge Cases\n\n**1. The infinite revise loop.** A drafter/critic pair disagreed forever: the critic always found a nit. 40,000 loops ran overnight on a stuck input, costing roughly $9k. *Remediation:* recursion limit, per-run token budget, \"stalled progress\" detection (same critic feedback twice \u2192 escalate), and a cheap model for critique.\n\n**2. Resume that double-charged a customer.** The pod died after the `issue_refund` tool call succeeded but before the checkpoint was written; on resume the node re-ran and refunded twice. *Remediation:* idempotency keys derived from `(thread_id, step)` on every side-effecting tool, write-ahead \"intent\" records, and checkpoint *before* external effects when feasible (outbox pattern).\n\n**3. State blob bloat.** The full retrieved documents were stored in agent state; checkpoints reached 8 MB each, and the database filled in weeks with replay latency of seconds. *Remediation:* store references (document ids) in state, keep large artifacts in object storage, TTL old checkpoints (keep latest + milestones), and schema-version the state so old checkpoints can still be resumed after deploys.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design a durable agent platform for a telecom's customer-care automation: 30,000 conversations/day, each averaging 9 agent steps, some requiring human approval for credits above $50, runs can pause for up to 3 days, and no action may be applied twice.\n\n**Requirements**\n- Resume after crashes/deploys at the last completed step; exactly-once-effective side effects.\n- Human approval gates with SLA tracking; audit log of every transition.\n- Cost cap per conversation; no infinite loops.\n\n**Sizing**\n- Steps: 30,000 x 9 = **270,000 steps/day** = 3.1 steps/s average; peak 10x = **31 steps/s**.\n- LLM tokens: per step ~1,800 input + 250 output; 270,000 x 2,050 = **553 M tokens/day**. At blended $4/M = **~$2.2k/day**; with a small model for routing/critique (60% of steps at 1/10 the price): ~$1.0k/day.\n- Checkpoint writes: one per step = 270,000/day; state ~12 KB (references, not documents) = **3.2 GB/day**; keep latest + milestone checkpoints: 90 days = ~60 GB after pruning. Postgres on one primary handles 31 writes/s trivially; JSONB per thread row keyed (thread_id, step).\n- Concurrency: step latency ~2.5 s (LLM-dominated) => 31 x 2.5 = ~78 concurrent steps at peak. Run 8 async workers x 20 concurrent = 160 slots (2x headroom).\n- Paused runs: 8% need approval = 2,400/day; avg wait 4 h => ~400 parked threads at any time, zero compute while parked (state is in the DB).\n- Budget guard: max 25 steps and 40k tokens per conversation; p99 conversation uses 14 steps, so limits trigger only on genuine loops.\n\n**Component breakdown**\n1. API: create/resume run endpoints returning run id; SSE for progress.\n2. Worker pool: pulls `(thread_id, next_node)` from a queue (visibility timeout), loads checkpoint, executes one node, writes checkpoint transactionally with the next queue message (outbox).\n3. Checkpointer: Postgres, state schema-versioned with migration functions.\n4. Tool gateway: idempotency keys `(thread_id, step, tool)`, circuit breakers, per-tool timeouts and retries with jitter.\n5. Approval service: interrupt creates a task in the agent-ops UI; resume via signed callback; SLA timers escalate at 4 h.\n6. Observability: step traces (Module 14), loop detector (repeated identical critic feedback), cost meter.\n\n**Failure modes**\n- Worker dies mid-node: queue visibility timeout redelivers; node re-runs; idempotency keys protect effects.\n- Deploy changes state schema: `schema_version` + upcasters; old threads continue on compatible nodes, incompatible ones are drained.\n- Approval never arrives: SLA escalation, then auto-cancel with customer message after 3 days.\n- Checkpoint DB outage: workers stop pulling (fail closed); no step runs without durable state.\n- Poison conversation (crashes every attempt): max 3 redeliveries, then dead-letter with the last checkpoint for engineers to replay.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's VP of Engineering says: *\"Your agent got stuck last Tuesday and kept calling the language model for six hours on one ticket. We got a $4,000 bill for a single customer. I'm told this is normal for agents. It isn't acceptable.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You're right that it's not acceptable, and it isn't normal for a well-built agent. On that ticket the drafting step and the review step disagreed with each other indefinitely: the reviewer kept finding something small to change. We had no ceiling on the number of loops and no budget attached to the conversation, so nothing stopped it.\"\n\n*Impact.* \"Four thousand dollars is the visible cost. The less visible one is that the customer's ticket was never answered, so you paid and got nothing.\"\n\n*Remedy.* \"Three controls, all already designed into the graph model we're moving to. First, a hard limit of twenty-five steps per conversation, after which the case goes to a human with everything the agent did so far. Second, a token budget per conversation, so a runaway is capped at about two dollars, not four thousand. Third, a stall detector: if the reviewer gives the same feedback twice, the loop stops and escalates, because repeating the same instruction is not progress. I'll show you the replay of last Tuesday's ticket under the new limits in the next review, so you can see it stop at step twelve.\"\n", "lab": "\"\"\"Module 09 lab: a LangGraph-semantics state machine built from scratch.\n\nFeatures: typed Pydantic state with per-field reducers, nodes as async functions returning partial updates,\nconditional edges, cycles with a recursion limit, durable checkpoints after every node, resume after a crash,\nhuman-approval interrupts, idempotent side-effecting tools, backoff retries. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport sys\nimport tempfile\nfrom pathlib import Path\nfrom typing import Any, Awaitable, Callable\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab09\")\n\nEND = \"__end__\"\n\n\nclass GraphError(Exception):\n    pass\n\n\nclass GraphRecursionError(GraphError):\n    pass\n\n\nclass NodeCrash(GraphError):\n    \"\"\"Simulated process death inside/between nodes.\"\"\"\n\n\nclass ToolTransientError(GraphError):\n    pass\n\n\nclass Interrupted(GraphError):\n    def __init__(self, thread_id: str, reason: str) -> None:\n        super().__init__(f\"{thread_id} interrupted: {reason}\")\n        self.thread_id, self.reason = thread_id, reason\n\n\nclass AgentState(BaseModel):\n    task: str\n    plan: list[str] = Field(default_factory=list)\n    draft: str = \"\"\n    feedback: list[str] = Field(default_factory=list)  # reducer: append\n    revisions: int = 0\n    approved: bool | None = None\n    tool_log: list[str] = Field(default_factory=list)  # reducer: append\n    refunds_issued: int = 0\n    tokens_used: int = 0  # reducer: add\n    schema_version: int = 1\n\n\nAPPEND = {\"feedback\", \"tool_log\"}\nADD = {\"tokens_used\"}\n\n\ndef apply_update(state: AgentState, update: dict[str, Any]) -> AgentState:\n    data = state.model_dump()\n    for k, v in update.items():\n        if k not in data:\n            raise GraphError(f\"node returned unknown state key {k!r}\")\n        if k in APPEND:\n            data[k] = data[k] + list(v)\n        elif k in ADD:\n            data[k] = data[k] + v\n        else:\n            data[k] = v\n    return AgentState.model_validate(data)\n\n\nclass Checkpoint(BaseModel):\n    thread_id: str\n    step: int\n    next_node: str\n    state: AgentState\n    pending_interrupt: str | None = None\n\n\nclass FileCheckpointer:\n    \"\"\"Durable JSON-per-thread store; swap for Postgres/Redis. Atomic via write-temp-then-rename.\"\"\"\n\n    def __init__(self, root: Path) -> None:\n        self.root = root\n        root.mkdir(parents=True, exist_ok=True)\n\n    def _path(self, thread_id: str) -> Path:\n        return self.root / f\"{thread_id}.json\"\n\n    async def put(self, cp: Checkpoint) -> None:\n        tmp = self._path(cp.thread_id).with_suffix(\".tmp\")\n        await asyncio.to_thread(tmp.write_text, cp.model_dump_json())\n        await asyncio.to_thread(tmp.replace, self._path(cp.thread_id))\n\n    async def get(self, thread_id: str) -> Checkpoint | None:\n        p = self._path(thread_id)\n        if not p.exists():\n            return None\n        return Checkpoint.model_validate_json(await asyncio.to_thread(p.read_text))\n\n\nNodeFn = Callable[[AgentState], Awaitable[dict[str, Any]]]\nRouter = Callable[[AgentState], str]\n\n\nclass StateGraph:\n    def __init__(self, recursion_limit: int = 25) -> None:\n        self.nodes: dict[str, NodeFn] = {}\n        self.edges: dict[str, str] = {}\n        self.cond: dict[str, Router] = {}\n        self.entry = \"\"\n        self.interrupt_before: set[str] = set()\n        self.recursion_limit = recursion_limit\n\n    def add_node(self, name: str, fn: NodeFn) -> \"StateGraph\":\n        self.nodes[name] = fn\n        return self\n\n    def add_edge(self, src: str, dst: str) -> \"StateGraph\":\n        self.edges[src] = dst\n        return self\n\n    def add_conditional_edges(self, src: str, router: Router) -> \"StateGraph\":\n        self.cond[src] = router\n        return self\n\n    def set_entry(self, name: str) -> \"StateGraph\":\n        self.entry = name\n        return self\n\n    def compile(self, checkpointer: FileCheckpointer, crash_after: str | None = None) -> \"CompiledGraph\":\n        for src, dst in self.edges.items():\n            if src not in self.nodes or (dst not in self.nodes and dst != END):\n                raise GraphError(f\"bad edge {src}->{dst}\")\n        return CompiledGraph(self, checkpointer, crash_after)\n\n\nclass CompiledGraph:\n    def __init__(self, g: StateGraph, cp: FileCheckpointer, crash_after: str | None) -> None:\n        self.g, self.cp, self.crash_after = g, cp, crash_after\n\n    def _next(self, node: str, state: AgentState) -> str:\n        if node in self.g.cond:\n            nxt = self.g.cond[node](state)\n        elif node in self.g.edges:\n            nxt = self.g.edges[node]\n        else:\n            raise GraphError(f\"node {node!r} has no outgoing edge\")\n        if nxt != END and nxt not in self.g.nodes:\n            raise GraphError(f\"router returned unknown node {nxt!r}\")\n        return nxt\n\n    async def invoke(self, thread_id: str, initial: AgentState | None = None, resume_update: dict[str, Any] | None = None) -> AgentState:\n        cp = await self.cp.get(thread_id)\n        if cp is None:\n            if initial is None:\n                raise GraphError(\"no checkpoint and no initial state\")\n            cp = Checkpoint(thread_id=thread_id, step=0, next_node=self.g.entry, state=initial)\n        elif cp.pending_interrupt and resume_update is None:\n            raise Interrupted(thread_id, cp.pending_interrupt)\n        state, node, step = cp.state, cp.next_node, cp.step\n        if resume_update:\n            state = apply_update(state, resume_update)\n            cp = cp.model_copy(update={\"state\": state, \"pending_interrupt\": None})\n        interrupted_once = {n for n in self.g.interrupt_before if resume_update and n == node}\n        while node != END:\n            if step >= self.g.recursion_limit:\n                raise GraphRecursionError(f\"{thread_id}: exceeded {self.g.recursion_limit} steps\")\n            if node in self.g.interrupt_before and node not in interrupted_once:\n                await self.cp.put(Checkpoint(thread_id=thread_id, step=step, next_node=node, state=state, pending_interrupt=f\"approval needed before {node}\"))\n                raise Interrupted(thread_id, f\"approval needed before {node}\")\n            update = await self.g.nodes[node](state)\n            state = apply_update(state, update)\n            step += 1\n            nxt = self._next(node, state)\n            await self.cp.put(Checkpoint(thread_id=thread_id, step=step, next_node=nxt, state=state))\n            log.info(\"step\", extra={\"ctx\": {\"thread\": thread_id, \"step\": step, \"node\": node, \"next\": nxt}})\n            if self.crash_after == node:\n                self.crash_after = None\n                raise NodeCrash(f\"process died after {node}\")\n            node = nxt\n        return state\n\n\nclass FakeLLM:\n    \"\"\"Critic rejects the first draft; deterministic.\"\"\"\n\n    async def draft(self, task: str, feedback: list[str]) -> str:\n        await asyncio.sleep(0.001)\n        return f\"Answer to '{task}'\" + (\" (revised: \" + feedback[-1] + \")\" if feedback else \"\")\n\n    async def critique(self, draft: str) -> str | None:\n        await asyncio.sleep(0.001)\n        return None if \"revised\" in draft else \"add concrete figures\"\n\n\nclass RefundTool:\n    \"\"\"Side-effecting tool made idempotent by key; transient failures retried with backoff.\"\"\"\n\n    def __init__(self) -> None:\n        self.done: dict[str, int] = {}\n        self.fail_next = 1\n\n    async def issue(self, key: str, amount: int) -> str:\n        if self.fail_next > 0:\n            self.fail_next -= 1\n            raise ToolTransientError(\"payments gateway 503\")\n        self.done.setdefault(key, amount)\n        return f\"refund:{key}:{self.done[key]}\"\n\n\ndef build_graph(llm: FakeLLM, tool: RefundTool, thread_id: str) -> StateGraph:\n    async def plan(s: AgentState) -> dict[str, Any]:\n        return {\"plan\": [\"draft\", \"critique\", \"refund\"], \"tokens_used\": 50}\n\n    async def draft(s: AgentState) -> dict[str, Any]:\n        text = await llm.draft(s.task, s.feedback)\n        return {\"draft\": text, \"revisions\": s.revisions + 1, \"tokens_used\": 200}\n\n    async def critic(s: AgentState) -> dict[str, Any]:\n        fb = await llm.critique(s.draft)\n        return {\"feedback\": [fb] if fb else [], \"tokens_used\": 80}\n\n    async def refund(s: AgentState) -> dict[str, Any]:\n        key = f\"{thread_id}:refund\"  # same key on re-run \u21d2 at-most-once effect\n        for attempt in range(1, 5):\n            try:\n                receipt = await tool.issue(key, 25)\n                return {\"tool_log\": [receipt], \"refunds_issued\": len(tool.done)}\n            except ToolTransientError:\n                await asyncio.sleep(random.uniform(0, 0.003 * 2 ** attempt))\n        raise GraphError(\"refund tool unavailable\")\n\n    def after_critic(s: AgentState) -> str:\n        if s.revisions >= 3:\n            return \"refund\"  # bounded loop: stop iterating, escalate in real systems\n        return \"draft\" if s.feedback and s.feedback[-1] and \"revised\" not in s.draft else \"refund\"\n\n    g = StateGraph(recursion_limit=12)\n    g.add_node(\"plan\", plan).add_node(\"draft\", draft).add_node(\"critic\", critic).add_node(\"refund\", refund)\n    g.set_entry(\"plan\").add_edge(\"plan\", \"draft\").add_edge(\"draft\", \"critic\")\n    g.add_conditional_edges(\"critic\", after_critic).add_edge(\"refund\", END)\n    g.interrupt_before.add(\"refund\")\n    return g\n\n\nasync def main() -> None:\n    cp = FileCheckpointer(Path(tempfile.mkdtemp(prefix=\"lab09-\")))\n    llm, tool = FakeLLM(), RefundTool()\n\n    thread = \"t-100\"\n    graph = build_graph(llm, tool, thread).compile(cp, crash_after=\"critic\")\n    try:\n        await graph.invoke(thread, AgentState(task=\"summarise Q3 churn\"))\n    except NodeCrash as exc:\n        saved = await cp.get(thread)\n        log.warning(\"crash\", extra={\"ctx\": {\"error\": str(exc), \"resume_at\": saved.next_node if saved else None}})\n\n    try:\n        await graph.invoke(thread)  # new process would build the same graph and call invoke again\n    except Interrupted as exc:\n        log.info(\"paused for human\", extra={\"ctx\": {\"reason\": exc.reason}})\n\n    final = await graph.invoke(thread, resume_update={\"approved\": True})\n    log.info(\"final\", extra={\"ctx\": {\"draft\": final.draft, \"revisions\": final.revisions, \"tokens\": final.tokens_used,\n                                      \"tool_log\": final.tool_log, \"refunds_issued\": final.refunds_issued}})\n\n    # idempotency: replaying the refund node cannot double-pay\n    again = await build_graph(llm, tool, thread).nodes[\"refund\"](final)\n    log.info(\"replayed refund\", extra={\"ctx\": {\"refunds_total\": len(tool.done), \"receipt\": again[\"tool_log\"]}})\n\n    loop = StateGraph(recursion_limit=5)\n\n    async def spin(s: AgentState) -> dict[str, Any]:\n        return {\"revisions\": s.revisions + 1}\n\n    loop.add_node(\"spin\", spin).set_entry(\"spin\").add_edge(\"spin\", \"spin\")\n    try:\n        await loop.compile(cp).invoke(\"t-loop\", AgentState(task=\"x\"))\n    except GraphRecursionError as exc:\n        log.info(\"recursion guard\", extra={\"ctx\": {\"error\": str(exc)}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m10", "num": "10", "dir": "10_multi_agent_systems", "title": "Multi-Agent Orchestration & Governance", "track": "Agents and integration", "readme": "# Intuition & Mental Model\n\nOne agent with twenty tools and a long prompt behaves like one employee doing every job: it gets confused, slow and unauditable. A **multi-agent system** is an organization chart: a **supervisor** receives the goal, breaks it into tasks and delegates to **specialist workers** (each with a narrow prompt, a small tool set and its own limits). The supervisor merges results and decides what happens next.\n\nThree governance ideas make this safe in enterprises:\n1. **Consensus.** For high-stakes judgments (is this transaction fraud? does this clause violate policy?), ask several independent agents (different prompts or models) and require a quorum or a weighted majority. Disagreement is a signal, not an error: it routes to a human.\n2. **Fallbacks.** Every worker has a degradation path: retry with backoff, then a secondary model/agent, then a rule-based answer, then escalate. The system returns a *labelled* degraded result rather than an exception.\n3. **Human-in-the-loop (HITL) by risk, not by habit.** A policy engine scores each proposed action (amount, reversibility, data sensitivity). Low-risk actions auto-execute; high-risk actions wait for approval; some actions are forbidden outright. Approvals, rejections and reasons are all logged.\n\nMore agents is not automatically better: every hop adds latency, cost and a new place to fail. Add an agent only when specialization measurably improves accuracy or governance.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  req[\"Request\"] --> sup[\"Supervisor<br/>budget 60k tokens, 45 s deadline, max depth 2\"]\n  sup --> res[\"Researcher<br/>fallback: cache\"]\n  sup --> pol[\"Policy checker<br/>fallback: rules only\"]\n  sup --> a[\"Risk scorer A\"]\n  sup --> b[\"Risk scorer B\"]\n  sup --> c[\"Risk scorer C\"]\n  a --> cons[\"Consensus<br/>verdict and agreement ratio\"]\n  b --> cons\n  c --> cons\n  res --> merge[\"Supervisor merge<br/>proposed action\"]\n  pol --> merge\n  cons --> merge\n  merge --> gov{\"Governance policy engine\"}\n  gov -->|\"low risk\"| auto[\"Auto-execute\"] --> audit[\"Audit log\"]\n  gov -->|\"high risk\"| queue[\"Approval queue\"] --> human[\"Human approve or reject\"] --> audit\n  gov -->|\"forbidden\"| blk[\"Block and alert\"] --> audit\n```\n\nThe three scorers use different prompts or models and independent contexts. Each worker has its own credentials, and only the executor can call write APIs.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Hierarchical supervisor + specialist workers** | Medium: planning hop + parallel workers | High: workers scale independently | Medium-High | Medium: extra planning tokens |\n| **Single generalist agent with many tools** | Lowest for simple tasks | Low: prompt/tool sprawl, hard to test | Low | Low until errors dominate |\n| **Peer-to-peer / debate swarm** | Highest: many rounds | Medium; hard to bound | High: emergent behavior, hard to audit | High: N agents x rounds tokens |\n\n# Enterprise War Stories & Edge Cases\n\n**1. Three agents agreeing for the wrong reason.** A \"consensus\" panel used the same model and nearly identical prompts, so all three made the same mistake on an edge case (a sanctions-list near-match) and the system approved a payment. *Remediation:* diversity by construction (different models, prompts, evidence slices), deterministic rule checks as one voter, calibrated confidence, and mandatory human review when any voter's confidence is below threshold.\n\n**2. The supervisor that delegated forever.** The supervisor re-planned after each worker reply, and a flaky worker caused repeated re-plans; one request spawned 600 sub-tasks. *Remediation:* depth and fan-out limits, global token/time budget propagated to workers, idempotent task IDs to dedupe, and a re-plan cap (max 2) after which the request escalates.\n\n**3. Approval fatigue.** Every action required approval; reviewers clicked \"approve\" in 1.5 seconds, and a harmful refund slipped through. *Remediation:* risk-tiered routing so humans see only the 5-10% of actions that matter, show the evidence and the *reason* for escalation, require a typed justification for high-risk approvals, and sample auto-approved actions for audit.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design a multi-agent adjudication system for a payments processor: 3 million transaction-alert reviews per day, 99.9% resolved without a human, but anything over $10k, any irreversible action, or any panel disagreement must have a human decision in under 15 minutes. Every decision must be explainable to a regulator.\n\n**Requirements**\n- Latency: auto-resolved alerts p95 < 4 s; human-routed alerts queued within 5 s.\n- Accuracy: false-negative (missed fraud) rate < 0.1% on the labeled set; false-positive rate low enough to cap customer friction.\n- Governance: full decision trace, reviewer identity and justification, quarterly audit sampling.\n\n**Sizing**\n- Rate: 3,000,000 / 86,400 = **34.7 alerts/s** average, peak 4x = **~140/s**.\n- Agents per alert: supervisor (1 call, 1.5k tokens), 3 risk scorers (1.2k tokens each), policy checker (rules engine, no LLM). Tokens/alert = 1.5k + 3.6k = **5.1k**. Daily: 3 M x 5.1k = **15.3 B tokens/day**. At a blended $0.60/M for small models = **~$9.2k/day**; routing 70% of alerts through a single cheap scorer first (escalating to the panel only when its confidence is under 0.9) cuts tokens to ~7.5 B/day (**~$4.5k/day**).\n- Concurrency: 140/s x ~2.2 s (parallel scorers dominated by slowest) = **~310 in-flight alerts** at peak; 12 worker pods x 40 concurrent.\n- Human review: 0.1% hard-routed (over $10k etc.) + ~0.6% panel disagreement ~= 0.7% = **21,000 cases/day**. Handling at 90 s each = 525 reviewer-hours/day => ~70 reviewers per shift pattern; reduce by tightening routing for repeat benign patterns.\n- Audit storage: decision trace 6 KB x 3 M = **18 GB/day**, 7-year retention = ~46 TB in cold storage with a hot 90-day index (1.6 TB).\n- Approval queue: 21,000/day = 0.24/s average; trivial for Postgres + SKIP LOCKED, SLA timers via a scheduler.\n\n**Component breakdown**\n1. Ingest: alert stream (Kafka), dedupe by alert id, enrichment (customer history, device, geo).\n2. Triage agent (cheap model) -> confidence; high-confidence benign alerts auto-close with a logged rationale.\n3. Panel: three scorers with different models/prompts and one deterministic rules voter; confidence-weighted consensus with agreement ratio.\n4. Governance policy engine (versioned code, not a prompt): amount, reversibility, customer tier, jurisdiction -> AUTO / APPROVAL / BLOCKED.\n5. Approval service with SLA timers, escalation, justification enforcement, evidence view.\n6. Executor: the only component with write credentials; idempotency keys per decision.\n7. Audit log (append-only, hash-chained) + weekly sampling for QA and model-drift checks.\n\n**Failure modes**\n- Correlated errors across scorers: model diversity, rules voter, and monitoring of agreement rate (a sudden jump to 100% is suspicious).\n- Provider outage: fallback chain scorer -> secondary model -> rules; fallback results are labeled `degraded` and lower the auto-approve ceiling to $500.\n- Reviewer backlog: dynamic thresholds (never relaxing hard limits), load-shedding by risk rank, staffing alerts at queue age > 10 min.\n- Prompt injection via transaction memo (\"approve this payment\"): memo is data in a delimited field, scorers cannot call tools, executor ignores free text.\n- Policy drift: policy engine changes require review + replay against last 30 days of decisions; diff report before rollout.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's Chief Risk Officer says: *\"A regulator asked us why the AI approved a $48,000 transfer to a sanctioned party. Your team told me you have three agents voting, so how did all three get it wrong?\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"I want to answer this directly. The three scorers were built on the same underlying model with nearly identical prompts. On this case, the beneficiary name was a near-match to a sanctions-list entry with a transliteration difference, and all three made the same mistake together. We called it consensus, but it was really one opinion repeated three times.\"\n\n*Impact.* \"The transfer exceeded your own ten-thousand-dollar human-review threshold, and it should never have been eligible for automatic approval in the first place. That is a policy gap as well as a model error, and it is the part the regulator will care about most.\"\n\n*Remedy.* \"We're fixing both layers. First, the panel will use independent models and different evidence: one voter is a deterministic sanctions screening engine with fuzzy transliteration matching, which does not share failure modes with a language model. Second, the amount and irreversibility rules move out of the prompts into a versioned policy engine, so anything over ten thousand dollars always goes to a named human, whatever the agents say. Third, I'll give your compliance team a full decision trace for this transfer today, covering each agent's vote, the policy rule that should have fired, and a replay of the last ninety days to find any similar near-misses, so you can tell the regulator what you found and what changed.\"\n", "lab": "\"\"\"Module 10 lab: hierarchical multi-agent orchestration with consensus voting, fallbacks and risk-tiered\nhuman-in-the-loop governance.\n\nSupervisor fans work out to workers in parallel under a shared budget/deadline; workers degrade through\nretry -> secondary -> rules-only; a consensus panel produces a verdict with an agreement ratio; the policy\nengine decides auto / approval / blocked; an approval queue models human review. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport sys\nfrom collections import Counter\nfrom enum import Enum\nfrom typing import Awaitable, Callable\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab10\")\n\n\nclass OrchestrationError(Exception):\n    pass\n\n\nclass BudgetExceededError(OrchestrationError):\n    pass\n\n\nclass WorkerTransientError(OrchestrationError):\n    pass\n\n\nclass WorkerFatalError(OrchestrationError):\n    pass\n\n\nclass QuorumNotReachedError(OrchestrationError):\n    pass\n\n\nclass Budget:\n    \"\"\"Shared across the whole request tree so a runaway sub-agent cannot overspend.\"\"\"\n\n    def __init__(self, tokens: int, max_replans: int = 2) -> None:\n        self.tokens, self.replans_left = tokens, max_replans\n        self._lock = asyncio.Lock()\n\n    async def spend(self, n: int) -> None:\n        async with self._lock:\n            if n > self.tokens:\n                raise BudgetExceededError(f\"need {n} tokens, {self.tokens} left\")\n            self.tokens -= n\n\n\nclass Case(BaseModel):\n    case_id: str\n    amount: int = Field(ge=0)\n    customer_tier: str = \"standard\"\n    text: str\n\n\nclass TaskStatus(str, Enum):\n    OK = \"ok\"\n    RETRIED = \"retried\"\n    FALLBACK = \"fallback\"\n    FAILED = \"failed\"\n\n\nclass WorkerResult(BaseModel):\n    worker: str\n    status: TaskStatus\n    output: dict[str, object]\n    tokens: int = 0\n\n\nHandler = Callable[[Case], Awaitable[dict[str, object]]]\n\n\nclass Worker:\n    \"\"\"Resilience wrapper: retry primary with backoff, then secondary, then a rules-only fallback.\"\"\"\n\n    def __init__(self, name: str, primary: Handler, secondary: Handler | None, rules: Handler, cost: int = 400,\n                 timeout_s: float = 0.5, attempts: int = 3) -> None:\n        self.name, self.primary, self.secondary, self.rules = name, primary, secondary, rules\n        self.cost, self.timeout_s, self.attempts = cost, timeout_s, attempts\n\n    async def run(self, case: Case, budget: Budget) -> WorkerResult:\n        await budget.spend(self.cost)\n        status = TaskStatus.OK\n        for i in range(1, self.attempts + 1):\n            try:\n                out = await asyncio.wait_for(self.primary(case), self.timeout_s)\n                return WorkerResult(worker=self.name, status=status, output=out, tokens=self.cost)\n            except (WorkerTransientError, asyncio.TimeoutError):\n                status = TaskStatus.RETRIED\n                await asyncio.sleep(random.uniform(0, 0.005 * 2 ** i))\n            except WorkerFatalError:\n                break\n        for handler in (self.secondary, self.rules):\n            if handler is None:\n                continue\n            try:\n                out = await asyncio.wait_for(handler(case), self.timeout_s)\n                log.warning(\"fallback used\", extra={\"ctx\": {\"worker\": self.name, \"handler\": handler.__name__}})\n                return WorkerResult(worker=self.name, status=TaskStatus.FALLBACK, output={**out, \"degraded\": True}, tokens=self.cost)\n            except (WorkerTransientError, asyncio.TimeoutError, WorkerFatalError):\n                continue\n        return WorkerResult(worker=self.name, status=TaskStatus.FAILED, output={\"error\": \"all handlers failed\"})\n\n\nclass Vote(BaseModel):\n    voter: str\n    verdict: str\n    confidence: float = Field(ge=0, le=1)\n\n\nclass Consensus(BaseModel):\n    verdict: str\n    agreement: float\n    needs_human: bool\n    votes: list[Vote]\n\n\ndef consensus(votes: list[Vote], quorum: int = 2, min_agreement: float = 0.67, min_conf: float = 0.6) -> Consensus:\n    \"\"\"Confidence-weighted majority. Low confidence or split vote routes to a human instead of guessing.\"\"\"\n    if len(votes) < quorum:\n        raise QuorumNotReachedError(f\"{len(votes)} votes < quorum {quorum}\")\n    weight: Counter[str] = Counter()\n    for v in votes:\n        weight[v.verdict] += v.confidence\n    verdict, w = weight.most_common(1)[0]\n    agreement = w / sum(weight.values())\n    needs_human = agreement < min_agreement or any(v.confidence < min_conf for v in votes if v.verdict == verdict)\n    return Consensus(verdict=verdict, agreement=round(agreement, 3), needs_human=needs_human, votes=votes)\n\n\nclass Action(BaseModel):\n    kind: str\n    amount: int\n    reversible: bool\n\n\nclass Decision(str, Enum):\n    AUTO = \"auto\"\n    NEEDS_APPROVAL = \"needs_approval\"\n    BLOCKED = \"blocked\"\n\n\ndef govern(action: Action, verdict: Consensus, forbidden: set[str] | None = None) -> tuple[Decision, str]:\n    if action.kind in (forbidden or {\"delete_account\"}):\n        return Decision.BLOCKED, f\"{action.kind} is never automated\"\n    if verdict.needs_human:\n        return Decision.NEEDS_APPROVAL, f\"panel uncertain (agreement {verdict.agreement})\"\n    if action.amount > 500 or not action.reversible:\n        return Decision.NEEDS_APPROVAL, \"high impact: amount > 500 or irreversible\"\n    return Decision.AUTO, \"low risk and consensus reached\"\n\n\nclass ApprovalQueue:\n    def __init__(self) -> None:\n        self.pending: dict[str, tuple[Action, str]] = {}\n        self.audit: list[dict[str, object]] = []\n\n    def submit(self, case_id: str, action: Action, reason: str) -> None:\n        self.pending[case_id] = (action, reason)\n        self.audit.append({\"case\": case_id, \"event\": \"queued\", \"reason\": reason})\n\n    async def decide(self, case_id: str, approver: str, approve: bool, justification: str) -> bool:\n        if case_id not in self.pending:\n            raise OrchestrationError(f\"no pending approval for {case_id}\")\n        if approve and not justification.strip():  # validate before popping so the item stays queued\n            raise OrchestrationError(\"approval of a high-risk action requires a justification\")\n        self.pending.pop(case_id)\n        self.audit.append({\"case\": case_id, \"event\": \"approved\" if approve else \"rejected\", \"by\": approver, \"why\": justification})\n        return approve\n\n\ndef make_scorer(name: str, bias: float, flaky: bool = False) -> Worker:\n    state = {\"n\": 0}\n\n    async def primary(case: Case) -> dict[str, object]:\n        state[\"n\"] += 1\n        await asyncio.sleep(0.002)\n        if flaky and state[\"n\"] <= 2:\n            raise WorkerTransientError(\"model 529 overloaded\")\n        risky = case.amount / 1000 + bias + (0.4 if \"urgent wire\" in case.text else 0)\n        return {\"verdict\": \"fraud\" if risky > 0.8 else \"ok\", \"confidence\": round(min(0.99, 0.55 + abs(risky - 0.8)), 2)}\n\n    async def secondary(case: Case) -> dict[str, object]:\n        return {\"verdict\": \"ok\", \"confidence\": 0.5}\n\n    async def rules(case: Case) -> dict[str, object]:\n        return {\"verdict\": \"fraud\" if case.amount > 5000 else \"ok\", \"confidence\": 0.5}\n\n    return Worker(name, primary, secondary, rules)\n\n\nclass Supervisor:\n    def __init__(self, scorers: list[Worker], queue: ApprovalQueue) -> None:\n        self.scorers, self.queue = scorers, queue\n\n    async def handle(self, case: Case, budget: Budget) -> dict[str, object]:\n        results = await asyncio.gather(*(s.run(case, budget) for s in self.scorers), return_exceptions=True)\n        votes: list[Vote] = []\n        for r in results:\n            if isinstance(r, BudgetExceededError):\n                raise r\n            if isinstance(r, WorkerResult) and r.status is not TaskStatus.FAILED:\n                votes.append(Vote(voter=r.worker, verdict=str(r.output[\"verdict\"]), confidence=float(r.output[\"confidence\"])))  # type: ignore[arg-type]\n        verdict = consensus(votes)\n        action = Action(kind=\"freeze_payment\" if verdict.verdict == \"fraud\" else \"release_payment\", amount=case.amount,\n                        reversible=verdict.verdict == \"fraud\" or case.amount <= 500)  # freezes are reversible; small releases are recallable\n        decision, why = govern(action, verdict)\n        if decision is Decision.NEEDS_APPROVAL:\n            self.queue.submit(case.case_id, action, why)\n        log.info(\"decision\", extra={\"ctx\": {\"case\": case.case_id, \"verdict\": verdict.verdict, \"agreement\": verdict.agreement,\n                                             \"decision\": decision, \"why\": why, \"tokens_left\": budget.tokens,\n                                             \"statuses\": [r.status.value for r in results if isinstance(r, WorkerResult)]}})\n        return {\"decision\": decision, \"verdict\": verdict.verdict}\n\n\nasync def main() -> None:\n    queue = ApprovalQueue()\n    sup = Supervisor([make_scorer(\"scorer-a\", 0.0, flaky=True), make_scorer(\"scorer-b\", 0.1), make_scorer(\"scorer-c\", -0.05)], queue)\n    cases = [Case(case_id=\"c1\", amount=120, text=\"coffee subscription\"),\n             Case(case_id=\"c2\", amount=900, text=\"urgent wire to new beneficiary\"),\n             Case(case_id=\"c3\", amount=700, text=\"equipment purchase, repeat vendor\")]\n    for c in cases:\n        await sup.handle(c, Budget(tokens=5000))\n    try:\n        await sup.handle(cases[0], Budget(tokens=500))\n    except BudgetExceededError as exc:\n        log.info(\"budget guard\", extra={\"ctx\": {\"error\": str(exc)}})\n    for case_id in list(queue.pending):\n        try:\n            await queue.decide(case_id, \"analyst-7\", True, \"\")\n        except OrchestrationError as exc:\n            log.info(\"justification required\", extra={\"ctx\": {\"case\": case_id, \"error\": str(exc)}})\n        await queue.decide(case_id, \"analyst-7\", True, \"verified beneficiary by phone callback\")\n    log.info(\"audit\", extra={\"ctx\": {\"events\": queue.audit}})\n    try:\n        consensus([Vote(voter=\"x\", verdict=\"ok\", confidence=0.9)])\n    except QuorumNotReachedError as exc:\n        log.info(\"quorum guard\", extra={\"ctx\": {\"error\": str(exc)}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m11", "num": "11", "dir": "11_mcp_integrations", "title": "MCP & Legacy System Integration", "track": "Agents and integration", "readme": "# Intuition & Mental Model\n\nModels are only useful to a business when they can **look things up and do things** in the systems where the business actually runs: a 15-year-old Oracle database, a SOAP service from a 2009 ERP, Jira, a mainframe export. The **Model Context Protocol (MCP)** is a standard \"USB port\" for this: a server advertises *tools* (name, description, JSON Schema for inputs) and *resources*; any MCP-capable client or agent can discover and call them over JSON-RPC 2.0 (stdio for local, streamable HTTP for remote).\n\nThe FDE's job is the adapter layer behind each tool:\n- **Translate** between the model's clean JSON arguments and the legacy system's quirks (XML envelopes, fixed-width fields, session cookies, odd date formats).\n- **Constrain**: read-only database roles, parameterized SQL, allowlisted operations, row limits. The model never writes SQL strings that get concatenated.\n- **Protect legacy systems from the AI**: rate limits, timeouts, circuit breakers, caching. A SOAP service built for 20 users will fall over when an agent loops.\n- **Make errors legible**: return structured errors the model can act on (`retryable: true`, `retry_after_s`) instead of stack traces.\n\nTool design rule: few, well-named, narrowly scoped tools beat one `run_anything` tool. Treat tool outputs as untrusted input when you feed them back to a model (a Jira ticket can contain an injection).\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  agent[\"Agent or LLM client\"] -->|\"MCP: initialize, tools/list, tools/call<br/>OAuth2 bearer token\"| v\n  subgraph srv[\"MCP server (async)\"]\n    v[\"1 Validate arguments<br/>JSON Schema or Pydantic\"] --> az[\"2 Authorize<br/>caller scopes cover tool scopes\"] --> rl[\"3 Rate limit and circuit breaker<br/>per backend\"] --> ad[\"4 Call adapter<br/>timeout, jittered retry\"] --> rd[\"5 Redact, truncate, audit\"]\n  end\n  ad --> sql[\"SQL adapter<br/>read-only role, bound params, row cap\"] --> db[(\"Postgres or Oracle\")]\n  ad --> soap[\"SOAP adapter<br/>XML envelope, fault mapping\"] --> erp[(\"ERP\")]\n  ad --> rest[\"REST adapter (Jira)<br/>429 with Retry-After, idempotency keys\"] --> jira[(\"Jira Cloud\")]\n  rd -->|\"result: content, isError, structured data\"| agent\n```\n\nCircuit breaker states: CLOSED, then OPEN after N failures, then HALF_OPEN for a probe, then CLOSED again. An open breaker returns isError with retryable and retry_after_s immediately, which shields the backend.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **MCP server fronting adapters** | +1 hop (~5-20 ms) | High: stateless servers, one integration serves many agents/clients | Medium: schemas, authz, adapters | Low-Medium; reusable across agents |\n| **Hard-coded per-agent function tools** | Lowest | Poor: each agent re-implements each integration | Low per agent, High across the org | Medium: duplicated maintenance |\n| **iPaaS / ESB (MuleSoft, Boomi) + generic API tool** | Higher (flow engine) | High; strong governance | High: licensing, separate team and tooling | High: license + services |\n\n# Enterprise War Stories & Edge Cases\n\n**1. The agent that DDoS'd the ERP.** An agent paging through purchase orders issued 4,000 SOAP calls in two minutes; the ERP's single app server stalled month-end close. *Remediation:* token-bucket limits per backend sized to the legacy system's capacity (not the model's appetite), response caching, a circuit breaker, bulk-query tools (`list_orders(since, limit)`), and an alert on per-backend call rate.\n\n**2. SQL injection through the \"natural language to SQL\" tool.** A tool accepted a raw `where` string; a crafted ticket made the model emit `1=1; DROP TABLE...`. The DB role could write. *Remediation:* read-only database role (the real control), parameterized queries with an allowlist of tables/columns, enumerated filters instead of free-form SQL, `statement_timeout` and `LIMIT`, and tests that feed injection strings.\n\n**3. Timezone and encoding drift through SOAP.** Dates came back as local time without offsets and names in Latin-1; invoices were assigned to the wrong fiscal day and customer names were corrupted. *Remediation:* normalize at the adapter boundary (explicit timezone, UTF-8 decoding, schema-validated output), contract tests against recorded legacy responses, and surfacing the original raw value in an audit field.\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design the integration layer that lets AI agents at a global manufacturer read from SAP (SOAP/RFC), an Oracle reporting DB and Jira, and create Jira tickets and ERP change requests, for 15,000 employees. Legacy ERP capacity is 40 concurrent users and must not degrade month-end close.\n\n**Requirements**\n- Standard tool interface (MCP) usable by multiple agents and vendors; per-user permissions propagate to backends.\n- Protect backends: cap load, degrade gracefully, never write without approval.\n- Auditable: who (user + agent) invoked which tool with what arguments, and what changed.\n\n**Sizing**\n- Users: 15,000; assume 12% weekly active using agents = 1,800; peak concurrent agent sessions = 5% of those = 90; each session issues a tool call every ~20 s => **4.5 tool calls/s**; with agent fan-out (3 parallel calls) peak **~14 calls/s** across all backends.\n- Backend split: 55% Oracle reporting (read replica), 30% Jira, 15% SAP SOAP. SAP load = 14 x 0.15 = **2.1 calls/s**; at ~600 ms per call that is 1.3 concurrent calls, well within the 40-user capacity; but an unbounded agent loop could reach 50+/s, so enforce a **hard cap of 8 calls/s and 6 concurrent** with a token bucket and a bulkhead semaphore, plus a **cache** (60 s TTL) with expected 45% hit rate => ~1.2 backend calls/s.\n- Oracle: read replica connection pool of 30; `statement_timeout` 5 s; `FETCH FIRST 50 ROWS` cap. Average query 80 ms => 14 x 0.55 x 0.08 = 0.6 concurrent. Fine.\n- Jira Cloud: rate limit ~100 requests/s per app but per-user quotas lower; use a single service app with per-user attribution, 429 handling, and cache of issue reads (30 s).\n- Audit log: 14 calls/s x 86,400 x 0.3 duty (business hours) = ~360k calls/day x 2 KB = **~720 MB/day**, 1 year = 260 GB; ship to the SIEM.\n- MCP server pods: stateless, 3 replicas (N+1 across 2 zones), 500 req/s each is far above need, sized for availability not throughput.\n\n**Component breakdown**\n1. MCP gateway: OAuth2 token validation (Module 12), scope-to-tool mapping, tool registry with versioned JSON Schemas.\n2. Tool servers per domain (ERP, Data, Work-management) deployed independently; each owns its adapters and breakers.\n3. Adapters: SOAP (envelope builder/parser, fault mapping, WS-Security through a vault-injected secret), SQL (read-only role, allowlisted views, bound params), Jira REST (idempotency keys on create).\n4. Write path: tools that mutate return a **proposal** (diff + preview); a separate `commit_change` tool requires human approval token (Module 10).\n5. Resilience: per-backend token bucket, bulkhead, circuit breaker, jittered retries honoring `Retry-After`, response cache.\n6. Observability: per-tool latency/error metrics, backend saturation dashboards, audit trail to SIEM.\n\n**Failure modes**\n- Agent loop hammers a backend: per-backend and per-user quotas, loop detection on repeated identical calls, breaker.\n- Backend outage: open breaker returns `retryable: true` with `retry_after_s`; agents switch to cached or tell the user plainly.\n- Schema drift in SOAP response: contract tests on recorded payloads, strict output validation, alert on parse failures.\n- Confused-deputy: tool executes with the *user's* delegated identity, not a god-mode service account; row-level security in Oracle.\n- Prompt injection from a Jira description: tool outputs flagged as untrusted content in the prompt; no tool may be invoked solely on instructions found in tool output without user confirmation.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's Head of ERP Operations says: *\"You want to put an AI in front of our SAP system. Last time a vendor's integration locked up month-end close for six hours. Give me one reason I should say yes.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"That incident is exactly the risk I'd want protected against, and I wouldn't ask you to say yes on trust. The failure pattern is predictable: a client that doesn't know your system's limits sends traffic as fast as it can. AI agents are worse at that than most, because a confused agent can loop.\"\n\n*Impact.* \"If this lock-up happened again during close, the cost isn't only six hours of your team's time, it's finance reporting deadlines and the credibility of the whole AI program.\"\n\n*Remedy.* \"So the design starts from your system's limits, not the AI's appetite. First, every call goes through a gateway that caps SAP traffic at eight calls a second and six at a time, numbers your Basis team sets and can change, far below your tested capacity. Second, if SAP slows or errors, a circuit breaker stops sending traffic within seconds and the agent tells the user it's unavailable, so we back off rather than pile on. Third, there's a month-end freeze switch your team controls that turns the integration read-only from cache. And everything is read-only for the first quarter: the agent can look things up, but any change is a proposal a person approves. I'll run a load test against your quality system with a deliberately misbehaving agent, with your Basis team watching their dashboards, before we touch production.\"\n", "lab": "\"\"\"Module 11 lab: an MCP-style JSON-RPC 2.0 tool server fronting legacy systems.\n\nAdapters: a real read-only SQLite \"ERP\" database (parameterized, allowlisted), a SOAP/XML service (envelope\nbuild + parse + fault mapping), and a Jira-like REST API that rate-limits with Retry-After. The server adds\nschema validation, scope-based authorization, per-backend circuit breakers, retries with jittered backoff and\nstructured, model-legible errors. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport random\nimport sqlite3\nimport sys\nimport threading\nimport time\nimport xml.etree.ElementTree as ET\nfrom enum import Enum\nfrom typing import Any, Awaitable, Callable\n\nfrom pydantic import BaseModel, Field, ValidationError\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab11\")\n\n\nclass ToolError(Exception):\n    code = -32000\n    retryable = False\n\n    def __init__(self, message: str, retry_after_s: float | None = None) -> None:\n        super().__init__(message)\n        self.retry_after_s = retry_after_s\n\n\nclass BackendUnavailable(ToolError):\n    retryable = True\n\n\nclass RateLimited(ToolError):\n    retryable = True\n\n\nclass SoapFault(ToolError):\n    pass\n\n\nclass Forbidden(ToolError):\n    code = -32003\n\n\nclass InvalidParams(ToolError):\n    code = -32602\n\n\nclass CircuitOpen(ToolError):\n    retryable = True\n\n\nclass CircuitBreaker:\n    class State(str, Enum):\n        CLOSED = \"closed\"\n        OPEN = \"open\"\n        HALF_OPEN = \"half_open\"\n\n    def __init__(self, threshold: int = 3, reset_s: float = 0.2) -> None:\n        self.threshold, self.reset_s = threshold, reset_s\n        self.failures, self.opened_at, self.state = 0, 0.0, self.State.CLOSED\n\n    def before(self) -> None:\n        if self.state is self.State.OPEN:\n            if time.monotonic() - self.opened_at >= self.reset_s:\n                self.state = self.State.HALF_OPEN\n            else:\n                raise CircuitOpen(\"backend circuit open\", retry_after_s=round(self.reset_s - (time.monotonic() - self.opened_at), 3))\n\n    def success(self) -> None:\n        self.failures, self.state = 0, self.State.CLOSED\n\n    def failure(self) -> None:\n        self.failures += 1\n        if self.state is self.State.HALF_OPEN or self.failures >= self.threshold:\n            self.state, self.opened_at = self.State.OPEN, time.monotonic()\n\n\n# ---------------- adapters -------------------------------------------------------------------------\nclass SqlAdapter:\n    \"\"\"Read-only access to an allowlisted view. Values are always bound parameters.\"\"\"\n\n    ALLOWED_COLUMNS = {\"order_id\", \"supplier\", \"status\", \"amount_cents\"}\n\n    def __init__(self) -> None:\n        self.db = sqlite3.connect(\":memory:\", check_same_thread=False)  # used via to_thread; serialized by the lock below\n        self._lock = threading.Lock()\n        self.db.execute(\"CREATE TABLE purchase_orders (order_id INTEGER PRIMARY KEY, supplier TEXT, status TEXT, amount_cents INTEGER)\")\n        self.db.executemany(\"INSERT INTO purchase_orders VALUES (?,?,?,?)\",\n                            [(1001, \"Acme\", \"OPEN\", 125000), (1002, \"Borealis\", \"CLOSED\", 9900), (1003, \"Acme\", \"OPEN\", 480000)])\n        self.db.commit()\n        self.db.execute(\"PRAGMA query_only = ON\")  # belt and braces: connection cannot write\n\n    async def query_orders(self, supplier: str | None, status: str | None, limit: int) -> list[dict[str, Any]]:\n        clauses, params = [], []\n        for col, val in ((\"supplier\", supplier), (\"status\", status)):\n            if val is not None:\n                clauses.append(f\"{col} = ?\")  # column names come from code, never from the caller\n                params.append(val)\n        where = f\"WHERE {' AND '.join(clauses)}\" if clauses else \"\"\n        sql = f\"SELECT order_id, supplier, status, amount_cents FROM purchase_orders {where} ORDER BY order_id LIMIT ?\"\n        def run() -> list[tuple[Any, ...]]:\n            with self._lock:\n                return self.db.execute(sql, [*params, limit]).fetchall()\n\n        rows = await asyncio.to_thread(run)\n        return [dict(zip((\"order_id\", \"supplier\", \"status\", \"amount_cents\"), r)) for r in rows]\n\n\nclass SoapAdapter:\n    NS = {\"s\": \"http://schemas.xmlsoap.org/soap/envelope/\", \"e\": \"urn:erp:inventory\"}\n\n    def __init__(self) -> None:\n        self.calls, self.fail_first = 0, 2\n\n    @staticmethod\n    def build_envelope(sku: str) -> str:\n        ET.register_namespace(\"s\", SoapAdapter.NS[\"s\"])\n        env = ET.Element(f\"{{{SoapAdapter.NS['s']}}}Envelope\")\n        body = ET.SubElement(env, f\"{{{SoapAdapter.NS['s']}}}Body\")\n        req = ET.SubElement(body, \"{urn:erp:inventory}GetStockLevel\")\n        ET.SubElement(req, \"{urn:erp:inventory}Sku\").text = sku  # ElementTree escapes content: no XML injection\n        return ET.tostring(env, encoding=\"unicode\")\n\n    async def _transport(self, xml: str) -> str:\n        \"\"\"Simulated endpoint: flaky first calls, fault for unknown SKU, Latin-1 style data normalized upstream.\"\"\"\n        self.calls += 1\n        await asyncio.sleep(0.002)\n        if self.calls <= self.fail_first:\n            raise BackendUnavailable(\"ERP gateway timeout\")\n        sku = ET.fromstring(xml).find(\".//e:Sku\", self.NS).text  # type: ignore[union-attr]\n        s = self.NS[\"s\"]\n        if sku != \"WIDGET-X\":\n            return (f'<s:Envelope xmlns:s=\"{s}\"><s:Body><s:Fault><faultcode>Client<\/faultcode>'\n                    f\"<faultstring>Unknown SKU<\/faultstring><\/s:Fault><\/s:Body><\/s:Envelope>\")\n        return (f'<s:Envelope xmlns:s=\"{s}\"><s:Body><e:GetStockLevelResponse xmlns:e=\"urn:erp:inventory\">'\n                f\"<e:OnHand>42<\/e:OnHand><e:AsOf>2025-03-04T23:30:00+01:00<\/e:AsOf><\/e:GetStockLevelResponse><\/s:Body><\/s:Envelope>\")\n\n    async def stock_level(self, sku: str) -> dict[str, Any]:\n        root = ET.fromstring(await self._transport(self.build_envelope(sku)))\n        fault = root.find(\".//s:Fault\", self.NS)\n        if fault is not None:\n            raise SoapFault(fault.findtext(\"faultstring\") or \"SOAP fault\")\n        return {\"sku\": sku, \"on_hand\": int(root.findtext(\".//e:OnHand\", namespaces=self.NS)),  # type: ignore[arg-type]\n                \"as_of\": root.findtext(\".//e:AsOf\", namespaces=self.NS)}\n\n\nclass JiraAdapter:\n    def __init__(self) -> None:\n        self.calls = 0\n        self.issues = {\"OPS-1\": {\"key\": \"OPS-1\", \"summary\": \"Pump failure\", \"status\": \"Open\"}}\n\n    async def get_issue(self, key: str) -> dict[str, Any]:\n        self.calls += 1\n        await asyncio.sleep(0.001)\n        if self.calls == 1:\n            raise RateLimited(\"429 Too Many Requests\", retry_after_s=0.01)\n        if key not in self.issues:\n            raise ToolError(f\"issue {key} not found\")\n        return self.issues[key]\n\n\n# ---------------- MCP server -----------------------------------------------------------------------\nclass Tool(BaseModel):\n    name: str\n    description: str\n    input_schema: dict[str, Any]\n    scopes: set[str]\n    backend: str\n\n\nclass QueryOrdersArgs(BaseModel):\n    supplier: str | None = Field(None, max_length=64)\n    status: str | None = Field(None, pattern=\"^(OPEN|CLOSED)$\")\n    limit: int = Field(10, ge=1, le=50)\n\n\nclass StockArgs(BaseModel):\n    sku: str = Field(pattern=r\"^[A-Z0-9\\-]{3,20}$\")\n\n\nclass IssueArgs(BaseModel):\n    key: str = Field(pattern=r\"^[A-Z]{2,10}-\\d{1,6}$\")\n\n\nclass McpServer:\n    def __init__(self) -> None:\n        self.sql, self.soap, self.jira = SqlAdapter(), SoapAdapter(), JiraAdapter()\n        self.breakers = {b: CircuitBreaker() for b in (\"sql\", \"soap\", \"jira\")}\n        self._handlers: dict[str, tuple[Tool, type[BaseModel], Callable[[Any], Awaitable[Any]]]] = {}\n        self._register(Tool(name=\"query_purchase_orders\", description=\"List purchase orders, optionally filtered by supplier and status.\",\n                            input_schema=QueryOrdersArgs.model_json_schema(), scopes={\"erp:read\"}, backend=\"sql\"),\n                       QueryOrdersArgs, lambda a: self.sql.query_orders(a.supplier, a.status, a.limit))\n        self._register(Tool(name=\"get_stock_level\", description=\"Current on-hand stock for a SKU from the inventory ERP.\",\n                            input_schema=StockArgs.model_json_schema(), scopes={\"erp:read\"}, backend=\"soap\"),\n                       StockArgs, lambda a: self.soap.stock_level(a.sku))\n        self._register(Tool(name=\"get_jira_issue\", description=\"Fetch a Jira issue by key.\",\n                            input_schema=IssueArgs.model_json_schema(), scopes={\"jira:read\"}, backend=\"jira\"),\n                       IssueArgs, lambda a: self.jira.get_issue(a.key))\n\n    def _register(self, tool: Tool, model: type[BaseModel], fn: Callable[[Any], Awaitable[Any]]) -> None:\n        self._handlers[tool.name] = (tool, model, fn)\n\n    async def handle(self, request: dict[str, Any], caller_scopes: set[str]) -> dict[str, Any]:\n        rid, method, params = request.get(\"id\"), request.get(\"method\"), request.get(\"params\") or {}\n        try:\n            if request.get(\"jsonrpc\") != \"2.0\" or not isinstance(method, str):\n                return self._err(rid, -32600, \"invalid request\")\n            if method == \"initialize\":\n                return self._ok(rid, {\"protocolVersion\": \"2025-03-26\", \"capabilities\": {\"tools\": {}}, \"serverInfo\": {\"name\": \"lab11\", \"version\": \"1.0\"}})\n            if method == \"tools/list\":\n                tools = [t.model_dump(mode=\"json\", exclude={\"scopes\", \"backend\"}) for t, _, _ in self._handlers.values() if t.scopes <= caller_scopes]\n                return self._ok(rid, {\"tools\": tools})\n            if method == \"tools/call\":\n                return self._ok(rid, await self._call(params, caller_scopes))\n            return self._err(rid, -32601, f\"method {method} not found\")\n        except ToolError as exc:  # protocol-level problems (authz, params)\n            return self._err(rid, exc.code, str(exc))\n\n    async def _call(self, params: dict[str, Any], scopes: set[str]) -> dict[str, Any]:\n        name = params.get(\"name\", \"\")\n        if name not in self._handlers:\n            raise InvalidParams(f\"unknown tool {name!r}\")\n        tool, model, fn = self._handlers[name]\n        if not tool.scopes <= scopes:\n            raise Forbidden(f\"missing scopes: {sorted(tool.scopes - scopes)}\")\n        try:\n            args = model.model_validate(params.get(\"arguments\") or {})\n        except ValidationError as exc:\n            raise InvalidParams(\"; \".join(f\"{'.'.join(map(str, e['loc']))}: {e['msg']}\" for e in exc.errors())) from exc\n        breaker = self.breakers[tool.backend]\n        try:\n            breaker.before()\n            data = await self._with_retry(lambda: fn(args), breaker)\n            return {\"isError\": False, \"structuredContent\": data, \"content\": [{\"type\": \"text\", \"text\": json.dumps(data)}]}\n        except ToolError as exc:  # execution errors are returned to the model, not raised as protocol errors\n            err = {\"message\": str(exc), \"retryable\": exc.retryable, \"retry_after_s\": exc.retry_after_s}\n            return {\"isError\": True, \"structuredContent\": err, \"content\": [{\"type\": \"text\", \"text\": json.dumps(err)}]}\n\n    async def _with_retry(self, fn: Callable[[], Awaitable[Any]], breaker: CircuitBreaker, attempts: int = 4) -> Any:\n        for i in range(1, attempts + 1):\n            try:\n                breaker.before()  # stop retrying the moment the breaker opens mid-loop\n                result = await asyncio.wait_for(fn(), 1.0)\n                breaker.success()\n                return result\n            except (BackendUnavailable, RateLimited, asyncio.TimeoutError) as exc:\n                breaker.failure() if isinstance(exc, (BackendUnavailable, asyncio.TimeoutError)) else None\n                if i == attempts:\n                    raise BackendUnavailable(f\"backend failed after {attempts} attempts\") from exc\n                wait = exc.retry_after_s if isinstance(exc, RateLimited) and exc.retry_after_s else random.uniform(0, 0.004 * 2 ** i)\n                await asyncio.sleep(wait or 0)\n\n    @staticmethod\n    def _ok(rid: Any, result: Any) -> dict[str, Any]:\n        return {\"jsonrpc\": \"2.0\", \"id\": rid, \"result\": result}\n\n    @staticmethod\n    def _err(rid: Any, code: int, message: str) -> dict[str, Any]:\n        return {\"jsonrpc\": \"2.0\", \"id\": rid, \"error\": {\"code\": code, \"message\": message}}\n\n\nasync def main() -> None:\n    server = McpServer()\n    scopes = {\"erp:read\", \"jira:read\"}\n    rpc = lambda i, m, p=None, s=scopes: server.handle({\"jsonrpc\": \"2.0\", \"id\": i, \"method\": m, \"params\": p}, s)  # noqa: E731\n\n    log.info(\"initialize\", extra={\"ctx\": (await rpc(1, \"initialize\"))[\"result\"]})\n    listed = (await rpc(2, \"tools/list\"))[\"result\"][\"tools\"]\n    log.info(\"tools\", extra={\"ctx\": {\"names\": [t[\"name\"] for t in listed]}})\n    log.info(\"restricted caller sees\", extra={\"ctx\": {\"names\": [t[\"name\"] for t in (await rpc(3, \"tools/list\", s={\"jira:read\"}))[\"result\"][\"tools\"]]}})\n\n    calls = [(\"query_purchase_orders\", {\"supplier\": \"Acme\", \"status\": \"OPEN\"}),\n             (\"query_purchase_orders\", {\"supplier\": \"x' OR '1'='1\"}),  # injection string is just a bound value\n             (\"query_purchase_orders\", {\"status\": \"OPEN; DROP TABLE purchase_orders\"}),\n             (\"get_stock_level\", {\"sku\": \"WIDGET-X\"}),\n             (\"get_stock_level\", {\"sku\": \"NOPE-1\"}),\n             (\"get_jira_issue\", {\"key\": \"OPS-1\"}),\n             (\"drop_everything\", {})]\n    for i, (name, args) in enumerate(calls, 10):\n        resp = await rpc(i, \"tools/call\", {\"name\": name, \"arguments\": args})\n        body = resp.get(\"result\", {}).get(\"structuredContent\") if \"result\" in resp else resp[\"error\"]\n        log.info(\"call\", extra={\"ctx\": {\"tool\": name, \"args\": args, \"isError\": resp.get(\"result\", {}).get(\"isError\"), \"body\": body}})\n\n    denied = await rpc(30, \"tools/call\", {\"name\": \"get_jira_issue\", \"arguments\": {\"key\": \"OPS-1\"}}, {\"erp:read\"})\n    log.info(\"authz\", extra={\"ctx\": denied[\"error\"]})\n\n    server.soap.fail_first, server.soap.calls = 10**6, 0  # backend outage: breaker should trip and shield it\n    for i in range(4):\n        r = await rpc(40 + i, \"tools/call\", {\"name\": \"get_stock_level\", \"arguments\": {\"sku\": \"WIDGET-X\"}})\n        log.info(\"outage\", extra={\"ctx\": {\"attempt\": i, \"breaker\": server.breakers[\"soap\"].state, \"backend_calls\": server.soap.calls,\n                                          \"error\": r[\"result\"][\"structuredContent\"][\"message\"]}})\n\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n"}, {"id": "m12", "num": "12", "dir": "12_rbac_security", "title": "OAuth2/OIDC & Tenant Isolation", "track": "Trust and operations", "readme": "# Intuition & Mental Model\n\nIn a multi-tenant AI product, the nightmare is not a hallucination, it is **Tenant A's contract appearing in Tenant B's answer**. That is a data breach, and with RAG it happens easily: all customers' chunks live in one vector index, the similarity search happily returns the nearest chunk from *anyone*, and the model dutifully quotes it.\n\nThe defense is the same as in any secure system, applied at every layer:\n1. **Authentication (who are you?)**: OIDC login at an identity provider (Okta, Entra ID) gives the app a signed **JWT**. The API verifies signature, issuer (`iss`), audience (`aud`), expiry (`exp`), and the algorithm allowlist, with keys fetched from the provider's JWKS endpoint and rotated by `kid`.\n2. **Authorization (what may you do?)**: roles map to permissions (RBAC); attributes such as department or clearance refine them (ABAC).\n3. **Isolation (whose data can you touch?)**: the **tenant id comes from the verified token, never from the request body or the model**, and is injected as a mandatory metadata filter on every retrieval. Filtering happens *inside* the index query (pre-filter), not after top-k.\n4. **Defense in depth**: namespace-per-tenant for the largest customers, row-level security in the relational store, per-tenant encryption keys for crypto-shredding, audit logs that record the effective filter.\n\nThe golden rule: the model is not a security boundary. Anything it could be tricked into asking for must already be impossible for the caller.\n\n# Production Architecture & Data Flow\n\n```mermaid\nflowchart TD\n  user[\"User\"] -->|\"OIDC code flow with PKCE\"| idp[\"Identity provider<br/>Okta or Entra ID\"]\n  idp -->|\"JWT, 10 min lifetime\"| spa[\"Browser or SPA\"]\n  spa -->|\"Authorization: Bearer\"| a1\n  subgraph gw[\"API gateway and app (private subnet)\"]\n    a1[\"1 Verify JWT<br/>alg allowlist, kid to JWKS, iss, aud, exp, nbf\"] --> a2[\"2 Build RequestContext<br/>tenant from the token claim only\"] --> a3[\"3 Authorize<br/>RBAC, deny by default\"] --> a4[\"4 Retrieve with injected filter<br/>tenant_id AND ACL groups\"] --> a5[\"5 LLM answers from returned chunks only\"] --> a6[\"6 Audit log to SIEM\"]\n  end\n  a4 --> vdb[(\"Vector DB<br/>payload index on tenant_id\")]\n  a4 --> pg[(\"Postgres<br/>row-level security\")]\n```\n\nFail-closed posture: a missing or invalid claim returns 401, and a store query without a tenant filter refuses to run.\n\n# Architectural Trade-Off Matrix\n\n| Approach | Latency | Scalability | Implementation Complexity | Cost |\n|---|---|---|---|---|\n| **Shared index + mandatory metadata filter (pre-filter)** | Low; filtered ANN needs good payload indexes | Excellent: thousands of tenants in one cluster | Medium: filter must be un-bypassable, recall tuning for selective filters | Lowest |\n| **Namespace / collection per tenant** | Lowest per query (small index) | Good up to ~10k namespaces; per-tenant overhead and lifecycle | Medium | Medium: memory floor per tenant |\n| **Dedicated cluster / account per tenant** | Lowest, no noisy neighbors | Limited by ops effort | High: provisioning, upgrades, observability x N | Highest; justified for regulated whales |\n\n# Enterprise War Stories & Edge Cases\n\n**1. Tenant id taken from the request body.** The search endpoint accepted `{\"tenant_id\": \"...\"}` from the client \"for convenience.\" A pentester changed it and read another customer's documents. *Remediation:* derive the tenant exclusively from the verified token claim, ignore/deny body-supplied values, add an integration test that attempts cross-tenant reads for every endpoint, and make the vector store client constructible only with a `RequestContext`.\n\n**2. `alg: none` and key confusion.** A homegrown JWT check trusted the token's own `alg` header; an attacker forged a token with `alg=none`, and another variant used the public RSA key as an HMAC secret. *Remediation:* pin allowed algorithms server-side, select the key by `kid` from the issuer's JWKS, reject unsigned tokens, validate `iss`/`aud`, and use a vetted library (PyJWT/authlib) in production.\n\n**3. Post-filtering leaked through top-k.** The system retrieved top 10 across all tenants then dropped other tenants' rows; users saw empty or poor results, and timing and count side channels hinted at other tenants' content. *Remediation:* pre-filter inside the ANN query, per-tenant payload index, constant-shape error handling, and a monitoring query that alerts if any returned chunk has a tenant different from the caller's (canary assertion).\n", "design": "# Senior FDE System Design Crucible\n\n**Prompt:** Design tenant isolation for a multi-tenant document-QA SaaS with 4,000 enterprise tenants (sizes from 1k to 40M chunks), SSO via customer IdPs (Okta, Entra, PingFederate), document-level ACLs synchronized from SharePoint, 300 QPS peak search, and a contractual guarantee of zero cross-tenant exposure. Two tenants require dedicated infrastructure and customer-managed keys.\n\n**Requirements**\n- Authenticate against many IdPs; map each to a tenant; short-lived tokens, SCIM deprovisioning within 5 minutes.\n- Document-level ACL enforcement at retrieval; p95 search < 250 ms.\n- Provable isolation: tests, canaries, audit trails; tenant offboarding with verifiable deletion.\n\n**Sizing**\n- Data: long-tail tenant sizes: 3,900 small/medium tenants x avg 400k chunks = **1.56 B chunks**, plus 100 large tenants x 20 M = **2.0 B**; total **~3.6 B chunks**. Vectors 768 dim int8 = 768 B: 3.6 B x 768 B = **2.8 TB** (+30% graph/overhead = 3.6 TB). Sharded over 24 nodes at 192 GB usable RAM-equivalent with disk-backed HNSW (~150 GB RAM-resident hot set per node).\n- Isolation strategy by tier: small/medium tenants (3,900) share collections partitioned by hash(tenant_id) into 64 shards with payload index on `tenant_id`; the 100 large tenants get dedicated collections; the 2 regulated tenants get dedicated clusters + CMK.\n- Search load: 300 QPS peak x top-50 candidates; filtered ANN on selective filters (tenant = 0.03% of index) needs a payload-indexed pre-filter; verify recall@10 stays >= 0.95 against brute-force on a nightly sample.\n- ACL sync: SharePoint change feed ~2 M permission changes/day = 23/s average; store ACLs as `acl_groups` arrays on chunks (denormalized) with group-membership expansion at query time from a cache (5 min TTL): token groups claim (<=200 groups) intersect `acl_groups`. If group count > 200 use the \"groups overage\" lookup via Graph API cached 5 min.\n- Token validation: 300 QPS x ~0.1 ms (cached JWKS, local verify) = negligible; JWKS refresh on unknown `kid` rate-limited to 1 per 30 s per issuer.\n- Audit: 300 QPS x 86,400 x 0.4 duty x 1.5 KB = **~15.5 GB/day** to SIEM/object storage.\n- Offboarding: deleting 20M chunks from a shared collection: delete-by-filter ~15 min plus compaction; with per-tenant CMK, destroying the key gives crypto-shredding immediately for the dedicated tenants.\n\n**Component breakdown**\n1. Identity: per-tenant IdP config (issuer, audience, JWKS URL) in a registry; token validation selects config by `iss` after allowlist lookup; `tid` is derived from registry mapping (not a trusted claim alone).\n2. Gateway: builds `RequestContext`; the retrieval SDK only accepts a context, so unfiltered queries are unrepresentable.\n3. Retrieval: pre-filter on `tenant_id` and `acl_groups`; hybrid index (Module 06) with the same filter in BM25.\n4. Postgres metadata with row-level security keyed on a session variable; DB role has no BYPASSRLS.\n5. Canary service: continuously issues queries as synthetic tenants with seeded \"poison\" documents and asserts they never appear elsewhere.\n6. Key management: per-tenant data keys wrapped by KMS CMKs; rotation and revocation runbooks.\n\n**Failure modes**\n- Mis-mapped tenant in IdP registry: registry changes need two-person review and a synthetic login test.\n- Filter dropped by a refactor: contract test enumerates all retrieval call sites; CI fails if any call lacks a context; runtime assert on every response.\n- Stale ACLs after a user is removed: SCIM + short token life + cache TTL 5 min bound exposure, documented; critical removals trigger cache bust.\n- Noisy neighbor: per-tenant rate limits (Module 02) and shard-level concurrency caps.\n- Embedding inversion risk: vectors treated as sensitive as the text; same encryption and access controls.\n\n# Client Simulation Challenge\n\n**Scenario.** The client's CISO says: *\"Your platform stores all customers in one vector index. A single bug and my contracts show up in a competitor's answers. Convince me this is safe, or I walk.\"*\n\n**Word-for-word executive response (Situation-Impact-Remedy):**\n\n*Situation.* \"You've described the right fear, and I won't tell you a shared index is risk-free. One shared index with one filter is a single point of failure, and a bug in that filter is the scenario you're worried about.\"\n\n*Impact.* \"If your contracts reached a competitor, the harm is a confidentiality breach, possible legal exposure, and the loss of your customers' trust. So the question is whether isolation depends on one filter being perfect, and it shouldn't.\"\n\n*Remedy.* \"It doesn't, because there are four independent layers. First, the tenant identity comes only from your signed login token, never from the request, so a user can't ask for another tenant. Second, our search library cannot be called without that identity, so an unfiltered query can't be written by mistake. Third, every response is checked on the way out, and a result from any other tenant stops the request and pages our on-call. Fourth, a canary system runs all day, planting marker documents in test tenants and alerting if one appears anywhere else; I'll show you its log. And because you're a regulated customer, you also have an option I'd recommend: a dedicated index in its own account, encrypted with your own key, so destroying that key makes the data unreadable immediately. You can have your red team attempt cross-tenant access in a staging copy before you sign.\"\n", "lab": "\"\"\"Module 12 lab: JWT verification with key rotation, RBAC, and tenant-isolated vector retrieval.\n\nJWT: HS256 via stdlib hmac with kid-based key lookup and strict claim checks (production uses RS256/ES256 with\nJWKS and a vetted library; the validation *logic* is identical). The vector store refuses queries without a\ntenant filter, the filter is injected from the verified context, ACL groups are enforced inside the search\nloop (pre-filter), and cross-tenant attempts are demonstrated and audited. Run: python3 lab.py\n\"\"\"\nfrom __future__ import annotations\n\nimport asyncio\nimport base64\nimport hashlib\nimport hmac\nimport json\nimport logging\nimport math\nimport random\nimport sys\nimport time\nfrom typing import Any\n\nfrom pydantic import BaseModel, Field\n\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        payload = {\"level\": record.levelname, \"msg\": record.getMessage()}\n        payload.update(getattr(record, \"ctx\", {}))\n        return json.dumps(payload, default=str)\n\n\ndef get_logger(name: str) -> logging.Logger:\n    logger = logging.getLogger(name)\n    if not logger.handlers:\n        h = logging.StreamHandler(sys.stdout)\n        h.setFormatter(JsonFormatter())\n        logger.addHandler(h)\n        logger.setLevel(logging.INFO)\n        logger.propagate = False\n    return logger\n\n\nlog = get_logger(\"lab12\")\n\n\nclass SecurityError(Exception):\n    http_status = 403\n\n\nclass A
